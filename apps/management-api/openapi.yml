                $ref: "#/components/schemas/RemoteStubItemStub"
            jobs:
              type: array
              items:
                $ref: "#/components/schemas/RemoteStubHistoryJob"
    RemoteStubListResponse:
      type: object
      required:
        - remote_stubs
        - pagination
      properties:
        remote_stubs:
          type: array
          items:
            $ref: "#/components/schemas/RemoteStubListRow"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    RemoteStubDetailResponse:
      type: object
      required:
        - remote_stub
      properties:
        remote_stub:
          $ref: "#/components/schemas/RemoteStubDetail"
    RemoteStubJob:
      type: object
      required:
        - id
        - job_type
        - status
        - run_after
      properties:
        id:
          type: integer
          minimum: 1
        job_type:
          type: string
        status:
          type: string
        run_after:
          type: string
          format: date-time
    RemoteStubJobResponse:
      type: object
      required:
        - job
      properties:
        job:
          $ref: "#/components/schemas/RemoteStubJob"
    RemoteStubRepointRequest:
      type: object
      required:
        - provider_feed_id
      properties:
        provider_feed_id:
          type: string
          pattern: "^[1-9]\\d{0,14}$"
          description: Podcast Index feed id. 1–15 digits with no leading zero.
    StorageUsageResponse:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        provider:
          type: string
        bucketName:
          type: string
    User:
      type: object
      required:
        - id
        - id_text
        - verified
        - sharable_status_id
        - created_at
        - account_membership_id
      properties:
        id:
          type: integer
          format: int64
        id_text:
          type: string
        verified:
          type: boolean
        email:
          type: string
          format: email
          nullable: true
        username:
          type: string
          nullable: true
        sharable_status_id:
          type: integer
        created_at:
          type: string
          format: date-time
        account_membership_id:
          type: integer
          enum:
            - 1
            - 2
          description: 1=trial, 2=premium
        membership_expires_at:
          type: string
          format: date-time
          nullable: true
        allow_directory_add_by_rss:
          type: boolean
          nullable: true
        max_add_by_rss_feeds:
          type: integer
          minimum: 0
          nullable: true
        max_manual_refreshes_per_hour:
          type: integer
          minimum: 0
          nullable: true
        track_stats:
          type: boolean
          nullable: true
        allow_notifications:
          type: boolean
          nullable: true
    UserListPagination:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
    UserListResponse:
      type: object
      required:
        - users
        - pagination
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/UserListPagination"
    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          example: username_only
        email:
          type: string
          format: email
          example: email_only@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123
        account_membership_id:
          type: integer
          enum:
            - 1
            - 2
          description: 1=trial, 2=premium
        membership_expires_at:
          type: string
          format: date-time
          nullable: true
        allow_directory_add_by_rss:
          type: boolean
          nullable: true
        max_add_by_rss_feeds:
          type: integer
          minimum: 0
          nullable: true
        max_manual_refreshes_per_hour:
          type: integer
          minimum: 0
          nullable: true
        track_stats:
          type: boolean
          nullable: true
        allow_notifications:
          type: boolean
          nullable: true
        premium_billing_cadence:
          type: string
          enum:
            - monthly
            - annual
      additionalProperties: true

    BillingCheckoutChannel:
      type: object
      required:
        [id, processor_id, platform, storefront_allowlist, enabled, min_client_version, updated_at]
      properties:
        id: { type: integer }
        processor_id: { type: string, enum: [paypal, apple, google_play, test] }
        platform: { type: string, enum: [web, ios, android, foss] }
        storefront_allowlist: { type: array, items: { type: string } }
        enabled: { type: boolean }
        min_client_version: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    BillingProcessorStatus:
      type: object
      required: [processor_id, enabled]
      properties:
        processor_id: { type: string, enum: [paypal, apple, google_play] }
        enabled: { type: boolean }
    BillingCheckoutChannelPatchRequest:
      type: object
      minProperties: 1
      properties:
        enabled: { type: boolean }
        min_client_version: { type: string, nullable: true }
        storefront_allowlist: { type: array, items: { type: string } }
    BillingProcessorProduct:
      type: object
      required:
        [
          id,
          processor_id,
          external_product_id,
          external_base_plan_id,
          billing_product_id,
          billing_cadence,
          is_active,
          updated_at,
        ]
      properties:
        id: { type: integer }
        processor_id: { type: string }
        external_product_id: { type: string }
        external_base_plan_id: { type: string, nullable: true }
        billing_product_id: { type: integer }
        billing_cadence: { type: string, enum: [monthly, annual] }
        is_active: { type: boolean }
        updated_at: { type: string, format: date-time }
    BillingProcessorProductCreateRequest:
      type: object
      required: [processor_id, external_product_id, billing_cadence]
      properties:
        processor_id: { type: string, enum: [paypal, apple, google_play, test] }
        external_product_id: { type: string }
        external_base_plan_id: { type: string, nullable: true }
        billing_cadence: { type: string, enum: [monthly, annual] }
    BillingProcessorProductPatchRequest:
      type: object
      minProperties: 1
      properties:
        is_active: { type: boolean }
        external_product_id: { type: string }
        external_base_plan_id: { type: string, nullable: true }
    BillingAccountTransaction:
      type: object
      required: [id, processor_id, external_transaction_id, settled_at, is_sandbox]
      properties:
        id: { type: integer }
        processor_id: { type: string }
        external_transaction_id: { type: string }
        amount: { type: string, nullable: true }
        currency_code: { type: string, nullable: true }
        settled_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        revocation_reason: { type: string, nullable: true }
        is_sandbox: { type: boolean }
    BillingAccountGrant:
      type: object
      required: [id, source, starts_at, ends_at, admin_editable]
      properties:
        id: { type: integer }
        source: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        billing_transaction_id: { type: integer, nullable: true }
        admin_editable:
          type: boolean
          description: "Admin, trial, legacy import, or migration baseline grant with no processor or claim-token link; end access and revoke may change it."
    BillingWebhookEvent:
      type: object
      required: [id, processor_id, external_event_id, schema_version, status, attempts, received_at]
      properties:
        id: { type: string }
        processor_id: { type: string }
        external_event_id: { type: string }
        schema_version: { type: string }
        status: { type: string, enum: [pending, processed, failed] }
        attempts: { type: integer }
        received_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time, nullable: true }
        process_error: { type: string, nullable: true }
    BillingAccountDetail:
      type: object
      required: [account_id, membership_expires_at, transactions, grants, webhook_events]
      properties:
        account_id: { type: integer }
        membership_expires_at: { type: string, format: date-time, nullable: true }
        transactions:
          { type: array, items: { $ref: "#/components/schemas/BillingAccountTransaction" } }
        grants: { type: array, items: { $ref: "#/components/schemas/BillingAccountGrant" } }
        webhook_events: { type: array, items: { $ref: "#/components/schemas/BillingWebhookEvent" } }
    BillingWebhookEventReplayResult:
      type: object
      required: [status, inbox_event_id]
      properties:
        status: { type: string, enum: [processed, duplicate, ignored_sandbox, failed] }
        inbox_event_id: { type: string }
        account_id: { type: integer }
        membership_expires_at: { type: string, format: date-time, nullable: true }
        error_code: { type: string }
        message: { type: string }
    BillingResyncResult:
      type: object
      required: [account_id, membership_expires_at, retried, refetched, failed]
      properties:
        account_id: { type: integer }
        membership_expires_at: { type: string, format: date-time, nullable: true }
        retried: { type: integer }
        refetched: { type: integer }
        failed: { type: integer }
    BillingGrantRequest:
      type: object
      description: "Exactly one of cadence, days, or ends_at."
      properties:
        cadence: { type: string, enum: [monthly, annual] }
        days: { type: integer, minimum: 1, maximum: 3660 }
        ends_at:
          type: string
          format: date-time
          description: "Must be later than both now and the current expiry."
        note: { type: string, maxLength: 500, description: "Stored in the audit entry only." }
      oneOf:
        - required: [cadence]
        - required: [days]
        - required: [ends_at]
      example:
        days: 30
        note: "Support credit"
    BillingGrantResult:
      type: object
      required: [account_id, applied, membership_expires_at]
      properties:
        account_id: { type: integer }
        applied: { type: boolean }
        membership_expires_at: { type: string, format: date-time, nullable: true }
    BillingMembershipEndRequest:
      type: object
      required: [ends_at]
      properties:
        ends_at:
          type: string
          format: date-time
          description: "Now or a past date ends access then. Must not be later than current access."
        note: { type: string, maxLength: 500, description: "Stored in the audit entry only." }
      example:
        ends_at: "2026-10-01T00:00:00.000Z"
        note: "Refunded off-platform"
    BillingGrantRevokeRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500, description: "Stored in the audit entry only." }
      example:
        note: "Granted in error"
    BillingMembershipChangeResult:
      type: object
      required: [account_id, membership_expires_at]
      properties:
        account_id: { type: integer }
        membership_expires_at: { type: string, format: date-time, nullable: true }
    BillingProtectedAccessErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [access_ends_at]
          properties:
            access_ends_at:
              type: string
              format: date-time
              nullable: true
              description: "When processor or claim-token access ends; null when the targeted grant itself is protected."
      example:
        message: "Paid access continues past the requested end. Cancel or refund it with the processor."
        access_ends_at: "2026-11-01T00:00:00.000Z"
