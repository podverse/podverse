              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /auth/mobile/refresh:
    post:
      operationId: managementPostAuthMobileRefresh
      tags:
        - auth
      summary: POST /auth/mobile/refresh
      description: >
        Public endpoint. Exchanges a refresh JWT for a new access/refresh pair and rotates the admin
        session's refresh token. The newest refresh token and the one presented just before it are
        both accepted, so a client that lost a refresh response can retry with the token it still
        holds. Presenting any older refresh token ends the session as suspected theft.
        `refresh_token_expires_in` is the session idle limit. A missing `refresh_token` is 400
        `refresh_token is required`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenRefreshRequest"
            examples:
              refresh:
                summary: Rotate the refresh token
                value:
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: >
            `Invalid refresh token` — an invalid or expired refresh JWT, a token that is not a
            management refresh token or names no session, a missing or replaced admin, a reused
            refresh token, or an ended session. Carries `code: session_ended` and `notice` when the
            session was ended elsewhere or by reuse (`security`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
              examples:
                sessionEnded:
                  summary: Refresh token reused; the session was ended
                  value:
                    message: Invalid refresh token
                    code: session_ended
                    notice: security
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
