  /stats/flagged-listeners:
    get:
      operationId: managementGetStatsFlaggedListeners
      tags:
        - stats
      summary: GET /stats/flagged-listeners
      description: >
        Lists listeners flagged out of popularity. Active flags are the default. Each row
        includes the pseudonymous listener id, the reason, when the listener was flagged, how
        many times, and listens and opens stored in the last 7 days. Permission/auth note:
        requireCrud('stats', 'read').
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: query
          name: status
          required: false
          description: >
            Which flags to list. active (default) is uncleared, cleared is flags with a clear
            time, and all is both.
          schema:
            type: string
            enum:
              - active
              - cleared
              - all
            default: active
        - in: query
          name: page
          required: false
          description: 1-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementGetStatsFlaggedListenersResponse200"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /stats/flagged-listeners/{id}/clear:
    post:
      operationId: managementPostStatsFlaggedListenersIdClear
      tags:
        - stats
      summary: POST /stats/flagged-listeners/{id}/clear
      description: >
        Clears one flagged listener by row id. A clear holds for the rest of its UTC day; a
        later day's signal flags the listener again. The audit log records the clear.
        Permission/auth note: requireCrud('stats', 'update').
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: Flagged listener row id.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The flag is cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementPostStatsFlaggedListenersIdClearResponse200"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "409":
          description: The flag is already cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
