openapi: 3.0.3
info:
  title: Podverse Management API
  description: Comprehensive OpenAPI specification generated from audited route matrix coverage for Podverse management API.
  version: 2.0.0
servers:
  - url: https://management-api.podverse.fm/api/v2
    description: Production Server
  - url: http://localhost:3100/api/v2
    description: Local Development Server
tags:
  - name: admins
  - name: auth
  - name: database
  - name: feeds
  - name: products
  - name: stats
  - name: storage
  - name: system
  - name: users
  - name: workers
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pv_mgmt_auth
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageQueryOptional:
      in: query
      name: page
      required: false
      description: 1-based page number for paginated list results.
      schema:
        type: integer
        minimum: 1
    LimitQueryOptional:
      in: query
      name: limit
      required: false
      description: Maximum number of items to return per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    StatsRangeQueryOptional:
      in: query
      name: range
      required: false
      description: Aggregation range used for ranked stats list ordering.
      schema:
        type: string
        enum:
          - day
          - 7day
          - 30day
          - 1year
          - all-time
    FeedSortQueryOptional:
      in: query
      name: sort
      required: false
      description: Feed field used for list sorting.
      schema:
        type: string
        enum:
          - id
          - podcast_index_id
          - channel_title
          - lifecycle_state_key
          - url
    SortOrderQueryOptional:
      in: query
      name: order
      required: false
      description: Sort direction for list results.
      schema:
        type: string
        enum:
          - asc
          - desc
    SearchQueryOptional:
      in: query
      name: search
      required: false
      description: Free-text search query for list filtering.
      schema:
        type: string
    QueryTextOptional:
      in: query
      name: q
      required: false
      description: Free-text search query for list filtering.
      schema:
        type: string
    FeedLifecycleQueryOptional:
      in: query
      name: lifecycle
      required: false
      description: Lifecycle-state filter for feed list results.
      schema:
        type: string
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
          nullable: true
          description: Machine-readable error code when available.
        details:
          type: array
          nullable: true
          description: Optional field-level or contextual error details.
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: string
          nullable: true
          description: Request field associated with this detail entry when applicable.
        message:
          type: string
          description: Human-readable detail message.
        code:
          type: string
          nullable: true
          description: Optional machine-readable detail code.
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            message:
              type: string
              description: Error description
              example: Validation failed
            code:
              type: string
              example: validation_error
    AuthenticationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            message:
              type: string
              description: Authentication failure reason
              example: Unauthorized
            code:
              type: string
              example: unauthorized
    AuthorizationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            message:
              type: string
              description: Authorization failure reason
              example: Forbidden
            code:
              type: string
              example: forbidden
    NotFoundErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            message:
              type: string
              description: Resource not found
              example: Not found
            code:
              type: string
              example: not_found
    InternalServerErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            message:
              type: string
              example: Internal server error
            code:
              type: string
              example: internal_server_error
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email for authentication
          example: admin@podverse.fm
        password:
          type: string
          format: password
          description: Password
          example: adminPassword123
    AuthLoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Authenticated successfully
        token:
          type: string
          format: jwt
          description: JWT token (if configured to return in body)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    AuthLogoutResponse:
      type: object
      properties:
        message:
          type: string
          example: Logged out successfully
    AuthSessionResponse:
      type: object
      description: Authenticated admin account
      properties:
        id:
          type: integer
          format: int64
          example: 1
        id_text:
          type: string
          example: admin-01
        email:
          type: string
          nullable: true
          format: email
          example: admin@podverse.fm
        username:
          type: string
          nullable: true
          example: admin
        role:
          type: string
          example: superuser
        permissions:
          $ref: "#/components/schemas/AdminPermissions"
    MobileTokenRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: admin@podverse.fm
        password:
          type: string
          format: password
          example: adminPassword123
    MobileTokenResponse:
      type: object
      required:
        - token_type
        - access_token
        - access_token_expires_in
        - refresh_token
        - refresh_token_expires_in
      properties:
        token_type:
          type: string
          enum:
            - Bearer
          example: Bearer
        access_token:
          type: string
          format: jwt
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        access_token_expires_in:
          type: integer
          format: int32
          example: 900
        refresh_token:
          type: string
          format: jwt
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token_expires_in:
          type: integer
          format: int32
          example: 2592000
    MobileTokenRefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          format: jwt
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    MobileTokenRevokeRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          format: jwt
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    EmptyResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully
    AdminListResponse:
      type: array
      description: List of all admins
      items:
        $ref: "#/components/schemas/Admin"
    AdminCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: Admin email address
          example: newadmin@podverse.fm
        username:
          type: string
          description: Username (letters, digits, period, underscore, hyphen)
          example: newadmin
        password:
          type: string
          format: password
          minLength: 8
          description: Optional password. When omitted, invite link is generated.
          example: securePassword123
        role_id:
          type: string
          description: Optional predefined or custom role id
          example: standard_admin
        permissions:
          $ref: "#/components/schemas/AdminPermissions"
    AdminCreateResponse:
      allOf:
        - $ref: "#/components/schemas/Admin"
        - type: object
          properties:
            message:
              type: string
              example: Admin created. Invite link generated.
            set_password_url:
              type: string
              format: uri
            invite_link:
              $ref: "#/components/schemas/AdminInviteLink"
    AdminUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
          example: updatedadmin@podverse.fm
        username:
          type: string
          nullable: true
          example: updatedadmin
        password:
          type: string
          format: password
          minLength: 8
          example: newSecurePassword123
        role_id:
          type: string
          description: Optional predefined or custom role id
          example: standard_admin
        permissions:
          $ref: "#/components/schemas/AdminPermissions"
    AdminUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/Admin"
    AdminDeleteResponse:
      type: object
      properties:
        message:
          type: string
          example: Admin deleted successfully
    AdminGetResponse:
      type: object
      description: Single admin detail
      allOf:
        - $ref: "#/components/schemas/Admin"
    AdminInviteLinkCreateResponse:
      type: object
      properties:
        invite_link:
          allOf:
            - $ref: "#/components/schemas/AdminInviteLink"
          nullable: true
    AdminInviteLinkRedeemRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Invite token
          example: invite-token-test
        password:
          type: string
          format: password
          minLength: 8
          description: Password to set for invited admin account
          example: securePassword123
    AdminInviteLinkRedeemResponse:
      type: object
      properties:
        message:
          type: string
          example: Password updated
    AdminRoleListResponse:
      type: object
      description: List of available roles
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AdminRole"
    AdminRoleCreateRequest:
      type: object
      required:
        - name
        - feeds_crud
        - feed_takedown_reasons_crud
        - admins_crud
        - stats_crud
        - billing_prices_crud
        - bucket_crud
      properties:
        name:
          type: string
          description: Role name
          example: moderator
        feeds_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        feed_takedown_reasons_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        admins_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        stats_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        billing_prices_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        bucket_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
    AdminRoleCreateResponse:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AdminRole"
    AdminRoleUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: moderator
        feeds_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        feed_takedown_reasons_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        admins_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        stats_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        billing_prices_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        bucket_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
    AdminRoleUpdateResponse:
      type: object
      description: Updated role details
      properties:
        role:
          $ref: "#/components/schemas/AdminRole"
    Admin:
      type: object
      description: Admin user account
      required:
        - id
        - id_text
        - role
        - created_at
      properties:
        id:
          type: integer
          format: int64
          example: 1
        id_text:
          type: string
          description: URL-friendly admin identifier
          example: admin-01
        email:
          type: string
          nullable: true
          format: email
          example: admin@podverse.fm
        username:
          type: string
          nullable: true
          example: admin
        role:
          type: string
          example: superuser
        permissions:
          $ref: "#/components/schemas/AdminPermissions"
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
    CrudPermissionValue:
      type: integer
      minimum: 0
      maximum: 15
      example: 15
    AdminPermissions:
      type: object
      nullable: true
      properties:
        feeds_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        feed_takedown_reasons_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        admins_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        stats_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        billing_prices_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        bucket_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
    AdminInviteLink:
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://management.podverse.fm/admins/redeem-invite-link?token=abc123
        expires_at:
          type: string
          format: date-time
          example: "2024-05-13T10:00:00Z"
        is_expired:
          type: boolean
          example: false
    AdminRole:
      type: object
      description: Admin role with permissions
      properties:
        id:
          type: string
          example: superuser
        name_key:
          type: string
          nullable: true
          example: superuser
        name:
          type: string
          nullable: true
          description: Display name for custom roles; null for predefined roles
          example: Moderation Team
        is_predefined:
          type: boolean
          example: true
        feeds_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        feed_takedown_reasons_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        admins_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        stats_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        billing_prices_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        bucket_crud:
          $ref: "#/components/schemas/CrudPermissionValue"
        created_at:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-01T00:00:00Z"
    DatabaseMutationData:
      type: object
      minProperties: 1
      maxProperties: 20
      additionalProperties:
        anyOf:
          - type: string
          - type: number
          - type: boolean
        nullable: true
    DatabaseFieldMeta:
      type: object
      required:
        - name
        - type
        - nullable
        - updatable
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - integer
            - text
            - boolean
            - timestamp
        nullable:
          type: boolean
        updatable:
          type: boolean
    DatabaseTableMeta:
      type: object
      required:
        - tableName
        - primaryKeyField
        - fields
        - defaultSortField
        - defaultSortDirection
        - maxPageSize
        - readOnly
      properties:
        tableName:
          type: string
        primaryKeyField:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseFieldMeta"
        defaultSortField:
          type: string
        defaultSortDirection:
          type: string
          enum:
            - ASC
            - DESC
        maxPageSize:
          type: integer
          minimum: 1
        readOnly:
          type: boolean
    DatabaseFilterCondition:
      type: object
      required:
        - field
        - operator
      properties:
        field:
          type: string
        operator:
          type: string
          enum:
            - eq
            - neq
            - gt
            - gte
            - lt
            - lte
            - like
            - in
            - is_null
            - is_not_null
        value:
          oneOf:
            - type: string
            - type: number
            - type: array
              maxItems: 50
              items:
                oneOf:
                  - type: string
                  - type: number
    DatabaseSortCondition:
      type: object
      required:
        - field
        - direction
      properties:
        field:
          type: string
        direction:
          type: string
          enum:
            - ASC
            - DESC
    ManagementPostDatabaseTableRequest:
      $ref: "#/components/schemas/DatabaseMutationData"
    ManagementPostDatabaseTableResponse201:
      type: object
      description: Operation-specific response payload for POST /database/{table} (201).
      additionalProperties: true
    ManagementDeleteDatabaseTableIdResponse200:
      type: object
      description: Operation-specific response payload for DELETE /database/{table}/{id} (200).
      additionalProperties: true
    ManagementGetDatabaseTableIdResponse200:
      type: object
      description: Operation-specific response payload for GET /database/{table}/{id} (200).
      additionalProperties: true
    ManagementPatchDatabaseTableIdRequest:
      $ref: "#/components/schemas/DatabaseMutationData"
    ManagementPatchDatabaseTableIdResponse200:
      type: object
      description: Operation-specific response payload for PATCH /database/{table}/{id} (200).
      additionalProperties: true
    ManagementGetDatabaseTableMetaResponse200:
      $ref: "#/components/schemas/DatabaseTableMeta"
    ManagementPostDatabaseTableQueryRequest:
      type: object
      description: Operation-specific request payload for POST /database/{table}/query.
      properties:
        filters:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DatabaseFilterCondition"
        sorts:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/DatabaseSortCondition"
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      additionalProperties: false
    ManagementPostDatabaseTableQueryResponse200:
      type: object
      description: Operation-specific response payload for POST /database/{table}/query (200).
      required:
        - rows
        - total
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          minimum: 0
    ManagementGetDatabaseTablesResponse200:
      type: object
      description: Operation-specific response payload for GET /database/tables (200).
      required:
        - tables
      properties:
        tables:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseTableMeta"
    ManagementPatchFeedsIdPolicyStateRequest:
      type: object
      description: Request payload for feed policy/lifecycle mutation.
      properties:
        lifecycle_state_key:
          type: string
          enum:
            - active
            - pending_archive
            - archived
            - takedown
        active_condition_keys:
          type: array
          items:
            type: string
        lifecycle_reason_key:
          type: string
          nullable: true
        condition_note:
          type: string
          nullable: true
        transition_note:
          type: string
          nullable: true
        spam_item_limit_override:
          type: integer
          minimum: 1
          nullable: true
        max_response_body_bytes_override:
          type: integer
          minimum: 1
          nullable: true
        policy_overrides:
          $ref: "#/components/schemas/FeedPolicyOverrides"
        takedown_transitional:
          type: boolean
      additionalProperties: false
    ManagementPatchFeedsIdPolicyStateResponse200:
      type: object
      description: Updated feed policy/lifecycle state.
      required:
        - feed
      properties:
        feed:
          $ref: "#/components/schemas/FeedOperationsLookupRow"
    ManagementGetFeedsLookupResponse200:
      type: object
      description: Feed lookup result.
      required:
        - feed
      properties:
        feed:
          $ref: "#/components/schemas/FeedOperationsLookupRow"
    ManagementGetFeedsOptionsResponse200:
      type: object
      description: Feed policy options.
      required:
        - lifecycle_states
        - condition_types
        - takedown_reasons
      properties:
        lifecycle_states:
          type: array
          items:
            type: object
            required:
              - state_key
            properties:
              state_key:
                type: string
        condition_types:
          type: array
          items:
            type: object
            required:
              - condition_key
            properties:
              condition_key:
                type: string
        takedown_reasons:
          type: array
          items:
            type: object
            required:
              - reason
            properties:
              reason:
                type: string
    FeedPolicyOverrides:
      type: object
      properties:
        parse_allowed_override:
          type: boolean
          nullable: true
        public_visible_override:
          type: boolean
          nullable: true
        add_allowed_override:
          type: boolean
          nullable: true
      additionalProperties: false
    FeedOperationsLookupRow:
      type: object
      required:
        - id
        - url
        - podcast_index_id
        - lifecycle_state_key
        - updated_source
        - active_condition_keys
        - parse_allowed
        - public_visible
        - add_allowed
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          format: uri
        podcast_index_id:
          type: integer
        spam_item_limit_override:
          type: integer
          nullable: true
        max_response_body_bytes_override:
          type: integer
          nullable: true
        lifecycle_state_key:
          type: string
        lifecycle_reason:
          type: string
          nullable: true
        updated_source:
          type: string
        active_condition_keys:
          type: array
          items:
            type: string
        parse_allowed:
          type: boolean
        public_visible:
          type: boolean
        add_allowed:
          type: boolean
        primary_block_reason:
          type: string
          nullable: true
        policy_overrides:
          allOf:
            - $ref: "#/components/schemas/FeedPolicyOverrides"
          nullable: true
        channel_title:
          type: string
          nullable: true
    ProductPricingRow:
      type: object
      required:
        - id
        - product_code
        - currency_code
        - billing_cadence
        - amount_cents
        - effective_from
        - source
      properties:
        id:
          type: integer
        product_code:
          type: string
          example: membership_premium
        currency_code:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        billing_cadence:
          type: string
          enum:
            - monthly
            - annual
        amount_cents:
          type: integer
          minimum: 0
          example: 300
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          example: management_api
    ManagementPostProductsPricingIdActivateResponse200:
      type: object
      required:
        - message
      description: Operation-specific response payload for POST /products/pricing/{id}/activate (200).
      properties:
        message:
          type: string
          example: Pricing row activated
    ManagementPostProductsPricingIdDeprecateResponse200:
      type: object
      required:
        - message
      description: Operation-specific response payload for POST /products/pricing/{id}/deprecate (200).
      properties:
        message:
          type: string
          example: Pricing row deprecated
    ManagementGetProductsPricingActiveResponse200:
      type: object
      required:
        - data
      description: Operation-specific response payload for GET /products/pricing/active (200).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductPricingRow"
    ManagementPostProductsPricingScheduleRequest:
      type: object
      required:
        - cadence
        - amountCents
      description: Operation-specific request payload for POST /products/pricing/schedule.
      properties:
        productCode:
          type: string
          default: membership_premium
          example: membership_premium
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          default: USD
          example: USD
        cadence:
          type: string
          enum:
            - monthly
            - annual
        amountCents:
          type: integer
          minimum: 0
          example: 350
        effectiveFrom:
          type: string
          format: date-time
        changeReason:
          type: string
          nullable: true
          maxLength: 500
      additionalProperties: false
    ManagementPostProductsPricingScheduleResponse201:
      type: object
      required:
        - data
      description: Operation-specific response payload for POST /products/pricing/schedule (201).
      properties:
        data:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
    ProductMembershipSettingsPatchRequest:
      type: object
      properties:
        freeTrialExpirationSeconds:
          type: integer
          minimum: 60
          maximum: 31536000
        trialMaxAddByRSSFeeds:
          type: integer
          minimum: 0
        trialMaxManualRefreshesPerHour:
          type: integer
          minimum: 0
        premiumMaxAddByRSSFeeds:
          type: integer
