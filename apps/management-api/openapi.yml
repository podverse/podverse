      operationId: managementGetAuthMe
      tags:
        - auth
      summary: GET /auth/me
      description: >
        Authenticated endpoint (bearerAuth, then cookieAuth). Returns the signed-in admin. The token
        must name an active admin session; a web session presented by its cookie is renewed at most
        once a day, and the renewing response re-sets `pv_mgmt_auth`. A 401 for a cookie token also
        clears the cookie, and carries `code: session_ended` and `notice` when the session was ended
        somewhere else.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
