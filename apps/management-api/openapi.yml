          type: integer
          nullable: true
          minimum: 1
          description: Management admin id that cleared the flag. Null while the flag is active.
        listens_last_7_days:
          type: integer
          minimum: 0
          description: Stored listen events in the last 7 days, popularity-counted or not.
        opens_last_7_days:
          type: integer
          minimum: 0
          description: Stored open events in the last 7 days.
