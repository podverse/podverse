        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
              examples:
                unauthorized:
                  summary: No token, an invalid token, or a session this client ended
                  value:
                    message: Unauthorized
                sessionEnded:
                  summary: The session was ended from another device
                  value:
                    message: Unauthorized
                    code: session_ended
                    notice: signed_out_elsewhere
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationErrorResponse"
        "404":
          description: Not found
