appId: com.podverse.app.next
name: Locale Switch Home Smoke
---
# Track 17.8 locale switch smoke coverage.
# E2E devices: "iPhone 17 Pro E2E" / Pixel_6_Pro_API_33_e2e
# Maestro has no launchApp language/locale props (CLI --device-locale only at device start).
# Until Track 16 settings UI lands, switch via More → Smoke controls + i18next.
# Cold start via shared/launch-and-connect.yaml (retries Dev Client connect).

- runFlow: shared/launch-and-connect.yaml
- tapOn:
    id: tab-more
- tapOn:
    id: more-nav-smoke
- assertVisible:
    id: hello-world-screen
- assertVisible: Hello World Testing 123
- takeScreenshot: home-en-US

- tapOn:
    id: hello-world-locale-es
- assertVisible: Prueba de Hola Mundo 123
- takeScreenshot: home-es
