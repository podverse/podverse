appId: com.podverse.app.next
name: Search Flow
---
# Search query -> results -> result detail screenshots.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- assertVisible:
    id: search-empty-query

# Matching web /search: one field, no medium or sort chips. Podcast Index decides what comes back
# and in what order, so a chip could only reorder what that API already chose.
- assertNotVisible:
    id: search-medium-music
- assertNotVisible:
    id: search-sort-a_z
- takeScreenshot: search-screen-initial

- tapOn:
    id: search-input
- inputText: podcast
- assertVisible:
    id: search-result-row-0
- takeScreenshot: search-screen-results

- tapOn:
    id: search-result-row-0
- assertVisible:
    id: podcast-detail-screen
- takeScreenshot: search-screen-result-detail
