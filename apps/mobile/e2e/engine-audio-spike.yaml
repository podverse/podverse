appId: com.podverse.app.next
name: Engine Audio Spike
---
# Master step 2.32 (detail 111): durable Maestro evidence that the first-party media engine
# (podverse-media-engine, NOT react-native-track-player) plays real audio end-to-end and drives
# live now-playing state. This is the engine-focused audio spike; the broader Track 11 player-UI
# transition asserts live in `play-mini-player.yaml`.
#
# Real media: seeded podcast episode enclosures resolve to the test-assets server on :2111; the
# orchestrator rewrites localhost -> 127.0.0.1 (iOS) / 10.0.2.2 (Android) via resolveE2eMediaUrl.
# Requires flow_needs_test_assets + flow_needs_e2e_api (wired in scripts/mobile/e2e-test.sh).
#
# Lock-screen / now-playing limits: iOS Simulator and the Android emulator do NOT expose the OS
# lock screen / Control Center / notification-shade transport to Maestro, so this flow cannot
# screenshot the lock-screen controls directly. Background-audio + remote-command wiring was proven
# for the PG-2b GO gate (detail 091). Here we capture in-app now-playing evidence (mini player +
# active-playback signal); verify true lock-screen controls manually on a physical device.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- tapOn:
    id: search-input
- inputText: podcast
- assertVisible:
    id: search-result-row-0
- tapOn:
    id: search-result-row-0
- assertVisible:
    id: podcast-detail-screen
- assertVisible:
    id: podcast-episode-row-0
- tapOn:
    id: podcast-episode-row-0
- assertVisible:
    id: episode-detail-screen

# Episode HomeFeedRow play button testID is home-row-play-<id_text> (dynamic id); match by regex.
- tapOn:
    id: "home-row-play-.*"

# Network + media load, then the engine reports playing and the orchestrator sets the active target.
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: mini-player
- takeScreenshot: engine-audio-spike-now-playing

# Prove transport control on the shared engine: pause via the mini player, then resume. Playback
# stays on the one native player (no reload) — playback-active-e2e never disappears.
- tapOn:
    id: mini-player
- assertVisible:
    id: full-player-screen
- tapOn:
    id: full-player-play-pause
- assertVisible:
    id: full-player-play-pause
    text: Play
- takeScreenshot: engine-audio-spike-paused
- tapOn:
    id: full-player-play-pause
- assertVisible:
    id: full-player-play-pause
    text: Pause
- takeScreenshot: engine-audio-spike-resumed
