appId: com.podverse.app.next
name: Browse Tab And Tab Bar Pref
---
# Default bar is Home / Browse / For Me / My Library / More. Search is the Home header control.
# Settings does not list Search. For Me is already on the bar.
# Browse is one chip row: directory types in a stable order. Categories and the sort chip
# (filter chrome) appear only when the current type can use them; the sort chip is last.
# Every type opens on Top for the past week and keeps its own sort.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- assertVisible:
    id: tab-browse
- assertNotVisible:
    id: tab-notifications
- tapOn:
    id: tab-browse
- assertVisible:
    id: browse-screen
- extendedWaitUntil:
    visible:
      id: browse-media-type-selector
    timeout: ${TIMEOUT_SLOWER}
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      TRAILING_ID: browse-sort-button
- extendedWaitUntil:
    visible:
      id: browse-sort-button
    timeout: ${TIMEOUT_SLOWER}
# Podcasts opens on Top for the past week.
- assertVisible: "Sort: Week"
- assertVisible:
    id: browse-media-type-selector
- assertVisible:
    id: browse-category-button
# Revealing the sort chip scrolls this row to its trailing edge, which takes Podcasts
# off the leading edge. Put the row back before asserting or tapping the first type.
- runFlow:
    file: shared/restore-chip-row-start.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
- assertVisible:
    id: browse-media-type-podcasts
- assertNotVisible:
    id: browse-media-type-videos
# Phone chip row does not fit Playlists / Users. Swipe the selector itself —
# a %-of-screen start Y can miss the pills, and iOS omits off-screen testIDs.
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
# Livestreams sits before Playlists, so the trailing pair needs one more swipe.
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
- assertVisible:
    id: browse-media-type-playlists
- assertVisible:
    id: browse-media-type-users
# Playlists and users are text-only catalog rows (no HomeFeedRow artwork). Both open on Top for
# the past week, and the seed counts no playlist or profile listens, so each list is empty.
- tapOn:
    id: browse-media-type-playlists
- extendedWaitUntil:
    visible:
      id: browse-list-empty
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible:
    id: "browse-playlist-row-.*"
- takeScreenshot: browse-screen-playlists
# Recent lists the seeded public playlist. Only Playlists changes; Users keeps its own sort.
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      TRAILING_ID: browse-sort-button
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
- tapOn:
    id: browse-sort-button
- tapOn:
    id: browse-sort-recent
- extendedWaitUntil:
    visible:
      id: "browse-playlist-row-.*"
    timeout: ${TIMEOUT_SLOWER}
- assertVisible: "Sort: Recent"
- takeScreenshot: browse-screen-playlists-recent
- runFlow:
    file: shared/reveal-chip-row-leading.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      LEADING_ID: browse-media-type-users
- tapOn:
    id: browse-media-type-users
- extendedWaitUntil:
    visible:
      id: browse-list-empty
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible:
    id: "browse-user-row-.*"
- assertVisible: "Sort: Week"
- takeScreenshot: browse-screen-users
# Livestreams is the chip before Playlists. The row is at its trailing edge here.
- runFlow:
    file: shared/reveal-chip-row-leading.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      LEADING_ID: browse-media-type-livestreams
- tapOn:
    id: browse-media-type-livestreams
- extendedWaitUntil:
    visible:
      text: "E2E Live Audio Stream"
    timeout: ${TIMEOUT_SLOWER}
- assertVisible:
    text: "E2E Scheduled Livestream"
- assertVisible:
    id: home-feed-row-live-e2eLiveStrm01
    rightOf:
      id: home-row-play-e2eLiveStrm01
- assertVisible:
    id: home-feed-row-live-status-e2eLiveSched01
    text: Scheduled
- assertNotVisible:
    id: home-row-play-e2eLiveSched01
- assertNotVisible:
    text: "Scheduled • .*"
- assertNotVisible:
    id: browse-sort-button
- assertNotVisible:
    id: browse-category-button
- takeScreenshot: browse-media-type-livestreams
- tapOn:
    id: home-row-more-e2eLiveStrm01
- extendedWaitUntil:
    visible:
      id: media-row-menu-e2eLiveStrm01
    timeout: ${TIMEOUT_FASTER}
- assertVisible:
    id: media-row-action-share-e2eLiveStrm01
- assertNotVisible:
    id: media-row-action-queue-next-e2eLiveStrm01
- assertNotVisible:
    id: media-row-action-queue-last-e2eLiveStrm01
- assertNotVisible:
    id: media-row-action-add-to-playlist-e2eLiveStrm01
- assertNotVisible:
    id: media-row-action-mark-as-played-e2eLiveStrm01
- takeScreenshot: browse-livestream-row-more-menu
- tapOn:
    id: media-row-menu-e2eLiveStrm01-cancel
- tapOn:
    text: "E2E Live Audio Stream"
- extendedWaitUntil:
    visible:
      id: episode-detail-screen
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: browse-livestream-detail
- runFlow: shared/stack-back.yaml
- assertVisible:
    id: browse-screen
- swipe:
    from:
      id: browse-media-type-selector
    direction: RIGHT
- swipe:
    from:
      id: browse-media-type-selector
    direction: RIGHT
- swipe:
    from:
      id: browse-media-type-selector
    direction: RIGHT
- swipe:
    from:
      id: browse-media-type-selector
    direction: RIGHT
- tapOn:
    id: browse-media-type-podcasts
- assertNotVisible:
    id: browse-filter-input
- assertNotVisible:
    id: browse-feed-summary
# Wait for the directory list so the Podcasts screenshot includes host → title → date rows.
- extendedWaitUntil:
    visible:
      id: browse-feed-list
    timeout: ${TIMEOUT_SLOWER}
# Top for the week lists only shows with listens that week.
- extendedWaitUntil:
    visible:
      text: "E2E Podcast Seed Channel"
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible:
    text: "E2E HLS VOD Channel"
- takeScreenshot: browse-screen-podcasts

- tapOn:
    id: browse-media-type-episodes
- extendedWaitUntil:
    visible:
      id: browse-feed-list
    timeout: ${TIMEOUT_SLOWER}
- assertVisible:
    id: "home-feed-row-subtitle-.*"
- assertVisible:
    id: "home-feed-row-updated-.*"
- assertVisible:
    id: "home-feed-row-duration-.*"
- takeScreenshot: browse-screen-episodes

# Clips sits between Episodes and Artists, still on screen from the start of the row.
# Each row names the podcast and episode the clip came from.
- tapOn:
    id: browse-media-type-clips
- extendedWaitUntil:
    visible:
      id: browse-feed-list
    timeout: ${TIMEOUT_SLOWER}
# The seed counts no clip listens, so Clips opens on an empty Top week.
- extendedWaitUntil:
    visible:
      id: browse-list-empty
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible:
    id: "home-feed-row-.*"
- takeScreenshot: browse-screen-clips
- tapOn:
    id: browse-media-type-episodes
- extendedWaitUntil:
    visible:
      id: browse-feed-list
    timeout: ${TIMEOUT_SLOWER}

- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      TRAILING_ID: browse-sort-button
# Counted visible while its center is still past the trailing edge, so the tap misses.
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
- assertVisible: "Sort: Week"
- tapOn:
    id: browse-sort-button
- assertVisible:
    id: browse-sort-menu
- assertVisible:
    id: browse-sort-recent
- assertVisible:
    id: browse-sort-top
- takeScreenshot: browse-sort-menu
# Top is a two-step choice: the sort sheet, then the listen-count window.
- tapOn:
    id: browse-sort-top
- extendedWaitUntil:
    visible:
      id: browse-sort-range-menu
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    id: browse-sort-range-week
- assertVisible:
    id: browse-sort-range-month
- assertVisible:
    id: browse-sort-range-all-time
- tapOn:
    id: browse-sort-range-day
# The seed counts no listens for the day. Top lists only rows counted above zero, so the day is
# an empty list rather than Recent rows under the Top label.
- extendedWaitUntil:
    visible:
      id: browse-list-empty
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible:
    id: "home-feed-row-.*"
- assertVisible: "Sort: Day"
- takeScreenshot: browse-episodes-top-day-empty
# Recent lists episodes whether or not anyone listened.
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      TRAILING_ID: browse-sort-button
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
- tapOn:
    id: browse-sort-button
- tapOn:
    id: browse-sort-recent
- extendedWaitUntil:
    visible:
      id: "home-feed-row-subtitle-.*"
    timeout: ${TIMEOUT_SLOWER}
- assertVisible: "Sort: Recent"
- takeScreenshot: browse-episodes-recent

- tapOn:
    id: browse-category-button
- extendedWaitUntil:
    visible:
      id: browse-category-all
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible:
    id: browse-sort-button
- assertVisible:
    id: browse-category-arts
- assertNotVisible:
    id: browse-category-books
- tapOn:
    id: browse-category-arts-expand
- assertVisible:
    id: browse-category-books
- tapOn:
    id: browse-category-arts-expand
- assertNotVisible:
    id: browse-category-books
- takeScreenshot: browse-screen-categories

- tapOn:
    id: browse-category-all
- extendedWaitUntil:
    notVisible:
      id: browse-category-all
    timeout: ${TIMEOUT_SLOWER}
- assertVisible:
    id: browse-sort-button

# Artists is left of the trailing chips. Swipe until its center is on screen.
- runFlow:
    file: shared/reveal-chip-row-leading.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      LEADING_ID: browse-media-type-artists
- tapOn:
    id: browse-media-type-artists
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      TRAILING_ID: browse-sort-button
- extendedWaitUntil:
    visible:
      id: browse-sort-button
    timeout: ${TIMEOUT_SLOWER}
# Episodes is on Recent now; Artists keeps its own sort and still opens on Top for the week.
- assertVisible: "Sort: Week"
- assertNotVisible:
    id: browse-category-button
- assertNotVisible:
    id: browse-category-all
- takeScreenshot: browse-screen-artists

- extendedWaitUntil:
    visible:
      id: browse-feed-list
    timeout: ${TIMEOUT_SLOWER}
- assertVisible:
    id: "home-feed-row-updated-.*"
- tapOn:
    id: browse-overflow-trigger
- extendedWaitUntil:
    visible:
      id: browse-overflow-menu
    timeout: ${TIMEOUT_FASTER}
- tapOn:
    id: browse-overflow-view-grid
- extendedWaitUntil:
    visible:
      id: "home-feed-cell-.*"
    timeout: ${TIMEOUT_SLOWER}
- runFlow:
    file: shared/restore-chip-row-start.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
- tapOn:
    id: browse-media-type-podcasts
- extendedWaitUntil:
    visible:
      id: browse-feed-list
    timeout: ${TIMEOUT_SLOWER}
- assertVisible:
    id: "home-feed-row-title-.*"
- assertNotVisible:
    id: "home-feed-cell-.*"
# Artists follows Clips. A fixed swipe count from Podcasts scrolls past it on a phone.
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: browse-media-type-selector
      TRAILING_ID: browse-media-type-artists
- tapOn:
    id: browse-media-type-artists
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
- swipe:
    from:
      id: browse-media-type-selector
    direction: LEFT
- tapOn:
    id: browse-media-type-tracks
- extendedWaitUntil:
    visible:
      id: browse-feed-list
    timeout: ${TIMEOUT_SLOWER}
- assertVisible:
    id: "home-feed-row-title-.*"
- assertVisible:
    id: "home-feed-row-subtitle-.*"
- assertNotVisible:
    id: "home-feed-row-updated-.*"
- assertNotVisible:
    id: "home-feed-row-description-.*"
- tapOn:
    id: "home-row-more-.*"
- extendedWaitUntil:
    visible:
      id: "media-row-menu-.*"
    timeout: ${TIMEOUT_FASTER}
- assertVisible:
    id: "media-row-action-queue-next-.*"
- assertVisible:
    id: "media-row-action-queue-last-.*"
- assertVisible:
    id: "media-row-action-add-to-playlist-.*"
- assertVisible:
    id: "media-row-action-go-to-track-.*"
- assertVisible:
    id: "media-row-action-go-to-album-.*"
- takeScreenshot: browse-screen-tracks
- tapOn:
    id: "media-row-menu-.*-cancel"
- extendedWaitUntil:
    visible:
      id: browse-feed-list
    timeout: ${TIMEOUT_FASTER}
- tapOn:
    id: "home-feed-row-title-.*"
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOWER}
- assertVisible:
    id: mini-player
- assertVisible:
    id: mini-player-title
- takeScreenshot: browse-tracks-play

- tapOn:
    id: tab-more
- assertNotVisible:
    id: more-nav-notifications
- assertVisible:
    id: more-nav-recommendations
- tapOn:
    id: more-nav-profile
- extendedWaitUntil:
    visible:
      id: my-profile-screen
    timeout: ${TIMEOUT_SLOWER}
- scrollUntilVisible:
    element:
      id: my-profile-playlist-row-e2eEmbPlList01
    direction: DOWN
    timeout: ${TIMEOUT_SLOWER}
- assertVisible:
    id: my-profile-playlist-row-e2eEmbPlList01-subtitle
- takeScreenshot: browse-my-profile-playlist-row
- runFlow:
    file: shared/stack-back.yaml
- tapOn:
    id: more-settings
- tapOn:
    id: more-settings-tab-bar-select
- assertVisible:
    id: more-settings-tab-bar-screen
- takeScreenshot: browse-tab-bar-settings
- assertNotVisible:
    id: more-settings-tab-bar-add-notifications
- assertNotVisible:
    id: more-settings-tab-bar-visible-search
- assertNotVisible:
    id: more-settings-tab-bar-overflow-search
- assertVisible:
    id: more-settings-tab-bar-visible-recommendations
- runFlow:
    file: shared/stack-back.yaml
- runFlow:
    file: shared/stack-back.yaml
- assertVisible:
    id: tab-recommendations
- assertVisible:
    id: tab-browse
- assertVisible:
    id: tab-my-library
- assertNotVisible:
    id: tab-search
- takeScreenshot: browse-tab-bar-recommendations-visible
