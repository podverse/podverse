appId: com.podverse.app.next
name: Popularity Tracking Gate
---
# Undecided seeded account must choose before the tab shell is usable.
# Sign-in is the E2E shortcut; this flow still asserts the consent prompt itself.

- runFlow: shared/launch-and-connect.yaml

- tapOn:
    id: e2e-quick-login-popularity

- extendedWaitUntil:
    visible:
      id: popularity-tracking-yes
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: popularity-tracking-prompt
- takeScreenshot: popularity-tracking-prompt

- tapOn:
    id: popularity-tracking-learn-more
- tapOn:
    id: popularity-tracking-yes

- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: ${TIMEOUT_SLOW}

- tapOn:
    id: tab-more
- tapOn:
    id: more-settings
- tapOn:
    id: more-settings-popularity-tracking
- assertVisible:
    id: more-settings-popularity-tracking-screen
- takeScreenshot: popularity-tracking-settings
