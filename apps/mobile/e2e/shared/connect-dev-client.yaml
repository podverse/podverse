appId: com.podverse.app.next
---
# Boots the Dev Client and proves the app rendered. A flow that expects an overlay over the app at
# boot runs connect-dev-client-overlay-ok.yaml instead.
- runFlow: connect-dev-client-launcher.yaml
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: ${TIMEOUT_SLOWEST}
