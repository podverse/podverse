appId: com.podverse.app.next
---
# Connect to Metro and get past the Expo Dev Client launcher + developer menu so
# app testIDs are assertable.
# iOS launcher lists http://localhost:8081; Android emulator lists http://10.0.2.2:8081.
#
# clearState re-triggers the first-launch developer-menu onboarding every run, and that
# onboarding card appears only AFTER the JS bundle finishes loading. `when: visible` is a
# one-shot snapshot, so guarding the dismissal races the async bundle load: the guard fires
# before the card exists, the tap is skipped, then the card pops up and blocks the app.
# Instead, wait for each obstruction before acting. All flows launch with clearState, so the
# onboarding card + dev-menu sheet always appear.

# Wait for the Dev Client launcher list to finish rendering before the one-shot URL taps
# below. The `when: visible` guards are single snapshots; on Android the URL row can render a
# beat after the screen appears, so without this wait the guard misses, the tap is skipped, and
# the bundle never loads (then "Continue" never appears and the flow times out on the launcher).
# "Development servers" is the launcher heading on both iOS and Android.
# Use the slowest timeout: the FIRST flow of each platform in a full suite run is a cold Dev Client
# launch where Metro has not yet cached that platform's bundle, so the launcher heading can take
# well over TIMEOUT_SLOW to render (observed on Android add-by-rss/api-health mid-suite).
- extendedWaitUntil:
    visible: "Development servers"
    timeout: ${TIMEOUT_SLOWEST}

# Dev Client launcher: tap the Metro URL for this platform.
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
- runFlow:
    when:
      visible: "http://10.0.2.2:8081"
    commands:
      - tapOn: "http://10.0.2.2:8081"

# After tapping the Metro URL the JS bundle loads asynchronously and the app either:
#   (a) lands directly on home-screen (no dev-client onboarding card — observed on the current
#       Expo dev-client / iOS 26 build, which connects straight through), or
#   (b) shows the first-launch onboarding card ("This is the developer menu ... Continue") that
#       overlays the app and must be dismissed.
# Do NOT hard-wait for "Continue": on path (a) it never appears and the flow fails in this shared
# step before its own assertions. Instead, try home-screen directly first (optional). If the
# onboarding card is blocking it, that optional wait times out — by which point the bundle has
# loaded and the card has rendered — then dismiss the card and require home-screen.
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: ${TIMEOUT_SLOW}
    optional: true

# Dismiss the onboarding card only if it actually appeared (path b). Tapping Continue reveals the
# dev-menu bottom sheet (Reload / Go home / ...), which still occludes the app; close it by tapping
# the dimmed app scrim above it (locale-independent).
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: ${TIMEOUT_SLOW}
      - tapOn:
          point: "50%,18%"

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: ${TIMEOUT_SLOWEST}
