appId: com.podverse.app.next
---
# Connect to Metro and get past the Expo Dev Client launcher + developer menu so
# app testIDs are assertable.
# iOS launcher lists http://localhost:8081. Android can omit the discovered URL, so its known
# emulator bridge URL is entered manually below.
#
# clearState can leave the Dev Client onboarding card over either the launcher or an already
# connected app. `when: visible` is a one-shot snapshot, so wait for the card before dismissing it.
# The launcher may also omit Android's discovered server, so its known emulator URL is entered
# manually when the launcher is present.

# Dismiss onboarding when it is already present before the launcher wait. The card is part of the
# Dev Client's own startup, so it is on screen within a tier or two of launchApp returning; a longer
# probe only adds dead time to the common case where it never appears at all.
- extendedWaitUntil:
    visible: "Continue"
    timeout: ${TIMEOUT_FASTER}
    optional: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - extendedWaitUntil:
          visible: "Reload"
          timeout: ${TIMEOUT_SLOW}
      - tapOn:
          point: "50%,18%"

# Wait for the Dev Client launcher list when this launch still needs a server connection.
# The optional wait allows an already connected app to continue to its home screen.
# "Development servers" is the launcher heading on both iOS and Android.
# Use the slowest timeout: the FIRST flow of each platform in a full suite run is a cold Dev Client
# launch where Metro has not yet cached that platform's bundle, so the launcher heading can take
# well over TIMEOUT_SLOW to render (observed on Android add-by-rss/api-health mid-suite).
- extendedWaitUntil:
    visible: "Development servers"
    timeout: ${TIMEOUT_SLOWEST}
    optional: true

# Dev Client launcher: tap the discovered iOS Metro URL when the launcher is visible.
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"

# Android's launcher can show no discovered development server while Metro is healthy. Enter the
# emulator bridge URL directly when the launcher is visible so Android does not depend on discovery.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: "Development servers"
          commands:
            - tapOn: "Enter URL manually"
            - inputText: "http://10.0.2.2:8081"
            - hideKeyboard
            - tapOn: "Connect"

# After connecting to Metro the JS bundle loads asynchronously and the app either:
#   (a) lands directly on home-screen with no dev-client onboarding card, or
#   (b) shows the first-launch onboarding card ("This is the developer menu ... Continue") that
#       overlays the app and must be dismissed.
# Never hard-wait for "Continue" here: on path (a) it never appears, so this shared step would fail
# before the calling flow's own assertions. Probe home-screen first, then branch on whether it
# appeared, so each path waits only for the thing it is actually waiting on and neither pays the
# other's timeout.
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: ${TIMEOUT_FAST}
    optional: true

# Path (b): home-screen is still hidden, so the onboarding card is what is blocking it. Wait for the
# card itself rather than for a fixed delay. Tapping Continue reveals the dev-menu bottom sheet
# (Reload / Go home / ...), which still occludes the app; close it by tapping the dimmed app scrim
# above it (locale-independent).
- runFlow:
    when:
      notVisible:
        id: home-screen
    commands:
      - extendedWaitUntil:
          visible: "Continue"
          timeout: ${TIMEOUT_SLOW}
          optional: true
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - extendedWaitUntil:
                visible: "Reload"
                timeout: ${TIMEOUT_SLOW}
            - tapOn:
                point: "50%,18%"

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: ${TIMEOUT_SLOWEST}
