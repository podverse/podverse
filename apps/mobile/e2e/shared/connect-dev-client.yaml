appId: com.podverse.app.next
---
# Connect to Metro and get past the Expo Dev Client launcher + developer menu so
# app testIDs are assertable.
# iOS launcher lists http://localhost:8081; Android emulator lists http://10.0.2.2:8081.
#
# clearState re-triggers the first-launch developer-menu onboarding every run, and that
# onboarding card appears only AFTER the JS bundle finishes loading. `when: visible` is a
# one-shot snapshot, so guarding the dismissal races the async bundle load: the guard fires
# before the card exists, the tap is skipped, then the card pops up and blocks the app.
# Instead, wait for each obstruction before acting. All flows launch with clearState, so the
# onboarding card + dev-menu sheet always appear.

# Wait for the Dev Client launcher list to finish rendering before the one-shot URL taps
# below. The `when: visible` guards are single snapshots; on Android the URL row can render a
# beat after the screen appears, so without this wait the guard misses, the tap is skipped, and
# the bundle never loads (then "Continue" never appears and the flow times out on the launcher).
# "Development servers" is the launcher heading on both iOS and Android.
- extendedWaitUntil:
    visible: "Development servers"
    timeout: ${TIMEOUT_SLOW}

# Dev Client launcher: tap the Metro URL for this platform.
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
- runFlow:
    when:
      visible: "http://10.0.2.2:8081"
    commands:
      - tapOn: "http://10.0.2.2:8081"

# First-launch onboarding card ("This is the developer menu ... Continue"). It appears only
# after the JS bundle loads (Android cold bundle can be slow), so wait before tapping.
- extendedWaitUntil:
    visible: "Continue"
    timeout: ${TIMEOUT_SLOWEST}
- tapOn: "Continue"

# Tapping Continue reveals the dev-menu bottom sheet (Reload / Go home / ...), which still
# occludes the app. Wait for it, then close it by tapping the dimmed app scrim above it
# (locale-independent).
- extendedWaitUntil:
    visible: "Reload"
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    point: "50%,18%"

- extendedWaitUntil:
    visible:
      id: hello-world-screen
    timeout: ${TIMEOUT_SLOW}
