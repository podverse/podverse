appId: com.podverse.app.next
---
# Programmatic seeded login. The control renders only when Metro __DEV__ is on and
# EXPO_PUBLIC_MOBILE_E2E=1. The login form itself is covered by auth-login
# (shared/login-seeded-user-ui.yaml).

- tapOn:
    id: e2e-quick-login
- extendedWaitUntil:
    visible:
      id: e2e-session-authenticated
    timeout: ${TIMEOUT_SLOW}
