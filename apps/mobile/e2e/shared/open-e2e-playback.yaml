appId: com.podverse.app.next
---
# More → E2E → Playback. The tab shell must already be visible.
- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- scrollUntilVisible:
    element:
      id: more-nav-e2e-playback
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
- tapOn:
    id: more-nav-e2e-playback
- assertVisible:
    id: more-e2e-playback-screen
