appId: com.podverse.app.next
---
# Connect to Metro through the Expo Dev Client launcher. The calling flow waits for the app to
# render (connect-dev-client.yaml or connect-dev-client-overlay-ok.yaml).
# Bonjour may leave the launcher on "Searching for development servers..." with no URL row.
# Enter URL manually uses the known Metro host: localhost on iOS, 10.0.2.2 on Android
# (adb reverse makes localhost work there too; 10.0.2.2 is the emulator bridge).
#
# The developer menu never opens on its own: `app.config.ts` builds the dev client with
# `showMenuAtLaunch: false`, `skipOnboarding: true`, and `toolsButton: false`, so clearState
# cannot bring its sheet, onboarding card, or floating button back over the app.

# Wait for the Dev Client launcher list when this launch still needs a server connection.
# The optional wait allows an already connected app to continue to its home screen.
# "Development servers" is the launcher heading on both iOS and Android.
# Use the slowest timeout: the FIRST flow of each platform in a full suite run is a cold Dev Client
# launch where Metro has not yet cached that platform's bundle, so the launcher heading can take
# well over TIMEOUT_SLOW to render (observed on Android add-by-rss/api-health mid-suite).
- extendedWaitUntil:
    visible: "Development servers"
    timeout: ${TIMEOUT_SLOWEST}
    optional: true

# The heading renders while discovery is still running, so a one-shot URL check misses the row.
# Wait briefly for it, tap it when it appears, and otherwise type the known Metro URL. "Enter URL
# manually" stays on the searching launcher; it is gone once a discovered URL tap has left that
# screen, so this does not also type a URL after a successful tap.
- runFlow:
    when:
      visible: "Development servers"
    commands:
      - extendedWaitUntil:
          visible: "http://localhost:8081"
          timeout: ${TIMEOUT_FAST}
          optional: true
      - runFlow:
          when:
            visible: "http://localhost:8081"
          commands:
            - tapOn: "http://localhost:8081"
      - runFlow:
          when:
            visible: "Enter URL manually"
            notVisible: "http://localhost:8081"
            platform: iOS
          commands:
            - tapOn: "Enter URL manually"
            # The URL field has no accessibility label (placeholder "http://" only). inputText
            # does not reach it until it is focused. 50%,34% is the field center on the E2E
            # phone (402×874). Connect stays disabled until the field holds a URL.
            - tapOn:
                point: "50%,34%"
            - inputText: "http://localhost:8081"
            - extendedWaitUntil:
                visible:
                  text: "Connect"
                  enabled: true
                timeout: ${TIMEOUT_FAST}
            - tapOn: "Connect"
      - runFlow:
          when:
            visible: "Enter URL manually"
            notVisible: "http://localhost:8081"
            platform: Android
          commands:
            - tapOn: "Enter URL manually"
            - inputText: "http://10.0.2.2:8081"
            - hideKeyboard
            - tapOn: "Connect"
