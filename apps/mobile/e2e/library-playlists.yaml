appId: com.podverse.app.next
name: Library Playlists Authoring
---
# Authenticated playlist authoring smoke + back navigation.
# Path: Library -> Playlists -> create -> detail -> edit -> save/goBack -> detail.
# Needs Mobile E2E API (:4230) only (no media playback / test-assets). Reorder and add-to-playlist
# from Home rows depend on seeded playlist/feed content and are verified manually on device — see
# apps/mobile/e2e/HOW-TO-RUN.md.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

# Library hub -> playlists list.
- tapOn:
    id: tab-my-library
- assertVisible:
    id: library-hub-screen
- tapOn:
    id: library-nav-playlists
- assertVisible:
    id: library-playlists-screen

# Library list chips: My / Followed, and a medium filter that starts on All.
- assertVisible:
    id: library-playlists-medium-button
- tapOn:
    id: library-playlists-medium-button
- assertVisible:
    id: library-playlists-medium-all
- assertVisible:
    id: library-playlists-medium-av
- assertVisible:
    id: library-playlists-medium-music
- tapOn:
    id: library-playlists-medium-all
- assertVisible:
    id: library-playlists-type-private
- tapOn:
    id: library-playlists-type-followed
- assertVisible:
    id: library-playlists-list
- tapOn:
    id: library-playlists-type-private
- assertVisible:
    id: library-playlists-list

# 9d.1 create: open the create form, fill title, exercise the sharable-status chips, submit.
- tapOn:
    id: library-playlists-create
- assertVisible:
    id: playlist-form-screen
- assertVisible:
    id: playlist-form-medium-chips
- tapOn:
    id: playlist-form-medium-music
- tapOn:
    id: playlist-form-medium-av
- tapOn:
    id: playlist-form-title
- inputText: "E2E Playlist"
- tapOn:
    id: playlist-form-sharable-unlisted
- scrollUntilVisible:
    element:
      id: playlist-form-tags-input
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
- tapOn:
    id: playlist-form-tags-input
- inputText: "Morning Set"
- pressKey: Enter
- assertVisible:
    id: playlist-form-tags-tag-0
- assertVisible:
    text: "Morning Set"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: playlist-form-submit
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
- takeScreenshot: library-playlists-create-form
- tapOn:
    id: playlist-form-submit
# create replaces the form with the new playlist's detail (navigation.replace).
- extendedWaitUntil:
    visible:
      id: library-playlist-detail-screen
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: library-playlists-created-detail

# Created playlists have no description; the row still shows features.playlist.item_count.
# The row label is the title plus that count ("E2E Playlist. Items: 0"). Maestro matches the
# whole label, so the selector is a prefix. Seeded embed playlists use other titles.
- runFlow:
    file: shared/stack-back.yaml
- extendedWaitUntil:
    visible:
      text: "E2E Playlist.*"
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: "library-playlist-row-.*-subtitle"
- tapOn:
    text: "E2E Playlist.*"
- extendedWaitUntil:
    visible:
      id: library-playlist-detail-screen
    timeout: ${TIMEOUT_SLOW}

# Edit (owner-only edit button) + back: save calls navigation.goBack() -> detail again,
# proving the pushed edit screen is not a dead-end.
- tapOn:
    id: library-playlist-detail-edit
- assertVisible:
    id: playlist-form-screen
- assertVisible:
    id: playlist-form-medium-readonly
- scrollUntilVisible:
    element:
      id: playlist-form-tags-tag-0
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    text: "morning set"
- tapOn:
    id: playlist-form-tags-input
- inputText: "morn"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: playlist-form-tags-suggestion-0
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    id: playlist-form-tags-suggestion-0
- assertNotVisible:
    id: playlist-form-tags-tag-1
- tapOn:
    id: playlist-form-tags-tag-0-remove
- assertNotVisible:
    id: playlist-form-tags-tag-0
- tapOn:
    id: playlist-form-title
- inputText: " Edited"
- takeScreenshot: library-playlists-edit-form
# The title field keeps the keyboard over Save. Return dismisses it.
- pressKey: Enter
- tapOn:
    id: playlist-form-submit
- extendedWaitUntil:
    visible:
      id: library-playlist-detail-screen
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: library-playlists-edit-back-to-detail

# Delete (edit-only flow): confirm dialog then return to playlists list.
- tapOn:
    id: library-playlist-detail-edit
- assertVisible:
    id: playlist-form-screen
- assertNotVisible:
    id: playlist-form-tags-tag-0
- tapOn:
    id: playlist-form-delete
- assertVisible:
    id: playlist-form-delete-confirm-dialog
- tapOn:
    id: playlist-form-delete-confirm
- extendedWaitUntil:
    visible:
      id: library-playlists-screen
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: library-playlists-deleted-back-to-list
# Drag-reorder assertion intentionally omitted: long-press drag arbitration is a device-level
# gesture check and flakes in Maestro. Covered by manual validation with queue-style drag handles.
