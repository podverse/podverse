appId: com.podverse.app.next
name: Settings Select Pages
---
# Settings root is a group list. Theme / language live under Appearance (4+ → OptionListScreen).
# Preferred media stays chips on the Playback group. Cold start via shared/launch-and-connect.yaml.

- runFlow: shared/launch-and-connect.yaml
- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-settings
- assertVisible:
    id: more-settings-screen
- assertVisible:
    id: more-settings-appearance
- assertVisible:
    id: more-settings-tab-bar-select
- assertVisible:
    id: more-settings-playback
- assertVisible:
    id: more-settings-notifications
- takeScreenshot: settings-select-initial

# Appearance: Theme list, pick Light, back on Appearance with Light shown.
- tapOn:
    id: more-settings-appearance
- assertVisible:
    id: more-settings-appearance-screen
- tapOn:
    id: more-settings-theme-select
- assertVisible:
    id: more-settings-theme-screen
- takeScreenshot: settings-theme-list
- tapOn:
    id: more-settings-theme-light
- assertVisible:
    id: more-settings-appearance-screen
- assertVisible:
    id: more-settings-theme-select
- takeScreenshot: settings-theme-light

# Language: push list screen, pick Spanish, back on Appearance.
- tapOn:
    id: more-settings-locale-select
- assertVisible:
    id: more-settings-locale-screen
- takeScreenshot: settings-locale-list
- tapOn:
    id: more-settings-locale-es
- assertVisible:
    id: more-settings-appearance-screen
- assertVisible:
    id: more-settings-locale-select
- takeScreenshot: settings-locale-es

# Playback: preferred media type defaults to video; tap audio then back to video.
- tapOn:
    id: stack-header-back
- assertVisible:
    id: more-settings-screen
- tapOn:
    id: more-settings-playback
- assertVisible:
    id: more-settings-playback-screen
- assertVisible:
    id: more-settings-playback-video
- tapOn:
    id: more-settings-playback-audio
- tapOn:
    id: more-settings-playback-video
- takeScreenshot: settings-playback-video
