appId: com.podverse.app.next
name: Membership Checkout
---
# Signed-in store checkout uses the fake billing client. One purchase posts a test-processor
# payment. The seeded trial already has time left, so checkout shows when the added time starts.
# After the purchase, Membership shows the expiry.
# API-backed. Re-seed so ios and android expose the test checkout channel.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-nav-membership
- assertVisible:
    id: more-membership-screen
- tapOn:
    id: more-membership-cta
- extendedWaitUntil:
    visible:
      id: membership-extend-screen
    timeout: ${TIMEOUT_FAST}
- extendedWaitUntil:
    visible:
      id: membership-checkout-ready
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: membership-checkout-added-time
- assertVisible:
    id: membership-checkout-cadence-monthly
- tapOn:
    id: membership-extend-purchase
- extendedWaitUntil:
    visible:
      id: more-membership-screen
    timeout: ${TIMEOUT_SLOW}
- extendedWaitUntil:
    visible:
      id: more-membership-expires
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: membership-checkout-active
