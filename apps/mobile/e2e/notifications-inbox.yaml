appId: com.podverse.app.next
name: Notifications Inbox
---
# Signed out, the Home bell opens the login gate, and a /notifications link still reaches the
# inbox's login fill. Signed in, the bell opens the inbox, which slides up over Home; the down
# chevron returns to Home. With notifications denied and a push device registered elsewhere on
# the account, notification settings opens with the device push banner at the top.

- runFlow: shared/launch-and-connect.yaml

# Signed out, the account event stream stays closed.
- assertVisible:
    id: notification-stream-e2e
    text: idle

- assertVisible:
    id: home-notifications-bell
- tapOn:
    id: home-notifications-bell
- extendedWaitUntil:
    visible:
      id: premium-gate-modal
    timeout: ${TIMEOUT_FASTER}
- assertVisible:
    id: premium-gate-login
- takeScreenshot: notifications-bell-login-gate
- tapOn:
    id: premium-gate-cancel
- assertNotVisible:
    id: notifications-inbox-screen

- openLink: podverse-next://notifications
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: notifications-inbox-screen
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: notifications-inbox-dismiss
- assertVisible:
    id: notifications-inbox-auth-required
- assertVisible:
    id: notifications-inbox-auth-required-action
- takeScreenshot: notifications-inbox-login-required
- tapOn:
    id: notifications-inbox-dismiss
- extendedWaitUntil:
    notVisible:
      id: notifications-inbox-screen
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    id: home-screen

- runFlow: shared/login-seeded-user.yaml

# Signed in, the marker reads `open` once the stream's first event arrives. Nothing plays, so the
# background closes the stream and the return to the foreground opens a fresh one.
- extendedWaitUntil:
    visible:
      id: notification-stream-e2e
      text: open
    timeout: ${TIMEOUT_SLOW}
- pressKey: Home
- launchApp:
    clearState: false
    stopApp: false
- extendedWaitUntil:
    visible:
      id: notification-stream-e2e
      text: open
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: notifications-inbox-stream-reopened

- tapOn:
    id: tab-home
- assertVisible:
    id: home-notifications-bell
- tapOn:
    id: home-notifications-bell
- extendedWaitUntil:
    visible:
      id: notifications-inbox-screen
    timeout: ${TIMEOUT_SLOW}
- assertNotVisible:
    id: premium-gate-modal
- takeScreenshot: notifications-inbox-initial
- tapOn:
    id: notifications-inbox-dismiss
- extendedWaitUntil:
    notVisible:
      id: notifications-inbox-screen
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    id: home-screen
- takeScreenshot: notifications-bell-home

# Account-level subscribe defaults live under More > Settings, not the inbox.
- tapOn:
    id: tab-more
- tapOn:
    id: more-settings
- assertVisible:
    id: more-settings-screen
- tapOn:
    id: more-settings-notifications
- assertVisible:
    id: more-settings-notifications-screen
- assertVisible:
    id: more-settings-notification-auto-enable-on-subscribe
- assertVisible:
    id: more-settings-notification-type-default-new-item
- assertVisible:
    id: more-settings-notification-type-default-livestream-scheduled
- assertVisible:
    id: more-settings-notification-type-default-livestream-started
- takeScreenshot: more-settings-notification-subscribe-defaults

# Toggle the subscribe default. When the account already follows podcasts, the apply dialog
# appears; keep existing rows (Only new) so the rest of the suite stays deterministic.
- tapOn:
    id: more-settings-notification-auto-enable-on-subscribe-switch
- runFlow:
    when:
      visible:
        id: more-settings-notifications-apply-dialog
    commands:
      - assertVisible:
          id: more-settings-notifications-apply-all
      - assertVisible:
          id: more-settings-notifications-apply-new-only
      - takeScreenshot: more-settings-notification-apply-dialog
      - tapOn:
          id: more-settings-notifications-apply-new-only
- assertVisible:
    id: more-settings-notifications-screen
- takeScreenshot: more-settings-notification-auto-enable-toggled

# Optional Push and Banner appear only while the category base switch is on. Media categories
# default on, so their Banner rows are visible. Product Updates defaults off, so its Banner stays
# hidden. Locked system categories always show Banner. Toggle Livestream Banner twice so the
# device preference ends where it started.
- scrollUntilVisible:
    element:
      id: more-settings-banner-notification-livestream-switch
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: more-settings-media-notifications-card
- assertVisible:
    id: more-settings-notification-new-content
- assertVisible:
    id: more-settings-notification-new-content-push
- assertVisible:
    id: more-settings-banner-notification-new-content-switch
- assertVisible:
    id: more-settings-banner-notification-livestream-switch
- tapOn:
    id: more-settings-banner-notification-livestream-switch
- tapOn:
    id: more-settings-banner-notification-livestream-switch
- assertNotVisible:
    id: more-settings-notifications-apply-dialog
- scrollUntilVisible:
    element:
      id: more-settings-notification-product-update
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: more-settings-system-notifications-card
- assertNotVisible:
    id: more-settings-banner-notification-product-update-switch
- scrollUntilVisible:
    element:
      id: more-settings-banner-notification-general
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: more-settings-banner-notification-general-switch
- takeScreenshot: more-settings-banner-notifications

# Denied notifications on this device, with Push on for the account's media categories by default
# and a push device registered elsewhere on the account: notification settings opens with the
# device push banner at the top.
- runScript:
    file: scripts/push-device-fixture.js
    env:
      E2E_PUSH_DEVICE_ACTION: add
- launchApp:
    clearState: false
    permissions:
      notifications: deny
- runFlow: shared/connect-dev-client.yaml
- tapOn:
    id: tab-more
- tapOn:
    id: more-settings
- assertVisible:
    id: more-settings-screen
- tapOn:
    id: more-settings-notifications
- extendedWaitUntil:
    visible:
      id: more-settings-device-push-banner
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: more-settings-device-push-banner-action
- takeScreenshot: more-settings-device-push-banner
- runScript:
    file: scripts/push-device-fixture.js
    env:
      E2E_PUSH_DEVICE_ACTION: remove
