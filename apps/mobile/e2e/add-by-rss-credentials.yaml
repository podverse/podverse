appId: com.podverse.app.next
name: Add By RSS Credentials Flow
---
# Protected add-by-RSS feed: add with a username and password, lose them on sign-out (they are
# device-held and account-scoped; the feed row stays), re-enter them from the needs-credentials
# section, then play through the credential-carrying load path.
#
# The E2E API resolves every parse to the fixture channel without fetching the feed, so this flow
# covers the device side: credential fields, the partial row, the credentials screen, and that a
# load carrying credentials still plays. The fixture enclosure is public, so playback needs
# Mobile E2E test-assets but proves nothing about the Basic challenge itself.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-my-library
- assertVisible:
    id: library-hub-screen
- tapOn:
    id: library-nav-add-by-rss
- assertVisible:
    id: rss-root-screen

- tapOn:
    id: rss-url-input
- inputText: http://localhost:2111/basic-auth/feeds/feed-basic-auth.rss?e2e=mobile-credentials
- tapOn:
    id: rss-username-input
- inputText: username
- tapOn:
    id: rss-password-input
- inputText: password
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- takeScreenshot: add-by-rss-credentials-filled
- tapOn:
    id: rss-add-submit

# Credentials that worked put the feed in the normal list, not the needs-credentials section.
- extendedWaitUntil:
    visible:
      id: rss-feed-row-first
    timeout: ${TIMEOUT_SLOWER}
- assertVisible: Parsed
- assertNotVisible:
    id: rss-needs-credentials
- takeScreenshot: add-by-rss-credentials-feed-listed

# Signing out clears this account's credentials on the device but keeps the feed row, which is
# the same state a second device reaches when it syncs a feed flagged as needing credentials.
- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-nav-logout
- extendedWaitUntil:
    visible:
      id: anonymous-login-cta
    timeout: ${TIMEOUT_FAST}
- runFlow: shared/login-seeded-user.yaml

# The Library stack may still sit on the add-by-RSS screen; tapping the focused tab pops to the hub.
- tapOn:
    id: tab-my-library
- runFlow:
    when:
      notVisible:
        id: library-hub-screen
    commands:
      - tapOn:
          id: tab-my-library
- assertVisible:
    id: library-hub-screen
- tapOn:
    id: library-nav-add-by-rss
- assertVisible:
    id: rss-root-screen
- extendedWaitUntil:
    visible:
      id: rss-needs-credentials
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: rss-needs-credentials-title
- takeScreenshot: add-by-rss-credentials-partial-row

- tapOn:
    id: "rss-needs-credentials-row-.*"
- assertVisible:
    id: rss-credentials-screen
- assertVisible:
    id: rss-credentials-device-note
- assertVisible:
    id: rss-credentials-media-note
- takeScreenshot: add-by-rss-credentials-screen

- tapOn:
    id: rss-credentials-username
- inputText: username
- tapOn:
    id: rss-credentials-password
- inputText: password
# The save button sits under the iOS keyboard. A tap on the title dismisses it; hideKeyboard is
# unreliable on iOS. Android still dismisses with hideKeyboard.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: rss-credentials-title
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: rss-credentials-save

# A passing check returns to the list with the feed back among the normal rows.
- extendedWaitUntil:
    visible:
      id: rss-root-screen
    timeout: ${TIMEOUT_SLOWER}
- extendedWaitUntil:
    visible:
      id: rss-feed-row-first
    timeout: ${TIMEOUT_SLOW}
- assertNotVisible:
    id: rss-needs-credentials
- takeScreenshot: add-by-rss-credentials-restored

# Play from the Home detail: the load carries the stored credentials (in scope, insecure allowed
# under E2E), which on Android switches the engine to its authenticated data source.
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- tapOn:
    text: E2E Add-by-RSS Channel
- assertVisible:
    id: add-by-rss-home-detail-screen
- tapOn:
    id: add-by-rss-home-play-first
- extendedWaitUntil:
    visible:
      id: add-by-rss-home-playback-active
    timeout: ${TIMEOUT_SLOWEST}
- takeScreenshot: add-by-rss-credentials-playback-active

# Unfollow from the Library list so the seeded account does not keep this feed for later runs.
- tapOn:
    id: tab-my-library
- assertVisible:
    id: rss-root-screen
- tapOn:
    id: rss-feed-remove-first
- extendedWaitUntil:
    notVisible:
      text: ".*e2e=mobile-credentials.*"
    timeout: ${TIMEOUT_SLOW}
