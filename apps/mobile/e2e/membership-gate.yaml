appId: com.podverse.app.next
name: Membership Gate
---
# A Trial member attempting a Premium-only action (Podcast Index directory add)
# gets a REAL membership.feature_not_available_for_account_type 403, which the app surfaces as the
# premium gate modal; "Renew" routes to the Membership screen. Also asserts the auth-based CTA:
# logged-out shows "Sign up", logged-in shows "Extend my membership".
#
# API-backed + test-assets. The seeded e2e-user is a valid Trial member, so subscribe/playlist
# would NOT 403 — the directory-add capability gate (allowDirectoryAddByRSS=false for Trial, and NOT
# bypassed by PODVERSE_E2E_FIXTURES) is the deterministic trigger. Fixture query `unparsedfixture`
# opens the PI preview/add screen (see search-unparsed.yaml / e2eUnparsedSearchFixture.ts).

- runFlow: shared/launch-and-connect.yaml

# Logged-out: the Membership screen (reachable from More) shows the auth-based Sign up CTA.
- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-nav-membership
- assertVisible:
    id: more-membership-screen
- assertVisible:
    id: more-membership-cta
    text: "Sign up"
- assertVisible:
    id: more-membership-feature-table
- assertVisible:
    text: "Video playback"
- assertVisible:
    text: "CarPlay"
- assertVisible:
    text: "Android Auto"
# The feature table is taller than a phone viewport. iOS omits off-screen
# identifiers; the accordion's accessible name is the title.
- scrollUntilVisible:
    element:
      text: "Trial limitations"
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- tapOn: "Trial limitations"
- scrollUntilVisible:
    element:
      text: "Some features are unavailable during Trial to help reduce spam and abuse."
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
- scrollUntilVisible:
    element:
      text: "• Listen stats are not available on Trial. Contributing to trending requires Premium."
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
- takeScreenshot: membership-gate-signup-cta

- tapOn:
    id: stack-header-back
- assertVisible:
    id: more-screen

# Anonymous tier: Add by RSS is membership-tier. The library list stays readable; tapping plus
# opens the shared gate modal (Account required → Login). Search stays at its root for the Trial
# 403 check below.
- tapOn:
    id: tab-my-library
- assertVisible:
    id: library-hub-screen
- tapOn:
    id: library-nav-add-by-rss
- assertVisible:
    id: rss-root-screen
- tapOn:
    id: rss-add-button
- assertVisible:
    id: premium-gate-modal
- takeScreenshot: membership-gate-anonymous-add-by-rss
- tapOn:
    id: premium-gate-cancel
- extendedWaitUntil:
    notVisible:
      id: premium-gate-modal
    timeout: ${TIMEOUT_FAST}

- openLink: podverse-next://podcast/e2ePodChnl001/episode/e2ePodChap0001
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: episode-detail-screen
    timeout: ${TIMEOUT_SLOWER}
- tapOn:
    id: "home-row-play-.*"
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    id: mini-player
- assertVisible:
    id: full-player-screen
- tapOn:
    id: full-player-create-clip
- assertVisible:
    id: premium-gate-modal
- takeScreenshot: membership-gate-anonymous-make-clip
- tapOn:
    id: premium-gate-cancel
- extendedWaitUntil:
    notVisible:
      id: premium-gate-modal
    timeout: ${TIMEOUT_FAST}
- tapOn:
    id: full-player-close
- extendedWaitUntil:
    notVisible:
      id: full-player-screen
    timeout: ${TIMEOUT_FAST}

# Log in as the seeded Trial user.
- runFlow: shared/login-seeded-user.yaml

# Membership tier, reactive path: the seeded user holds a valid Trial membership, so the shared tier
# model resolves `directory_add_by_rss` as allowed and lets the request through. Trial-vs-Premium
# capability differences stay server-authoritative, so the real 403 is still what gates this.
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- tapOn:
    id: search-input
- inputText: unparsedfixture
- assertVisible:
    id: search-result-row-0
- tapOn:
    id: search-result-row-0
- assertVisible:
    id: pi-feed-preview-screen
- tapOn:
    id: pi-feed-add-button

# The 403 opens the premium gate modal instead of a raw error.
- extendedWaitUntil:
    visible:
      id: premium-gate-modal
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: membership-gate-modal

# Renew (logged-in) routes to the Membership screen with the "Extend my membership" CTA.
- tapOn:
    id: premium-gate-renew
- extendedWaitUntil:
    visible:
      id: more-membership-screen
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    id: more-membership-cta
    text: "Extend my membership"
- takeScreenshot: membership-gate-membership-screen
