appId: com.podverse.app.next
name: V4V Placeholder
---
# Track 19.6 (565): the full-player Value-for-Value button opens the V4V placeholder screen
# (no LNURL/payment — real mobile V4V is operator-TBD). Requires EXPO_PUBLIC_MOBILE_V4V_ENABLED=1
# (set by scripts/mobile/dev-e2e.sh) so the button renders — it is hidden by default (store policy,
# detail 359). API-backed + test-assets: playback is needed to reach the full player (mirrors
# play-mini-player.yaml's play sequence).

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

# Play a seeded episode so the mini player (then full player) is reachable.
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- tapOn:
    id: search-input
- inputText: podcast
- assertVisible:
    id: search-result-row-0
- tapOn:
    id: search-result-row-0
- assertVisible:
    id: podcast-detail-screen
- assertVisible:
    id: podcast-episode-row-0
- tapOn:
    id: podcast-episode-row-0
- assertVisible:
    id: episode-detail-screen
- tapOn:
    id: "home-row-play-.*"
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: mini-player

# Expand to the full player and open the V4V placeholder.
- tapOn:
    id: mini-player
- assertVisible:
    id: full-player-screen
- assertVisible:
    id: full-player-v4v
- takeScreenshot: v4v-full-player-button
- tapOn:
    id: full-player-v4v
- extendedWaitUntil:
    visible:
      id: v4v-info-screen
    timeout: ${TIMEOUT_FAST}
- takeScreenshot: v4v-info-screen
