appId: com.podverse.app.next
name: V4 Carryover Anonymous
---
# A signed-out phone turns the previous app's subscriptions into local follows.
# The save screen comes up first. Continue starts the copy.
# Home lists directory follows and Add by RSS follows together.
# Needs Mobile E2E API (:4230) for the legacy podcast lookup.

- runFlow: shared/launch-and-connect.yaml

- openLink: podverse-next://e2e/v4-fixture

- runFlow: shared/confirm-ios-open-dialog.yaml

- extendedWaitUntil:
    visible: "Save Your Podcast List"
    timeout: ${TIMEOUT_FAST}

- tapOn:
    id: v4-continue-migration-saved-copy

- assertVisible:
    id: v4-continue-migration-continue
    enabled: true

- tapOn:
    id: v4-continue-migration-continue

- tapOn:
    id: tab-home

# The directory title arrives after the background lookup.
- extendedWaitUntil:
    visible: "E2E Podcast Seed Channel"
    timeout: ${TIMEOUT_SLOWER}

- assertVisible: "E2E V4 Add by RSS"

- assertNotVisible: "E2E V4 Blocked Show"

- takeScreenshot: v4-carryover-anonymous-home
