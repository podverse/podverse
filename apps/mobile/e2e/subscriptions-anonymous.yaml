appId: com.podverse.app.next
name: Anonymous Subscriptions Persist
---
# Subscriptions are device-local, so a signed-out user can subscribe and keep it.
# Deliberately never runs shared/login-seeded-user.yaml — the whole point is the anonymous path.
# Also covers the Home row metadata a signed-out subscription can produce, and the grid view drawing
# it as an artwork tile.
# Needs Mobile E2E API (:4230) for search results.

- runFlow: shared/launch-and-connect.yaml

# Clean device, nothing subscribed: Home says so and offers Search plus Browse. Home is
# subscribed-only, so there is no directory content standing in for an empty list.
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- assertVisible:
    id: home-list-empty
- assertVisible: You are not subscribed to anything yet.
- assertVisible:
    id: home-list-empty-search
- assertVisible:
    id: home-list-empty-browse
- assertVisible:
    id: home-sort-button
- assertVisible:
    id: home-overflow-trigger
- assertNotVisible:
    id: home-filter-input
- assertNotVisible:
    id: home-feed-summary
- takeScreenshot: home-empty-no-subscriptions

# The empty-state Search button is the route to Search, so signed out, the subscribe control works
# rather than telling the user to log in.
- tapOn:
    id: home-list-empty-search
- assertVisible:
    id: search-screen
- assertVisible:
    id: search-medium-all
- tapOn:
    id: search-input
- inputText: podcast
- assertVisible:
    id: search-result-row-0
- tapOn:
    id: search-result-row-0
- assertVisible:
    id: podcast-detail-screen
- takeScreenshot: subscriptions-anonymous-detail-before

# Header actions, signed out: share and the bell are unconditional, so a visitor can pass the show
# on and can find out what following it would give them. The gear is absent because there is no
# account to hold per-podcast settings.
- assertVisible:
    id: podcast-detail-share
- assertVisible:
    id: podcast-detail-notifications-toggle
- assertNotVisible:
    id: podcast-detail-settings

# Notifications need an account, so the bell explains that rather than failing silently or hiding.
- tapOn:
    id: podcast-detail-notifications-toggle
- extendedWaitUntil:
    visible:
      id: premium-gate-modal
    timeout: ${TIMEOUT_FASTER}
- assertVisible:
    id: premium-gate-login
- takeScreenshot: subscriptions-anonymous-notifications-login-gate
- tapOn:
    id: premium-gate-cancel
- assertVisible:
    id: podcast-detail-screen

- assertVisible: "Subscribe"
- tapOn:
    id: podcast-detail-subscribe-toggle
# Flipping to "Unsubscribe" is the proof the local write landed; signed out there is no server
# round trip behind it.
- assertVisible: "Unsubscribe"
# Subscribed but still signed out: the gear needs both, so it stays away.
- assertNotVisible:
    id: podcast-detail-settings
- takeScreenshot: subscriptions-anonymous-detail-after

# Home now has the subscription, so the empty state is gone and the filter has something to narrow.
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- assertNotVisible:
    id: home-list-empty
- assertNotVisible:
    id: home-feed-summary

# The row states when the channel last published, from the device. It arrives with the episode sync
# rather than with the subscribe, so this waits rather than asserting immediately.
#
# The other three pieces of row metadata are deliberately absent here and that is the correct state,
# not a gap: nothing is downloaded, the live badge needs an account, and a channel that has never
# been opened has nothing unseen — following a show must not claim its whole back catalogue is new.
- extendedWaitUntil:
    visible:
      id: "home-feed-row-updated-.*"
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible:
    id: "home-feed-row-unseen-.*"
- assertNotVisible:
    id: "home-feed-row-downloaded-.*"
- takeScreenshot: home-row-updated

# The grid draws the same subscription as an artwork tile. Asserted here rather than in home.yaml,
# whose account follows nothing — an empty grid and an empty list look identical.
- tapOn:
    id: home-overflow-trigger
- tapOn:
    id: home-overflow-view-grid
- assertVisible:
    id: "home-feed-cell-.*"
# A tile is artwork alone, so the row layout beneath it is gone rather than merely narrower.
- assertNotVisible:
    id: "home-feed-row-updated-.*"
- takeScreenshot: home-view-grid-subscribed

- tapOn:
    id: home-overflow-trigger
- tapOn:
    id: home-overflow-view-list
- assertVisible:
    id: "home-feed-row-updated-.*"

# Filter to the subscription just made. The title comes off the row rather than being hardcoded,
# because the show came from a live search and its name is not fixed by the seed.
- copyTextFrom:
    id: "home-feed-row-title-.*"
- tapOn:
    id: home-filter-input
- inputText: ${maestro.copiedText}
- assertNotVisible:
    id: home-list-no-filter-matches
- takeScreenshot: home-filter-matching-subscription
- tapOn:
    id: home-filter-clear

# A term nothing answers to is the other empty state: no matches, and no Search button, because the
# user has subscriptions and only needs to change what they typed.
- tapOn:
    id: home-filter-input
- inputText: "zzzznomatch"
- assertVisible:
    id: home-list-no-filter-matches
- assertNotVisible:
    id: home-list-empty-search
- takeScreenshot: home-filter-no-matches
- tapOn:
    id: home-filter-clear
- assertNotVisible:
    id: home-list-no-filter-matches
- hideKeyboard

# Still signed out, Home keeps the subscription instead of showing a login prompt.
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- assertNotVisible:
    id: home-list-empty
- takeScreenshot: subscriptions-anonymous-home

# Relaunch WITHOUT clearState — this is the persistence assertion the flow exists for.
- launchApp:
    clearState: false
- runFlow: shared/connect-dev-client.yaml

- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- assertNotVisible:
    id: home-list-empty
- takeScreenshot: subscriptions-anonymous-after-relaunch

# Clips are account-backed for the subscribed list. With a local podcast follow and no account,
# Home → Clips asks to log in rather than showing the global directory (or Browse alone).
- tapOn:
    id: home-media-type-clips
- assertVisible: Clips
- assertVisible:
    id: home-list-empty
- assertVisible:
    id: home-list-empty-login
- assertNotVisible:
    id: home-list-empty-browse
- assertNotVisible:
    id: home-filter-input
- assertNotVisible: "Dummy clip"
- takeScreenshot: home-clips-login-required

# Swipe left on the subscribed channel to reveal Unsubscribe. The row is gone when it completes,
# so Home returns to the empty discovery state this flow opened on.
- tapOn:
    id: home-media-type-podcasts
- assertVisible:
    id: "home-feed-row-.*-swipe"
- swipe:
    from:
      id: "home-feed-row-.*-swipe"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "home-feed-row-.*-unsubscribe"
    timeout: ${TIMEOUT_FASTEST}
- takeScreenshot: home-channel-swipe-unsubscribe
- tapOn:
    id: "home-feed-row-.*-unsubscribe"
- extendedWaitUntil:
    visible:
      id: home-list-empty
    timeout: ${TIMEOUT_FASTER}
- assertVisible:
    id: home-list-empty-search
- takeScreenshot: home-channel-unsubscribed
