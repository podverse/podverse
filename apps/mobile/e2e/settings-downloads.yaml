appId: com.podverse.app.next
name: Settings Downloads Storage
---
# More → Settings → Downloads: storage sizes (track only when a cap exists; fill is the used
# portion and can be zero-width), limit row, auto-free toggles, and danger Delete all with confirm.
# Storage management lives here rather than on the Downloads list.
#
# Needs flow_needs_e2e_api (login + Settings hub).

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-settings
- assertVisible:
    id: more-settings-screen
- tapOn:
    id: more-settings-downloads
- assertVisible:
    id: more-settings-downloads-screen
# This device has no saved download folder, so the chosen-folder card is not on the screen.
- assertNotVisible:
    id: more-settings-downloads-chosen-folder
- assertVisible:
    id: settings-downloads-device
- assertVisible:
    id: settings-downloads-device-track
- assertVisible:
    id: settings-downloads-device-fill
- assertVisible:
    id: settings-downloads-media
- assertVisible:
    id: settings-downloads-media-track
- assertNotVisible:
    id: settings-downloads-media-fill
- assertVisible:
    id: settings-downloads-app-data
- assertNotVisible:
    id: settings-downloads-app-data-track
- assertVisible:
    id: settings-downloads-cache
- assertNotVisible:
    id: settings-downloads-cache-track
- assertVisible:
    id: more-settings-downloads-limit
- assertVisible:
    id: more-settings-downloads-auto-download-default
- assertVisible:
    id: more-settings-downloads-cellular-default
# Catch-up sits under the storage card. The mini player can push it below the fold, so scroll
# it up before asserting rather than assuming the first screenful includes it.
- scrollUntilVisible:
    element:
      id: more-settings-downloads-catch-up-limit
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: more-settings-downloads-catch-up-limit
# The auto-free rows sit below the fold once the mini player is up. The second row stays
# under that bar after the first row is on screen, so each row is scrolled in on its own.
- scrollUntilVisible:
    element:
      id: more-settings-downloads-auto-limit
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: more-settings-downloads-auto-limit
- scrollUntilVisible:
    element:
      id: more-settings-downloads-auto-device-low
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: more-settings-downloads-auto-device-low
- takeScreenshot: settings-downloads-storage

# Delete All is the last row, so the list cannot scroll it to the center. The sliver that
# first appears sits under the mini player, and a tap there misses the button. A short swipe
# moves it clear of that bar. The mini player clock never lets the screen go still, so this
# scroll does not wait long to settle.
- scrollUntilVisible:
    element:
      id: more-settings-downloads-delete-all
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
    waitToSettleTimeoutMs: 400
- swipe:
    start: "50%,70%"
    end: "50%,50%"
    duration: 400
- tapOn:
    id: more-settings-downloads-delete-all
- assertVisible:
    id: more-settings-downloads-delete-all-dialog
- tapOn:
    id: more-settings-downloads-delete-all-cancel
- assertNotVisible:
    id: more-settings-downloads-delete-all-dialog
- takeScreenshot: settings-downloads-delete-cancelled

# The limit row is above this fold. The mini player clock never lets the screen go still, so a
# scroll that waits to settle can give up while the row is already on screen.
- repeat:
    times: 4
    commands:
      - swipe:
          direction: DOWN
          waitToSettleTimeoutMs: 400
- assertVisible:
    id: more-settings-downloads-limit
- tapOn:
    id: more-settings-downloads-limit
- assertVisible:
    id: more-settings-download-limit-screen
- assertVisible:
    id: more-settings-download-limit-10gb
- takeScreenshot: settings-downloads-limit
- runFlow: shared/stack-back.yaml
- assertVisible:
    id: more-settings-downloads-screen
- scrollUntilVisible:
    element:
      id: more-settings-downloads-catch-up-limit
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: more-settings-downloads-catch-up-limit
- assertVisible:
    id: more-settings-auto-download-catch-up-screen
- assertVisible:
    id: more-settings-auto-download-catch-up-20
- takeScreenshot: settings-downloads-catch-up
- runFlow: shared/stack-back.yaml
- assertVisible:
    id: more-settings-downloads-screen
