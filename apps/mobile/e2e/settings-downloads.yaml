appId: com.podverse.app.next
name: Settings Downloads Storage
---
# More → Settings → Downloads: storage sizes (track only when a cap exists; fill is the used
# portion and can be zero-width), limit row, auto-free toggles, and danger Delete all with confirm.
# Storage management lives here rather than on the Downloads list.
#
# Needs flow_needs_e2e_api (login + Settings hub).

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-settings
- assertVisible:
    id: more-settings-screen
- tapOn:
    id: more-settings-downloads
- assertVisible:
    id: more-settings-downloads-screen
- assertVisible:
    id: settings-downloads-device
- assertVisible:
    id: settings-downloads-device-track
- assertVisible:
    id: settings-downloads-device-fill
- assertVisible:
    id: settings-downloads-media
- assertVisible:
    id: settings-downloads-media-track
- assertNotVisible:
    id: settings-downloads-media-fill
- assertVisible:
    id: settings-downloads-app-data
- assertNotVisible:
    id: settings-downloads-app-data-track
- assertVisible:
    id: settings-downloads-cache
- assertNotVisible:
    id: settings-downloads-cache-track
- assertVisible:
    id: more-settings-downloads-limit
- assertVisible:
    id: more-settings-downloads-auto-limit
- assertVisible:
    id: more-settings-downloads-auto-device-low
- takeScreenshot: settings-downloads-storage

- scrollUntilVisible:
    element:
      id: more-settings-downloads-delete-all
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
- tapOn:
    id: more-settings-downloads-delete-all
- assertVisible:
    id: more-settings-downloads-delete-all-dialog
- tapOn:
    id: more-settings-downloads-delete-all-cancel
- assertNotVisible:
    id: more-settings-downloads-delete-all-dialog
- takeScreenshot: settings-downloads-delete-cancelled

- scrollUntilVisible:
    element:
      id: more-settings-downloads-limit
    direction: UP
    timeout: ${TIMEOUT_FAST}
- tapOn:
    id: more-settings-downloads-limit
- assertVisible:
    id: more-settings-download-limit-screen
- assertVisible:
    id: more-settings-download-limit-10gb
- takeScreenshot: settings-downloads-limit
- tapOn:
    id: stack-header-back
- assertVisible:
    id: more-settings-downloads-screen
