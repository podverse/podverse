appId: com.podverse.app.next
name: Home Media Types
---
# Home media-type selector:
# - screenshot each Home media-type selector state
# - verify selector swipe/scroll interaction changes feed content
# - the always-visible local Filter input, and the no-subscriptions empty state
#
# Filtering down to a matching row and the "no matches" state are covered in
# subscriptions-anonymous.yaml, which is the flow that actually creates a subscription — the seeded
# account deliberately follows nothing, which is what makes it the right place for the empty state.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- assertNotVisible:
    id: home-subscription-filter

# Podcasts (default)
- assertVisible:
    id: home-media-type-podcasts
- assertVisible: Podcasts
- takeScreenshot: home-media-type-podcasts

# Home's sort chip leads the media-type row. The face shows the current order; the caret opens
# A-Z, Recent, and Popularity. A-Z is the default. There is no Categories chip here.
- assertVisible:
    id: home-sort-button
- assertVisible: A-Z
- assertNotVisible:
    id: home-category-button
- tapOn:
    id: home-sort-button
- assertVisible:
    id: home-sort-menu
- assertVisible:
    id: home-sort-alphabetical
- assertVisible:
    id: home-sort-recent
- assertVisible:
    id: home-sort-popularity
- takeScreenshot: home-sort-menu

# Selections apply as they are made, so the sheet closes onto the same list in the new order.
- tapOn:
    id: home-sort-recent
- assertVisible:
    id: home-screen
- assertVisible:
    id: home-sort-button
- assertVisible: Recent
- takeScreenshot: home-sort-recent

# Reopening shows the choice still selected: the chip reads the stored preference rather than
# whatever it was last handed.
- tapOn:
    id: home-sort-button
- assertVisible:
    id: home-sort-menu
- takeScreenshot: home-sort-recent-selected
- tapOn:
    id: home-sort-alphabetical
- assertVisible:
    id: home-sort-button
- assertVisible: A-Z

# The header overflow menu holds the view toggle and Mark All As Seen. The view is two checkable
# rows rather than one label that flips, so the menu states which mode is in effect.
- assertVisible:
    id: home-overflow-trigger
- tapOn:
    id: home-overflow-trigger
- extendedWaitUntil:
    visible:
      id: home-overflow-view-list
    timeout: ${TIMEOUT_FAST}
- takeScreenshot: home-overflow-menu

# The seeded account has one subscription with unseen items, so Mark All As Seen is enabled and
# closes the sheet after applying the local seen-state update.
- tapOn:
    id: home-overflow-mark-all-seen
- assertVisible:
    id: home-screen

- tapOn:
    id: home-overflow-trigger
- tapOn:
    id: home-overflow-view-grid
- assertVisible:
    id: home-screen
- takeScreenshot: home-view-grid

# Reopening shows grid checked: the menu reads the stored preference rather than assuming the tap
# it last handled is still in effect.
- tapOn:
    id: home-overflow-trigger
- takeScreenshot: home-overflow-menu-grid-selected
- tapOn:
    id: home-overflow-view-list
- assertVisible:
    id: home-screen

# Home is subscribed-only, so the seeded account shows its local subscriptions. Row metadata,
# the grid tile, and Mark All As Seen clearing badges are asserted in subscriptions-anonymous.yaml,
# which is the flow that creates a subscription.
- assertVisible:
    id: "home-feed-row-.*"

# The Filter input sits above the list.
- assertVisible:
    id: home-filter-input
- tapOn:
    id: home-filter-input
- inputText: "seed"
- assertVisible:
    id: home-feed-row-e2ePodChnl001
- assertNotVisible:
    id: home-list-no-filter-matches
- tapOn:
    id: home-filter-clear

# Episodes
# iOS can consume the first control tap to dismiss the focused filter keyboard. Selecting the same
# media type twice is idempotent, so the second tap completes the transition in either state.
- tapOn:
    id: home-media-type-episodes
- tapOn:
    id: home-media-type-episodes
- assertVisible: Episodes
- takeScreenshot: home-media-type-episodes

# Both menu entries describe the subscribed channel list — how to draw it, and catching up on it —
# so the menu is absent here rather than opening onto nothing that applies.
- assertNotVisible:
    id: home-overflow-trigger

# Episodes sorts too, and keeps its own choice — ordering podcasts by title says nothing about how
# episodes should be ordered.
- assertNotVisible:
    id: home-subscription-filter
- assertVisible:
    id: home-sort-button
- assertVisible: A-Z
- tapOn:
    id: home-sort-button
- assertVisible:
    id: home-sort-menu
- takeScreenshot: home-sort-episodes
- tapOn:
    id: home-sort-menu-cancel

# Clips
- tapOn:
    id: home-media-type-clips
- assertVisible: Clips
- takeScreenshot: home-media-type-clips

# Clips, artists, albums, and tracks share the same leading sort chip.
- assertVisible:
    id: home-sort-button

# Swipe the selector row itself — a %-of-screen start Y can miss the pills.
- swipe:
    from:
      id: home-media-type-selector
    direction: LEFT

# Artists
- tapOn:
    id: home-media-type-artists
- assertVisible: Artists
- takeScreenshot: home-media-type-artists

# Albums
- tapOn:
    id: home-media-type-albums
- assertVisible: Albums
- takeScreenshot: home-media-type-albums

# Tracks
- tapOn:
    id: home-media-type-tracks
- assertVisible: Tracks
- takeScreenshot: home-media-type-tracks
