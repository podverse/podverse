appId: com.podverse.app.next
name: Boost entry
---
# Opens the seeded podcast episode and the boost sheet. Submit stays untouched.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: home-search
- assertVisible:
    id: search-screen
- tapOn:
    id: search-input
- inputText: podcast
- assertVisible:
    id: search-result-row-0
- tapOn:
    id: search-result-row-0
- extendedWaitUntil:
    visible:
      id: podcast-detail-screen
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    id: podcast-episode-row-0
- extendedWaitUntil:
    visible:
      id: episode-detail-screen
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: episode-detail-boost
- tapOn:
    id: episode-detail-boost
- extendedWaitUntil:
    visible:
      id: boost-sheet
    timeout: ${TIMEOUT_FAST}
- tapOn:
    id: boost-sheet-close
- assertNotVisible:
    id: boost-sheet
