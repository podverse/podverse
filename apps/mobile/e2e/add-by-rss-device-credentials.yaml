appId: com.podverse.app.next
name: Add By RSS Device Credentials
---
# Signed out, a password-protected feed is added and parsed on this device. The username and
# password stay on the phone for the signed-out user, and a redirect to another host does not get
# them. Signing in to an existing account hides the feed and moves nothing; after sign-out the
# feed is listed again and still has its username and password.
# Needs flow_needs_e2e_api + flow_needs_test_assets.

- runFlow: shared/launch-and-connect.yaml

- tapOn:
    id: tab-my-library
- assertVisible:
    id: library-hub-screen
- tapOn:
    id: library-nav-add-by-rss
- assertVisible:
    id: rss-root-screen
- tapOn:
    id: rss-add-button
- assertVisible:
    id: rss-add-screen
- tapOn:
    id: rss-url-input
- inputText: http://localhost:2111/basic-auth/variants/feed-public-media.rss
- tapOn:
    id: rss-basic-auth-toggle-toggle
- assertVisible:
    id: rss-basic-auth-description
- assertVisible:
    id: rss-username-input
- tapOn:
    id: rss-username-input
- inputText: username
# The password field sits under the keyboard. Tapping the description dismisses it and moves
# focus off the username. hideKeyboard on Android leaves the username focused, so the password
# is typed into it.
- tapOn:
    id: rss-basic-auth-description
- tapOn:
    id: rss-password-input
- inputText: password
- tapOn:
    id: rss-basic-auth-description
- tapOn:
    id: rss-add-submit
- extendedWaitUntil:
    visible:
      id: rss-root-screen
    timeout: ${TIMEOUT_SLOWER}
- extendedWaitUntil:
    visible:
      text: ".*\\(public media\\)"
      childOf:
        id: rss-feed-list
    timeout: ${TIMEOUT_SLOW}
- assertNotVisible:
    id: rss-needs-credentials
- takeScreenshot: add-by-rss-device-credentials-listed

# The same username and password, sent to a URL that redirects onto the other loopback host.
# The device parse withholds them, and the feed answers 401.
- tapOn:
    id: rss-add-button
- assertVisible:
    id: rss-add-screen
- tapOn:
    id: rss-url-input
- inputText: http://localhost:2111/redirect/other-host/basic-auth/variants/feed-public-media.rss
- tapOn:
    id: rss-basic-auth-toggle-toggle
- tapOn:
    id: rss-username-input
- inputText: username
- tapOn:
    id: rss-basic-auth-description
- tapOn:
    id: rss-password-input
- inputText: password
- tapOn:
    id: rss-basic-auth-description
- tapOn:
    id: rss-add-submit
- extendedWaitUntil:
    visible:
      id: rss-root-screen
    timeout: ${TIMEOUT_SLOWER}

- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- scrollUntilVisible:
    element:
      id: more-nav-advanced
    direction: DOWN
    timeout: ${TIMEOUT_FAST}
- tapOn:
    id: more-nav-advanced
- assertVisible:
    id: more-advanced-screen
- tapOn:
    id: more-advanced-error-log
- assertVisible:
    id: error-log-screen
- tapOn:
    id: "error-log-row-[0-9]+"
    index: 0
- assertVisible:
    id: error-log-detail-screen
- assertVisible: ".*credentials_withheld_other_domain.*"
- takeScreenshot: add-by-rss-device-credentials-withheld

# The error log sits on the More stack. Tapping the focused tab returns to that tab's root.
# Quick login is an app-wide header control, so it is reachable there the same way it is on Library.
- tapOn:
    id: tab-more
- runFlow:
    when:
      notVisible:
        id: more-screen
    commands:
      - tapOn:
          id: tab-more
- assertVisible:
    id: more-screen
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-my-library
- runFlow:
    when:
      notVisible:
        id: rss-root-screen
    commands:
      - tapOn:
          id: library-nav-add-by-rss
- extendedWaitUntil:
    visible: "Vitium amitto volup traho praesentium tantillus totam balbus balbus paulatim."
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible: ".*\\(public media\\)"
- takeScreenshot: add-by-rss-device-credentials-signed-in

- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-nav-logout
- extendedWaitUntil:
    visible:
      id: anonymous-login-cta
    timeout: ${TIMEOUT_FAST}
- tapOn:
    id: tab-my-library
- runFlow:
    when:
      notVisible:
        id: rss-root-screen
    commands:
      - tapOn:
          id: library-nav-add-by-rss
- extendedWaitUntil:
    visible:
      text: ".*\\(public media\\)"
      childOf:
        id: rss-feed-list
    timeout: ${TIMEOUT_SLOW}
- assertNotVisible:
    id: rss-needs-credentials
- takeScreenshot: add-by-rss-device-credentials-after-sign-out
