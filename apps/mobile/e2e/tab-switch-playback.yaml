appId: com.podverse.app.next
name: Tab Switch Playback
---
# The mini player persists across tab switches and is hidden when nothing is playing, so playback is
# started via the orchestrator (real :2111 media) before asserting that the mini player survives tab
# navigation. Needs flow_needs_test_assets + flow_needs_e2e_api.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

# Start playback so the mini player has now-playing state to render.
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- tapOn:
    id: search-input
- inputText: podcast
- assertVisible:
    id: search-result-row-0
- tapOn:
    id: search-result-row-0
- assertVisible:
    id: podcast-detail-screen
- assertVisible:
    id: podcast-episode-row-0
- tapOn:
    id: podcast-episode-row-0
- assertVisible:
    id: episode-detail-screen
- tapOn:
    id: "home-row-play-.*"
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOW}

- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- assertVisible:
    id: mini-player
- takeScreenshot: tab-switch-home-mini-player

# Each tab owns its own navigation stack. We drilled Search -> Podcast -> Episode above to start
# playback, so which screen the Search tab shows on return is platform-dependent (iOS retains the
# Episode detail; Android may reset to SearchRoot) — do NOT assert a screen id here. The invariant
# under test is that the mini player persists across tab switches, so assert only the mini player.
- tapOn:
    id: tab-search
- assertVisible:
    id: mini-player
- takeScreenshot: tab-switch-search-mini-player

- tapOn:
    id: tab-my-library
- assertVisible:
    id: library-hub-screen
- assertVisible:
    id: mini-player
- takeScreenshot: tab-switch-library-mini-player
