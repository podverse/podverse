appId: com.podverse.app.next
name: Queue screen flow
---
# Queue screen parity smoke: load rows, medium chips, swipe remove, and empty state.
# Needs Mobile E2E API (:4230) only. No media playback assertions, so test-assets are not required.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

# Add one row to the AV queue so the loaded list and swipe-remove path have a known row.
# The seeded podcast queue already has rows; the flow clears them before the empty state.
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- tapOn:
    id: search-input
- inputText: podcast
- assertVisible:
    id: search-result-row-0
- tapOn:
    id: search-result-row-0
- assertVisible:
    id: podcast-detail-screen
- assertVisible:
    id: podcast-episode-row-0
- tapOn:
    id: podcast-episode-row-0
- assertVisible:
    id: episode-detail-screen
- tapOn:
    id: "home-row-more-.*"
- assertVisible:
    id: "media-row-menu-.*"
- tapOn:
    id: "media-row-action-queue-last-.*"

# Library -> Queue load with rows.
- tapOn:
    id: tab-my-library
- assertVisible:
    id: library-hub-screen
- tapOn:
    id: library-nav-queue
- assertVisible:
    id: library-queue-screen
- extendedWaitUntil:
    visible:
      id: "queue-row-.*-swipe"
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: "queue-row-.*-reorder"
- takeScreenshot: queue-screen-loaded

# Medium chips render and switching them reloads queue data. The seeded music queue has tracks.
- assertVisible:
    id: library-queue-medium-av
- assertVisible:
    id: library-queue-medium-music
- tapOn:
    id: library-queue-medium-music
- extendedWaitUntil:
    visible:
      text: "E2E Music Track One"
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: queue-screen-music-medium
- tapOn:
    id: library-queue-medium-av
- extendedWaitUntil:
    visible:
      id: "queue-row-.*-swipe"
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: "queue-row-.*-reorder"
- takeScreenshot: queue-screen-av-medium

# Swipe remove path.
- swipe:
    from:
      id: "queue-row-.*-swipe"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "queue-row-.*-swipe-remove"
    timeout: ${TIMEOUT_FAST}
- takeScreenshot: queue-screen-swipe-remove
- tapOn:
    id: "queue-row-.*-swipe-remove"
# The seeded podcast queue has more than the row this flow added. Clear the rest, then the
# empty state is the one this screen shows for the podcast medium.
- repeat:
    times: 8
    while:
      visible:
        id: "queue-row-.*-swipe"
    commands:
      - swipe:
          from:
            id: "queue-row-.*-swipe"
          direction: LEFT
      - extendedWaitUntil:
          visible:
            id: "queue-row-.*-swipe-remove"
          timeout: ${TIMEOUT_FAST}
      - tapOn:
          id: "queue-row-.*-swipe-remove"
- extendedWaitUntil:
    visible:
      id: library-queue-empty
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    text: "Nothing in your podcast queue yet"
- takeScreenshot: queue-screen-empty
# Drag reorder is intentionally not asserted here. Maestro long-press drag does not reliably
# validate the tap/swipe/drag arbitration contract; resolver unit tests + device checks cover it.
# The decorative reorder grip is asserted above whenever a queue row is visible.
