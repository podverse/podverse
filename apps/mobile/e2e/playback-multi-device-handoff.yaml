appId: com.podverse.app.next
name: Playback Multi-device Handoff
---
# Validates prompt behavior for different-item conflicts, dismissal memory, and the same-item
# no-prompt path. Maestro drives one device, so the "other device" now-playing state is seeded
# through the API-backed E2E stack.
#
# Needs flow_needs_e2e_api.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

# Load episode A and pause so it is the local item while playback is not active.
- openLink: podverse-next://episode/e2ePodResume01
- runFlow: shared/confirm-ios-open-dialog.yaml
- assertVisible:
    id: episode-detail-screen
- tapOn:
    id: "home-row-play-.*"
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    id: mini-player-play-pause
- assertVisible:
    id: mini-player-play-pause

# Seed a newer now-playing row for episode B to represent another device.
# Omit last_played_at so the host script stamps four minutes after now;
# resolveHandoffDecision only prompts when the remote timestamp is newer than the local pause.
- runScript:
    file: scripts/seed-playback-now-playing.js
    env:
      E2E_ITEM_ID_TEXT: e2ePodResume02
      E2E_PLAYBACK_EVENT_KIND: play
      E2E_PLAYBACK_POSITION: "57"

# Foreground trigger: replay + reconcile runs on app foreground/connectivity paths.
- launchApp:
    clearState: false
- runFlow: shared/connect-dev-client-overlay-ok.yaml
# Home paints before playback-replay finishes; wait for the prompt that job publishes.
- extendedWaitUntil:
    visible:
      id: playback-handoff-dialog
    timeout: ${TIMEOUT_SLOWEST}
# The prompt names both episodes in one sentence — local first, then the other device's — so match
# inside that sentence. The two titles are not separately assertable here: an open overlay takes the
# mini player and the rest of the app out of the accessibility tree by design.
- assertVisible:
    text: "(?s).*E2E Podcast Resume P > 0.*E2E Podcast Resume Near End.*"
- takeScreenshot: playback-handoff-prompt

# Continue keeps A loaded and demotes B to history.
- tapOn:
    id: playback-handoff-continue
- assertNotVisible:
    id: playback-handoff-dialog
- assertVisible:
    id: playback-now-playing-title-e2e
    text: "E2E Podcast Resume P > 0"

- tapOn:
    id: tab-my-library
- assertVisible:
    id: library-hub-screen
- tapOn:
    id: library-nav-history
- assertVisible:
    id: library-history-screen
- assertVisible:
    text: "E2E Podcast Resume Near End"
- takeScreenshot: playback-handoff-continue-history

# Dismissal is keyed to declined remote state; same state must not re-prompt.
- launchApp:
    clearState: false
- runFlow: shared/connect-dev-client.yaml
- assertNotVisible:
    id: playback-handoff-dialog

# Same item, newer server position: adopt silently with no prompt.
- runScript:
    file: scripts/seed-playback-now-playing.js
    env:
      E2E_ITEM_ID_TEXT: e2ePodResume01
      E2E_PLAYBACK_EVENT_KIND: seek
      E2E_PLAYBACK_POSITION: "47"
- launchApp:
    clearState: false
- runFlow: shared/connect-dev-client.yaml
- assertNotVisible:
    id: playback-handoff-dialog
- tapOn:
    id: mini-player
- assertVisible:
    id: full-player-screen
# The seeded server position is 47s, so adoption is visible as a 0:4x clock rather than 0:00.
- assertVisible:
    id: full-player-position
    text: "0:4[0-9]"
- takeScreenshot: playback-handoff-same-item-no-prompt
