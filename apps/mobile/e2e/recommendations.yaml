appId: com.podverse.app.next
name: Recommendations
---
# Seeded e2e-taste-profile account has Taste Profile on and a seeded HLS recommendation row.

- runFlow: shared/launch-and-connect.yaml

- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: anonymous-login-cta
- assertVisible:
    id: login-screen
- tapOn:
    id: login-email
- inputText: e2e-taste-profile@example.com
- tapOn:
    id: login-password
- inputText: "Test!1Aa"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: ${TIMEOUT_SLOW}

- tapOn:
    id: tab-recommendations
- assertVisible:
    id: recommendations-screen
- assertVisible:
    id: recommendations-edit
- assertNotVisible:
    id: browse-sort-button
- assertVisible:
    id: recommendations-overflow-trigger
- tapOn:
    id: recommendations-overflow-trigger
- extendedWaitUntil:
    visible:
      id: recommendations-overflow-view-list
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    id: recommendations-overflow-view-grid
- tapOn:
    id: recommendations-overflow-menu-cancel
- assertVisible: "E2E HLS VOD Channel"
- takeScreenshot: recommendations-seeded-row

- tapOn:
    id: recommendations-edit
- assertVisible:
    id: more-settings-taste-profile-screen
- takeScreenshot: recommendations-edit-settings

- tapOn:
    id: tab-recommendations
- assertVisible:
    id: recommendations-screen
- assertVisible: "E2E HLS VOD Channel"
- tapOn:
    id: home-row-more-e2eHlsChnl001
- extendedWaitUntil:
    visible:
      text: "Hide"
    timeout: ${TIMEOUT_FAST}
- tapOn: "Hide"
- assertNotVisible: "E2E HLS VOD Channel"
- takeScreenshot: recommendations-after-hide

- tapOn:
    id: recommendations-edit
- assertVisible:
    id: more-settings-taste-profile-screen
- scrollUntilVisible:
    element:
      id: channel-hidden-section-toggle
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    id: channel-hidden-section-toggle
- assertVisible: "E2E HLS VOD Channel"
- tapOn:
    id: channel-hidden-unhide-e2eHlsChnl001
- assertNotVisible:
    id: channel-hidden-row-e2eHlsChnl001
- takeScreenshot: recommendations-after-unhide
