appId: com.podverse.app.next
name: Add By RSS Flow
---
# Add-by-RSS import/manage in My Library, browse/play on the Home stack.
# Fixture URL matches web e2e seed constants / accountAddByRSSParse E2E payload.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- tapOn:
    id: tab-my-library
- assertVisible:
    id: library-hub-screen
- tapOn:
    id: library-nav-add-by-rss
- assertVisible:
    id: rss-root-screen
# Optional Basic Auth fields sit under the URL; a public feed leaves them empty.
- assertVisible:
    id: rss-username-input
- assertVisible:
    id: rss-password-input
- takeScreenshot: add-by-rss-screen-initial

- tapOn:
    id: rss-url-input
- inputText: https://e2e-seed-addbyrss.example/podcast.xml
- tapOn:
    id: rss-add-submit
- takeScreenshot: add-by-rss-after-submit

# Library is import + manage only: the feed row and parse status, no Play.
- assertVisible:
    id: rss-feed-row-first
- assertVisible:
    id: rss-feed-status-first
- assertVisible: Parsed
- takeScreenshot: add-by-rss-feed-listed

# A followed add-by-RSS feed is part of the unified Podcasts Home list, while My Library remains
# the place to add and manage feeds. Android can still have the keyboard over the tab bar if
# dismiss did not land before this tap; iOS hideKeyboard is flaky, so the app dismisses there.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: tab-home
- assertVisible:
    id: home-screen
- assertVisible: E2E Add-by-RSS Channel
- tapOn:
    text: E2E Add-by-RSS Channel
- assertVisible:
    id: add-by-rss-home-detail-screen
- assertVisible: E2E Add-by-RSS Channel
- assertVisible:
    id: add-by-rss-home-play-first
- takeScreenshot: add-by-rss-home-detail

# Real media: enclosure localhost:2111 → 127.0.0.1 (iOS) / 10.0.2.2 (Android) in E2E.
# Playback lives on the Home detail, not the Library manage list. Do not hideKeyboard
# here — with the keyboard already gone, Android treats that as Back and pops this screen.
- tapOn:
    id: add-by-rss-home-play-first
- extendedWaitUntil:
    visible:
      id: add-by-rss-home-playback-active
    timeout: ${TIMEOUT_SLOWEST}
- takeScreenshot: add-by-rss-playback-active

- tapOn:
    id: add-by-rss-home-remove
- assertVisible:
    id: home-screen
