appId: com.podverse.app.next
name: Auth Logout
---
# Track 6.12: login then logout (More tab), return to anonymous tab shell.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- assertVisible:
    id: home-screen
- takeScreenshot: auth-logout-before-logout

# Prefer More-tab logout (product shell).
- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-nav-logout

# Logout keeps you on the current (More) tab and re-renders it in place as the anonymous shell
# (Login / Sign Up). It does NOT route to Home: App.tsx `onRequestLogout` only calls `logout()` +
# `setAuthMode('anonymous')`, so the mounted tab navigator stays on More. Assert the anonymous
# More shell directly instead of a Home round-trip.
- extendedWaitUntil:
    visible:
      id: anonymous-login-cta
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    id: more-screen
- assertVisible:
    id: anonymous-login-cta
- takeScreenshot: auth-logout-anonymous-shell
