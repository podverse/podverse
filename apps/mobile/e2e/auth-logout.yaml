appId: com.podverse.app.next
name: Auth Logout
---
# Track 6.12: login then logout (More tab), return to anonymous tab shell.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- assertVisible:
    id: home-screen
- takeScreenshot: auth-logout-before-logout

# Prefer More-tab logout (product shell).
- tapOn:
    id: tab-more
- assertVisible:
    id: more-screen
- tapOn:
    id: more-nav-logout

# Logout keeps you on the current (More) tab and re-renders it in place as the anonymous shell
# (Login / Sign Up). It does NOT route to Home: App.tsx `onRequestLogout` only calls `logout()` +
# `setAuthMode('anonymous')`, so the mounted tab navigator stays on More. Assert the anonymous
# More shell directly instead of a Home round-trip.
- extendedWaitUntil:
    visible:
      id: anonymous-login-cta
    timeout: ${TIMEOUT_FAST}
- assertVisible:
    id: more-screen
- assertVisible:
    id: anonymous-login-cta
- takeScreenshot: auth-logout-anonymous-shell

# Signing yourself out is not a forced logout, so the "you've been signed out" dialog must stay
# away. A false alarm here would train users to dismiss the one message that matters.
#
# Only the no-notice half is checked on device: a real forced logout needs the server to reject the
# refresh token, which Maestro cannot arrange (and `launchApp: clearState` wipes the persisted
# marker, so seeding it here would assert nothing). The marker and reason logic are covered in
# `src/auth/forcedLogoutNotice.test.ts`; the notice itself is verified by hand.
- assertNotVisible:
    id: forced-logout-modal
- takeScreenshot: auth-logout-no-forced-logout-notice
