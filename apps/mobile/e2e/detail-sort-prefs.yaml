appId: com.podverse.app.next
name: Detail Sort Prefs
---
# Sort on the detail screens is remembered per instance: one podcast ordered oldest-first says
# nothing about the next podcast, and the choice survives leaving the screen.
#
# Instances are reached by deep link rather than search, because the two podcasts have to be
# specific, known channels for "these two hold different sorts" to mean anything. Search results
# come back in whatever order Podcast Index chose.
#
# Anonymous throughout: these preferences are device-local, so an account is not what makes them
# work, and a flow that logged in would suggest otherwise.

- runFlow: shared/launch-and-connect.yaml

# --- Podcast A: change its order ---
- openLink: podverse-next://podcast/e2ePodChnl001
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: podcast-detail-screen
    timeout: ${TIMEOUT_SLOWEST}
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: podcast-detail-sections
      TRAILING_ID: podcast-detail-sort-button
- extendedWaitUntil:
    visible:
      id: podcast-detail-sort-button
    timeout: ${TIMEOUT_SLOWEST}
- takeScreenshot: detail-sort-podcast-a-default

# The choices open as a sheet over the list, so the rows they reorder stay behind it.
- tapOn:
    id: podcast-detail-sort-button
- assertVisible:
    id: podcast-detail-sort-menu
- takeScreenshot: detail-sort-podcast-a-options
- tapOn:
    id: podcast-detail-sort-oldest
# Selecting dismisses the sheet: the list underneath has already changed, and an open sheet would
# be covering the result.
- assertNotVisible:
    id: podcast-detail-sort-menu
- assertVisible:
    id: podcast-detail-sort-button
- takeScreenshot: detail-sort-podcast-a-oldest

# The popularity window is a separate control, and it only exists while the order is by top —
# a range over a list ordered by date would have nothing to narrow.
- assertNotVisible:
    id: podcast-detail-range-button
- tapOn:
    id: podcast-detail-sort-button
- tapOn:
    id: podcast-detail-sort-top
- extendedWaitUntil:
    visible:
      id: podcast-detail-range-button
    timeout: ${TIMEOUT_FASTER}
# The range chip mounts already counted as visible while its center is still past the
# trailing edge of the phone, so a tap there never opens the sheet.
- swipe:
    from:
      id: podcast-detail-sections
    direction: LEFT
- tapOn:
    id: podcast-detail-range-button
- tapOn:
    id: podcast-detail-range-month
- assertVisible:
    id: podcast-detail-range-button
- takeScreenshot: detail-sort-podcast-a-top-month

# --- Podcast A: the section is remembered too, because it decides what the screen loads ---
- runFlow:
    file: shared/restore-chip-row-start.yaml
    env:
      CHIP_ROW_ID: podcast-detail-sections
- tapOn:
    id: podcast-detail-section-about
- extendedWaitUntil:
    visible:
      id: podcast-detail-about
    timeout: ${TIMEOUT_FASTER}
- extendedWaitUntil:
    notVisible:
      id: podcast-detail-about-loading
    timeout: ${TIMEOUT_SLOWER}
# About is prose, so the title filter and sort chip do not apply.
- assertNotVisible:
    id: podcast-detail-sort-button
- assertNotVisible:
    id: podcast-detail-filter-input
- takeScreenshot: detail-sort-podcast-a-about

# --- Podcast B: unaffected by A ---
- openLink: podverse-next://podcast/v5fCrIj9Io
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: podcast-detail-screen
    timeout: ${TIMEOUT_SLOWEST}
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: podcast-detail-sections
      TRAILING_ID: podcast-detail-sort-button
- extendedWaitUntil:
    visible:
      id: podcast-detail-sort-button
    timeout: ${TIMEOUT_SLOWEST}
- assertVisible:
    id: podcast-detail-filter-input
- takeScreenshot: detail-sort-podcast-b-default

# --- Back to A: its own section, order, and window are all still in effect ---
- openLink: podverse-next://podcast/e2ePodChnl001
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: podcast-detail-screen
    timeout: ${TIMEOUT_SLOWEST}
- extendedWaitUntil:
    visible:
      id: podcast-detail-about
    timeout: ${TIMEOUT_FAST}
- extendedWaitUntil:
    notVisible:
      id: podcast-detail-about-loading
    timeout: ${TIMEOUT_SLOWER}
- takeScreenshot: detail-sort-podcast-a-section-restored

# Back to Episodes brings the remembered order and window with it.
- tapOn:
    id: podcast-detail-section-episodes
- extendedWaitUntil:
    visible:
      id: podcast-detail-range-button
    timeout: ${TIMEOUT_FASTER}
- takeScreenshot: detail-sort-podcast-a-restored

# --- Album: authored order by default, reversible, remembered ---
- openLink: podverse-next://album/e2eMusicAlbm01
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: album-detail-screen
    timeout: ${TIMEOUT_SLOWEST}
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: album-detail-sections
      TRAILING_ID: album-detail-sort-pill-button
- extendedWaitUntil:
    visible:
      id: album-detail-sort-pill-button
    timeout: ${TIMEOUT_SLOWEST}
- takeScreenshot: detail-sort-album-default

- tapOn:
    id: album-detail-sort-pill-button
- tapOn:
    id: album-detail-sort-backward
- extendedWaitUntil:
    visible:
      id: album-detail-sort-pill-button
    timeout: ${TIMEOUT_SLOW}
- takeScreenshot: detail-sort-album-backward

- openLink: podverse-next://album/e2eMusicAlbm01
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: album-detail-sections
    timeout: ${TIMEOUT_SLOWEST}
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: album-detail-sections
      TRAILING_ID: album-detail-sort-pill-button
- extendedWaitUntil:
    visible:
      id: album-detail-sort-pill-button
    timeout: ${TIMEOUT_SLOWEST}
- takeScreenshot: detail-sort-album-restored

# --- Episode: the tab is remembered too, because it decides which request the screen makes ---
- openLink: podverse-next://episode/e2ePodChap0001
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: episode-detail-screen
    timeout: ${TIMEOUT_SLOWEST}
- extendedWaitUntil:
    visible:
      id: episode-detail-tab-clips
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    id: episode-detail-tab-clips
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: episode-detail-sections
      TRAILING_ID: episode-detail-clip-sort-button
- extendedWaitUntil:
    visible:
      id: episode-detail-clip-sort-button
    timeout: ${TIMEOUT_SLOWER}
- assertNotVisible:
    id: episode-detail-tab-error-clips
- takeScreenshot: detail-sort-episode-clips-default

- tapOn:
    id: episode-detail-clip-sort-button
- tapOn:
    id: episode-detail-clip-sort-oldest
- extendedWaitUntil:
    visible:
      id: episode-detail-clip-sort-button
    timeout: ${TIMEOUT_SLOWER}
- takeScreenshot: detail-sort-episode-clips-oldest

# Reopening lands on Clips with the same order, without passing through Summary first.
- openLink: podverse-next://episode/e2ePodChap0001
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: episode-detail-sections
    timeout: ${TIMEOUT_SLOWEST}
- runFlow:
    file: shared/reveal-chip-row-trailing.yaml
    env:
      CHIP_ROW_ID: episode-detail-sections
      TRAILING_ID: episode-detail-clip-sort-button
- extendedWaitUntil:
    visible:
      id: episode-detail-clip-sort-button
    timeout: ${TIMEOUT_SLOWEST}
- takeScreenshot: detail-sort-episode-clips-restored
