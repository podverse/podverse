appId: com.podverse.app.next
name: Livestream Player Controls
---
# A livestream shows a Live control where an episode shows its duration. A window too
# short to rewind hides the scrubber, the position, and the jump buttons.
#
# Needs flow_needs_e2e_api + flow_needs_test_assets.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

# Episode first. The duration slot is a length, and there is no Live control.
- openLink: podverse-next://episode/e2ePodChap0001
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: episode-detail-screen
    timeout: ${TIMEOUT_SLOWER}
- tapOn:
    id: home-row-play-e2ePodChap0001
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
      text: playing
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    id: mini-player
- extendedWaitUntil:
    visible:
      id: full-player-screen
    timeout: ${TIMEOUT_SLOW}
- extendedWaitUntil:
    visible:
      id: full-player-duration
    timeout: ${TIMEOUT_SLOW}
- assertNotVisible:
    id: full-player-live-control
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: full-player-close
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
- extendedWaitUntil:
    notVisible:
      id: full-player-screen
    timeout: ${TIMEOUT_SLOW}

# Live, with a window too short to rewind. The band is the Live control alone.
- openLink: podverse-next://episode/e2eLiveHlsA01
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: episode-detail-screen
    timeout: ${TIMEOUT_SLOWER}
- tapOn:
    id: home-row-play-e2eLiveHlsA01
- extendedWaitUntil:
    visible:
      id: playback-now-playing-title-e2e
      text: "E2E Live HLS Audio Stream"
    timeout: ${TIMEOUT_SLOW}
- tapOn:
    id: mini-player
- extendedWaitUntil:
    visible:
      id: full-player-live-control
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: full-player-live-progress-block
- assertNotVisible:
    id: full-player-duration
- assertNotVisible:
    id: full-player-position
- assertNotVisible:
    id: full-player-scrubber
- assertNotVisible:
    id: full-player-live-behind
- assertNotVisible:
    id: full-player-jump-back
- assertNotVisible:
    id: full-player-jump-forward
- assertVisible:
    id: full-player-play-pause
- takeScreenshot: livestream-player-live-only
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: full-player-close
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
- extendedWaitUntil:
    notVisible:
      id: full-player-screen
    timeout: ${TIMEOUT_SLOW}
# Leave the seeded account's now-playing state quiet for later flows.
- tapOn:
    id: mini-player-play-pause
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
      text: paused
    timeout: ${TIMEOUT_FAST}
