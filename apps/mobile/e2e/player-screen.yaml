appId: com.podverse.app.next
name: Player screen flow
---
# Full-player shell: outer scroll (player → chips → height-locked pane sheet), first-paint chip
# peek, inner pane scroll, and sheet-only controls. Uses the chaptered seeded episode so the
# Chapters pane is always available.

- runFlow: shared/launch-and-connect.yaml
- runFlow: shared/login-seeded-user.yaml

- openLink: podverse-next://podcast/e2ePodChnl001/episode/e2ePodChap0001
- runFlow: shared/confirm-ios-open-dialog.yaml
- extendedWaitUntil:
    visible:
      id: episode-detail-screen
    timeout: ${TIMEOUT_SLOWER}

- tapOn:
    id: "home-row-play-.*"
- extendedWaitUntil:
    visible:
      id: playback-active-e2e
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: mini-player
- tapOn:
    id: mini-player

- assertVisible:
    id: full-player-screen
- assertVisible:
    id: full-player-sections
# First paint keeps the whole transport on screen with the chip strip peeking under it. Pane copy
# stays below the fold, which is why its absence is left to the screenshot: off-screen and
# unmounted read the same to Maestro on iOS.
- assertVisible:
    id: full-player-transport-row
- assertNotVisible:
    id: full-player-condensed-bar
- takeScreenshot: player-screen-initial-peek

- tapOn:
    id: full-player-section-chapters
- extendedWaitUntil:
    notVisible:
      id: full-player-pane-loading-chapters
    timeout: ${TIMEOUT_SLOWER}

# Outer scroll brings the height-locked sheet on screen (chips at top, bottom radius visible).
- scrollUntilVisible:
    element:
      id: full-player-pane-sheet
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: full-player-pane-sheet
- assertVisible:
    id: full-player-section-header
# Chapter rows scroll inside the sheet, not by lengthening the outer column.
- scrollUntilVisible:
    element:
      id: full-player-chapter-row
    direction: DOWN
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: full-player-chapter-row
- assertVisible:
    id: full-player-pane-sheet
- takeScreenshot: player-screen-chapters-pane

# Restore the transport by outer scroll from the chip strip — not by assuming one list owns both
# directions. Swipes on the chips drive the outer scroller; the ink sheet keeps its own inner list.
- scrollUntilVisible:
    element:
      id: full-player-transport-row
    direction: UP
    timeout: ${TIMEOUT_SLOW}
- assertVisible:
    id: full-player-region
# The segment row below the artwork is reserved whether or not a chapter or clip is named, so a
# chapter starting cannot move the artwork or the transport.
- assertVisible:
    id: full-player-segment-band
# A named chapter puts the chapter link to the right of the title and time.
- assertVisible:
    id: full-player-segment-title
- assertVisible:
    id: full-player-chapter-link
- assertVisible:
    id: full-player-transport-row
- assertVisible:
    id: full-player-skip-previous
- assertVisible:
    id: full-player-jump-back
- assertVisible:
    id: full-player-play-pause
- assertVisible:
    id: full-player-jump-forward
- assertVisible:
    id: full-player-skip-next
- assertVisible:
    id: full-player-scrubber
- assertVisible:
    id: full-player-position
# Duration comes from item_about.duration or native metadata so seek is enabled after play.
- assertVisible:
    id: full-player-duration
- assertVisible:
    id: full-player-chapter-marker
- takeScreenshot: player-screen-region-restored

# Stationary tap on the artwork opens the shared image viewer. Overlays stay in the app tree, so
# dismiss before later taps or they land on the player underneath.
- tapOn:
    id: full-player-artwork
- assertVisible:
    id: image-viewer
- takeScreenshot: player-screen-image-viewer
- tapOn:
    id: image-viewer-back
- assertVisible:
    id: full-player-screen
- assertVisible:
    id: full-player-artwork

# The chapter tooltip is a transient affordance. A hierarchy snapshot on Android can take longer
# than the window it lives in, so this flow does not assert it — asserting it would require the
# label to stay on screen. The screenshot in the report is the check.
- longPressOn:
    id: full-player-scrubber
- takeScreenshot: player-screen-chapter-tooltip
- tapOn:
    id: full-player-scrubber

- tapOn:
    id: full-player-create-clip
# The first Create clip of an install covers the form with the how-to (make-clip covers its content).
# Overlays live in the app's own tree, so the form's ids stay in the hierarchy underneath and only a
# real dismissal makes the header actionable — asserting the form first would tap through the how-to.
- extendedWaitUntil:
    visible:
      id: make-clip-how-to-modal
    timeout: ${TIMEOUT_SLOW}
- extendedWaitUntil:
    notVisible:
      id: make-clip-how-to-modal-loading
    timeout: ${TIMEOUT_SLOWER}
- tapOn:
    id: make-clip-how-to-close
- assertNotVisible:
    id: make-clip-how-to-modal
- assertVisible:
    id: make-clip-screen
- assertVisible:
    id: make-clip-close
- takeScreenshot: player-screen-create-clip-screen
- tapOn:
    id: make-clip-close
# Popping back to the player plays a stack transition, so wait for it rather than asserting into the
# animation.
- extendedWaitUntil:
    visible:
      id: full-player-screen
    timeout: ${TIMEOUT_SLOW}

- tapOn:
    id: full-player-more
- assertVisible:
    id: full-player-more-sheet
- assertVisible:
    id: full-player-more-subscription
- assertVisible:
    id: full-player-more-mark-played
- takeScreenshot: player-screen-more-sheet
- tapOn:
    id: full-player-more-sheet-cancel
- assertNotVisible:
    id: full-player-more-sheet

- tapOn:
    id: full-player-speed
- assertVisible:
    id: full-player-speed-sheet
- assertNotVisible:
    id: full-player-speed-control
- takeScreenshot: player-screen-speed-sheet
- tapOn:
    id: full-player-speed-sheet-cancel

- tapOn:
    id: full-player-sleep-timer
- assertVisible:
    id: full-player-sleep-sheet
- assertNotVisible:
    id: full-player-sleep-timer-control
- takeScreenshot: player-screen-sleep-sheet
- tapOn:
    id: full-player-sleep-sheet-cancel

- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: full-player-close
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: Back
- extendedWaitUntil:
    notVisible:
      id: full-player-screen
    timeout: ${TIMEOUT_SLOW}
