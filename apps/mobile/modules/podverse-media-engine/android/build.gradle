plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.podversemediaengine'
version = '1.0.0'

ext.safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.podversemediaengine"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
  }
}

// Media3 version for the shared ExoPlayer + MediaLibraryService (phone and car).
// Overridable from the root project via ext.media3Version.
// HLS playlists load only when media3-exoplayer-hls is present at this same version.
def media3Version = rootProject.ext.has("media3Version") ? rootProject.ext.get("media3Version") : "1.4.1"

dependencies {
  // ContextCompat (used by PodverseAudioEngine to start the foreground MediaLibraryService).
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-session:${media3Version}"
  // Protected add-by-RSS media: OkHttp answers the host's 401 through a scoped Authenticator and
  // drops Authorization on any redirect to a different host, port, or scheme.
  implementation "androidx.media3:media3-datasource-okhttp:${media3Version}"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
