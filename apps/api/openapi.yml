          enum:
            - web
            - ios
            - android
            - foss
          example: web
        storefront:
          type: string
          nullable: true
          example: null
        processors:
          type: array
          items:
            $ref: "#/components/schemas/BillingCheckoutProcessor"
    BillingEventOutcome:
      type: object
      required:
        - status
