    StatsListenRequest:
      type: object
      description: >-
        One report of a listening session. Exactly one of item_id_text and clip_id_text is
        required. The body carries no device time; the server's receive time dates the listen.
      required:
        - client_listen_id
        - seconds_heard
      oneOf:
        - required:
            - item_id_text
        - required:
            - clip_id_text
      properties:
        item_id_text:
          type: string
          description: The episode or track heard. A soundbite listen sends its item.
        clip_id_text:
          type: string
          description: The clip heard. The server derives its item and channel.
        client_listen_id:
          type: string
          format: uuid
          description: >-
            One random id per listening session, generated by the device. Every report for the
            session reuses it.
        seconds_heard:
          type: integer
          minimum: 0
          maximum: 86400
          description: Media seconds actually played in this session so far.
        completed:
          type: boolean
          default: false
          description: The session reached the end of the item or clip.
      example:
        item_id_text: "kM7T2xYqLp"
        client_listen_id: "3f6c2a9e-8d41-4b7a-9c35-1e2f4a6b8c0d"
        seconds_heard: 75
        completed: false
    StatsListenResponse:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - counted
            - updated
            - unchanged
            - daily_cap_reached
            - too_soon
            - below_threshold
            - not_allowed
            - not_found
            - clip_source_removed
      example:
        result: counted
    StatsOpenRequest:
      type: object
      description: Exactly one of account_id_text (a profile opened) and playlist_id_text (a playlist opened) is required.
      oneOf:
        - required:
            - account_id_text
        - required:
            - playlist_id_text
      properties:
        account_id_text:
          type: string
        playlist_id_text:
          type: string
      example:
        playlist_id_text: "9fZq4Nb1Rd"
    StatsOpenResponse:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - counted
            - unchanged
            - own_content
            - daily_cap_reached
      example:
        result: counted
    AccountFollowingAddByRSSChannel:
      type: object
      required:
        - account_id
        - feed_url
      properties:
        account_id:
          type: integer
          format: int64
        feed_url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        requires_credentials:
          type: boolean
          description: >-
            The feed needs Basic Auth. Credentials are never stored or returned; devices send them
            with each parse or chapters request.
    BillingApiError:
      type: object
      description: >-
        Billing error body. `code` doubles as the i18n key clients translate; `min_client_version`
        is present only on 426.
      required:
        - message
        - code
        - i18nKey
      properties:
        message:
          type: string
          example: Update the app to purchase
        code:
          type: string
          enum:
            - billing.account_unresolved
            - billing.client_update_required
            - billing.event_rejected
            - billing.processor_unavailable
            - billing.product_unavailable
            - billing.purchase_not_found
            - billing.test_adapter_unavailable
            - billing.webhook_verification_failed
          example: billing.client_update_required
        i18nKey:
          type: string
          example: billing.client_update_required
        min_client_version:
          type: string
          example: 5.2.0
    BillingStatus:
      type: object
      required:
        - is_entitled
        - in_grace_period
        - billing_customer_ref
      properties:
        tier:
          type: string
          nullable: true
          example: premium
        is_entitled:
          type: boolean
          example: true
        membership_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When access ends.
          example: "2026-11-01T00:00:00.000Z"
        in_grace_period:
          type: boolean
          description: False. Access ends at membership_expires_at.
          example: false
        billing_cadence:
          type: string
          nullable: true
          enum:
            - monthly
            - annual
          example: monthly
        billing_customer_ref:
          type: string
          description: Opaque id attached to store purchases so notifications resolve to this account.
          example: 3f0c1a8e-6d0e-4b8a-9d61-2f6b7f8e2a10
    BillingCheckoutProduct:
      type: object
      required:
        - id
        - product_code
        - cadence
        - external_product_id
      properties:
        id:
          type: integer
          format: int64
          description: Processor product id; send it back to start checkout.
          example: 3
        product_code:
          type: string
          example: premium
        cadence:
          type: string
          enum:
            - monthly
            - annual
          example: annual
        external_product_id:
          type: string
          example: P-5ML4271244454362WXNWU5NQ
        external_base_plan_id:
          type: string
          nullable: true
          example: null
    BillingCheckoutProcessor:
      type: object
      required:
