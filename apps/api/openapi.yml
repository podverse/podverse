        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /auth/me:
    get:
      operationId: apiGetAuthMe
      tags:
        - auth
      summary: GET /auth/me
      description: >
        Authenticated endpoint (cookieAuth, bearerAuth, or apiKeyAuth). Returns the signed-in
        account. A web cookie due for renewal is re-set on the response. A 401 for a cookie also
        clears the cookie. An API key needs `account` read and is the "who am I" check for a key;
        sessions skip the membership check here, but a key is refused while the membership has
        expired.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-permission:
        resource: account
        action: read
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: >
            Unauthorized — no token, an invalid or expired token, a token that names no session,
            an ended session (with `code: session_ended` and `notice` when it was ended
            elsewhere), or an invalid or expired API key (`api_key_invalid`, `api_key_expired`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
              examples:
                sessionEnded:
                  summary: Session ended from another device
                  value:
                    message: Unauthorized
                    code: session_ended
                    notice: signed_out_elsewhere
                apiKeyInvalid:
                  summary: Unknown, malformed, or revoked API key
                  value:
                    message: Invalid API key
                    code: api_key_invalid
                apiKeyExpired:
                  summary: API key past its expiry
                  value:
                    message: API key expired
                    code: api_key_expired
        "403":
          description: >
            API key only — the key lacks `account` read (`api_key_permission_denied`), or the
            account's membership has expired (`membership_expired`). Sessions are not refused here.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApiKeyAuthorizationErrorResponse"
                  - $ref: "#/components/schemas/AuthorizationErrorResponse"
              examples:
                apiKeyPermissionDenied:
                  summary: The key lacks account read
                  value:
                    message: This API key needs the read permission on account.
                    code: api_key_permission_denied
                    required_permission:
                      resource: account
                      action: read
                membershipExpired:
                  summary: The key's account membership has expired
                  value:
                    message: Your membership has expired. Renew to use this feature.
                    code: membership_expired
                    i18nKey: membership.membership_expired
                    renewPath: /membership/renew
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /auth/mobile/refresh:
    post:
      operationId: apiPostAuthMobileRefresh
      tags:
        - auth
      summary: POST /auth/mobile/refresh
      description: >
        Public endpoint. Exchanges a refresh JWT for a new access/refresh pair and rotates the
        session's refresh token. The newest refresh token and the one presented just before it
        are both accepted, so a client that lost a refresh response can retry with the token it
        still holds. Presenting any older refresh token ends the session as suspected theft.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenRefreshRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: >
            `Invalid refresh token` — an invalid or expired refresh JWT, a token that is not a
            refresh token or names no session, a missing or replaced account, a reused refresh
            token, or an ended session. Carries `code: session_ended` and `notice` when the
            session was ended elsewhere or by reuse (`security`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
              examples:
                sessionEnded:
                  summary: Refresh token reused; the session was ended
                  value:
                    message: Invalid refresh token
                    code: session_ended
                    notice: security
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /auth/mobile/revoke:
    post:
      operationId: apiPostAuthMobileRevoke
      tags:
        - auth
      summary: POST /auth/mobile/revoke
      description: >
        Public endpoint for signing out an install. Ends the session named by a validly signed
        refresh token. Always returns 200, including for a missing or invalid token, so signing
        out on the device never fails on this call.
      security: []
      requestBody:
