  /auth/api-keys:
    get:
      operationId: apiGetAuthApiKeys
      tags:
        - auth
      summary: GET /auth/api-keys
      description: >
        Lists the signed-in account's API keys, newest first, expired keys included. Works while
        the account's membership is expired. An API key cannot call this operation.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiGetAuthApiKeysResponse200"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: An API key cannot call this operation (`api_key_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyAuthorizationErrorResponse"
              example:
                message: API keys cannot be used for this endpoint.
                code: api_key_not_allowed
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
    post:
      operationId: apiPostAuthApiKeys
      tags:
        - auth
      summary: POST /auth/api-keys
      description: >
        Creates an API key for the signed-in account. The token is returned only in this
        response; store it now. An account may hold at most 20 keys, expired keys included. An
        API key cannot call this operation. Creating a key requires a membership that has not
        expired, and current terms.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiPostAuthApiKeysRequest"
            example:
              name: My agent
              permissions:
                playlists: 2
                queue: 2
              expires_in_days: 90
      responses:
        "201":
          description: API key created. The token is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPostAuthApiKeysResponse201"
              example:
                api_key:
                  id_text: apiKeyAb12cd
                  name: My agent
                  token_hint: AAAA
                  permissions:
                    account: 0
                    settings: 0
                    subscriptions: 0
                    add_by_rss: 0
                    playlists: 2
                    queue: 2
                    history: 0
                    clips: 0
                    notifications: 0
                  created_at: "2026-10-23T16:00:00.000Z"
                  expires_at: "2027-01-21T16:00:00.000Z"
                  last_used_at: null
                token: pvk_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        "400":
          description: >
            Bad request. `api_key_permissions_empty` when no supported action is set; unsupported
            bits alone do not count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              example:
                message: Grant at least one permission.
                code: api_key_permissions_empty
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: >
            Membership has expired (`membership_expired`) or terms are not accepted, or an API
            key cannot call this operation (`api_key_not_allowed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthorizationErrorResponse"
                  - $ref: "#/components/schemas/ApiKeyAuthorizationErrorResponse"
              examples:
                membershipExpired:
                  summary: The account membership has expired
                  value:
                    message: Your membership has expired. Renew to use this feature.
                    code: membership_expired
                    i18nKey: membership.membership_expired
                    renewPath: /membership/renew
                apiKeyNotAllowed:
                  summary: An API key cannot call this operation
                  value:
                    message: API keys cannot be used for this endpoint.
                    code: api_key_not_allowed
        "409":
          description: >
            The account already holds 20 keys, expired keys included; revoke one first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: This account already has the most API keys allowed. Revoke one first.
                code: api_key_limit_reached
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /auth/api-keys/{api_key_id_text}:
    delete:
      operationId: apiDeleteAuthApiKey
      tags:
        - auth
      summary: DELETE /auth/api-keys/{api_key_id_text}
      description: >
        Deletes the key at once. Its next request gets 401 `api_key_invalid`. Works while the
        account's membership is expired. An API key cannot call this operation.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
