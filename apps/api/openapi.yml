  /identity/resolve:
    post:
      operationId: apiPostIdentityResolve
      tags:
        - identity
      summary: POST /identity/resolve
      description: >
        Public lookup of show, episode, and Podcast Index ids that moved in an applied absorb.
        Ids that did not move are omitted. Each array is optional, at least one id is required,
        and each array is capped at 500.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityResolveRequest"
            examples:
              movedIds:
                summary: One show id, one episode id, and one Podcast Index id
                value:
                  channel_id_texts:
                    - old-show
                  item_id_texts:
                    - old-episode
                  podcast_index_ids:
                    - 1001
      responses:
        "200":
          description: Only the ids that moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResolveResponse"
              examples:
                moved:
                  summary: The show and episode that moved, and the old Podcast Index id
                  value:
                    channels:
                      - from_id_text: old-show
                        to_id_text: surviving-show
                    items:
                      - from_id_text: old-episode
                        to_id_text: surviving-episode
                    podcast_index_ids:
                      - from: 1001
                        to_channel_id_text: surviving-show
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
