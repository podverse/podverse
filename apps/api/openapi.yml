    post:
      operationId: apiPostAuthLogout
      tags:
        - auth
      summary: POST /auth/logout
      description: >
        Public endpoint. Ends the session named by the request's cookie or bearer token, then
        clears the auth cookie. A missing or invalid token still clears the cookie and returns 200.
      security: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
