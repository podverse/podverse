        else the platform from the X-Podverse-Client-Platform header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenRequest"
            examples:
              withDeviceLabel:
                summary: Credentials with a device label
                value:
                  email: user@example.com
                  password: mySecurePassword123
                  device_label: iPhone 16
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: Password matched an account that is not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationErrorResponse"
              example:
                message: "Account not verified."
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
