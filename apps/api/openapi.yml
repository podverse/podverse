          description: Now-playing resource after promotion, existing now-playing, or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPostQueueQueueIdTextResourcesPromoteUpcomingResponse200"
              examples:
                promoted:
                  summary: First upcoming moved to now-playing
                  value:
                    id: 42
                    list_position: "0"
                alreadyNowPlaying:
                  summary: Existing now-playing left alone
