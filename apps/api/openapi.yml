  /account/channel-seen:
    get:
      operationId: apiGetAccountChannelSeen
      tags:
        - account
      summary: GET /account/channel-seen
      description: >-
        Returns a bounded page of the authenticated account's followed channels with each channel's
        last_seen_at and unseen item count. Counts cap at 20; has_more_unseen distinguishes exactly
        20 from more than 20. A page holds 500 channels, so one request normally covers a whole
        subscription list — there is no per-channel request. Ordered by channel id, which is not the
        order any client renders, so callers match on channel_id_text rather than by position. Rate
        limited per account, shared with the add-by-RSS read.
        An API key needs subscriptions read.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-permission:
        resource: subscriptions
        action: read
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiGetAccountChannelSeenResponse200"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /account/channel-seen/add-by-rss:
    get:
      operationId: apiGetAccountChannelSeenAddByRss
      tags:
        - account
      summary: GET /account/channel-seen/add-by-rss
      description: >-
        Returns a bounded page of last_seen_at for the account's followed add-by-RSS feeds. No unseen
        count: the server stores no add-by-RSS items, so only the device holding the parsed feed can
        count them. Paginated separately from the channel list because the two lists differ in
        length. Rate limited per account, shared with the channel read.
        An API key needs subscriptions read.
      security:
