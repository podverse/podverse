      properties:
        processor_id:
          type: string
          example: paypal
        min_client_version:
          type: string
          nullable: true
          example: null
        products:
          type: array
          items:
            $ref: "#/components/schemas/BillingCheckoutProduct"
    BillingCheckoutOptions:
