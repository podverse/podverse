          type: string
          nullable: true
        description:
          type: string
          nullable: true
        sharable_status_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        item:
          description: Null when the clip's episode was removed from Podverse.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Item"
