  /account/channel-seen/mark:
    post:
      operationId: apiPostAccountChannelSeenMark
      tags:
        - account
      summary: POST /account/channel-seen/mark
      description: >-
        Marks channels seen. Omit last_seen_at to record now, which is the ordinary case of opening a
        channel; supply it to replay a moment a device already recorded, as the sign-in merge does.
        Stored timestamps only move forward, so replaying an older value is a no-op.
        An API key needs subscriptions update.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-permission:
        resource: subscriptions
        action: update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entries
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required:
                      - channel_id_text
                    properties:
                      channel_id_text:
                        type: string
                      last_seen_at:
                        type: string
                        format: date-time
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPostAccountChannelSeenMarkResponse200"
