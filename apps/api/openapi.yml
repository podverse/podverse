              properties:
                unread_count:
                  type: integer
    ApiGetAccountNotificationsUnreadCountResponse200:
      type: object
      properties:
        data:
          type: object
          required:
            - unread_count
          properties:
            unread_count:
              type: integer
    ApiPostAccountNotificationsMarkReadResponse200:
      type: object
      properties:
        data:
          type: object
          required:
            - last_read_at
          properties:
            last_read_at:
              type: string
              format: date-time
    ApiPostAccountNotificationsMarkReadOneResponse200:
      type: object
      properties:
        data:
          type: object
          required:
            - marked_ids
