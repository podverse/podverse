  /health/ready:
    get:
      operationId: apiGetHealthReady
      tags:
        - meta
      summary: GET /health/ready
      description: Readiness. 200 when the database and the key-value store answer. 503 when either does not.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiGetHealthReadyResponse"
              example:
                status: ok
                message: Ready
        "503":
          description: >-
            The database or the key-value store did not answer. `message` is `Database not
            reachable` or `KeyValDB not reachable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiGetHealthReadyResponse"
              examples:
                databaseNotReachable:
                  value:
                    status: unavailable
                    message: Database not reachable
                keyValDbNotReachable:
                  value:
                    status: unavailable
                    message: KeyValDB not reachable
