      properties:
        id:
          type: integer
        item_id:
          type: integer
        value:
          type: string
          description: Omitted in item list responses and present on item detail and this endpoint.
        preview:
          type: string
          nullable: true
        is_truncated:
          type: boolean
        source_length:
          type: integer
          nullable: true
