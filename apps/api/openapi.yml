          marked_ids:
            - 101
          unread_count: 3
    ApiPostAccountNotificationsMarkReadByItemRequest:
      type: object
      required:
        - item_id_text
        - type
      properties:
        item_id_text:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          minLength: 1
          maxLength: 64
      example:
        item_id_text: abcdefghi1
        type: livestream-started
    ApiAccountNotificationStreamState:
      type: object
      description: >-
        Data of `notification.state`, the first event on every connection and again after the
        server recovers its own event feed. Clients set the badge from it.
      required:
        - unread_count
        - last_read_at
      properties:
        unread_count:
          type: integer
          minimum: 0
        last_read_at:
          type: string
          format: date-time
          nullable: true
          description: The account's Mark All as Read cutoff, or null if never set.
    ApiAccountNotificationStreamCreated:
      type: object
      description: Data of `notification.created`. The event's SSE `id:` equals `notification.id`.
      required:
        - notification
        - unread_count
      properties:
        notification:
          $ref: "#/components/schemas/AccountNotificationItem"
        unread_count:
          type: integer
          minimum: 0
    ApiAccountNotificationStreamRead:
      type: object
      description: >-
        Data of `notification.read`. `scope: all` means Mark All as Read moved the cutoff and
        carries `last_read_at`; `scope: one` means one notification was read and carries
        `notification_id`.
      required:
        - scope
        - unread_count
      properties:
        scope:
          type: string
          enum:
            - all
            - one
        last_read_at:
          type: string
          format: date-time
          description: Present when `scope` is `all`.
        notification_id:
          type: integer
          minimum: 1
          description: Present when `scope` is `one`.
        unread_count:
          type: integer
          minimum: 0
    ApiAccountNotificationStreamResync:
      type: object
      description: >-
        Data of `notification.resync`. Replay could not cover the gap; clients refetch the inbox
        list and take the badge from `notification.state`.
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - replay_limit
    ApiAccountSessionStreamEnded:
      type: object
      description: >-
        Data of `session.ended`, the last event on a stream whose session was ended. Sent with no
        SSE `id:`, so it never replays. A null `notice` means the device signed itself out and the
        client reconnects as usual; with a notice the client stops reconnecting and signs out with
        that reason.
      required:
        - notice
      properties:
        notice:
          type: string
          nullable: true
          enum:
            - signed_out_elsewhere
            - password_changed
            - admin_force_logout
            - security
    ApiPlaybackResourceRef:
      description: >-
        The resource a device plays, by kind. Ids are non-empty and at most 500 characters.
      oneOf:
        - type: object
          required:
            - kind
            - item_id_text
          properties:
            kind:
              type: string
              enum:
                - item
            item_id_text:
              type: string
              minLength: 1
              maxLength: 500
        - type: object
          required:
            - kind
            - clip_id_text
          properties:
            kind:
              type: string
              enum:
                - clip
            clip_id_text:
              type: string
              minLength: 1
              maxLength: 500
        - type: object
          required:
            - kind
            - item_soundbite_id_text
          properties:
            kind:
              type: string
              enum:
                - soundbite
            item_soundbite_id_text:
              type: string
              minLength: 1
              maxLength: 500
        - type: object
          required:
            - kind
            - add_by_rss_hash_id
          properties:
            kind:
              type: string
              enum:
                - add_by_rss
            add_by_rss_hash_id:
              type: string
              minLength: 1
              maxLength: 500
      example:
        kind: item
        item_id_text: abcdefghi1
    ApiPlaybackResourceSummary:
      type: object
      description: The resource the playing device has loaded, with what other devices display.
      required:
        - ref
        - medium
        - title
        - channel_title
        - image_url
      properties:
        ref:
          $ref: "#/components/schemas/ApiPlaybackResourceRef"
        medium:
          type: integer
          description: >-
            The resource's channel medium id, the same values as a channel's `medium_id`. An id
            the API does not know is a 400.
          example: 1
        title:
          type: string
          nullable: true
          maxLength: 500
        channel_title:
          type: string
          nullable: true
          maxLength: 500
        image_url:
          type: string
          nullable: true
          maxLength: 2048
    ApiPlaybackState:
      type: object
      description: >-
        The account's playback state, written by the playing device. `revision` only grows;
        clients ignore a state whose revision is not newer than the one they hold. A live item has
        null `position_seconds` and `duration_seconds` and rate 1. With no resource, `status` is
        `paused` and `position_seconds` is null.
      required:
        - revision
        - active_session_id_text
        - resource
        - status
        - is_live
        - position_seconds
        - duration_seconds
        - rate
        - updated_at_ms
        - sent_at_ms
      properties:
        revision:
          type: integer
          minimum: 0
        active_session_id_text:
          type: string
          nullable: true
          description: The session of the playing device; null when no device is active.
        resource:
          allOf:
            - $ref: "#/components/schemas/ApiPlaybackResourceSummary"
          nullable: true
        status:
          type: string
          enum:
            - playing
            - paused
            - loading
        is_live:
          type: boolean
        position_seconds:
          type: number
          minimum: 0
          nullable: true
        duration_seconds:
          type: number
          minimum: 0
          nullable: true
        rate:
          type: number
          minimum: 0.5
          maximum: 3
        updated_at_ms:
          type: integer
          minimum: 0
          description: Server clock (epoch ms) when this position was accepted.
        sent_at_ms:
          type: integer
          minimum: 0
          description: Server clock (epoch ms) when this copy was written to the response or stream.
      example:
        revision: 1793944800000
        active_session_id_text: s1abcdefgh
        resource:
          ref:
            kind: item
            item_id_text: abcdefghi1
          medium: 1
          title: Episode One
          channel_title: The Show
          image_url: null
        status: playing
        is_live: false
        position_seconds: 120.5
        duration_seconds: 3600
        rate: 1
        updated_at_ms: 1793944800000
        sent_at_ms: 1793944800000
    ApiPlaybackDevice:
      type: object
      description: A connected device. Each device is one login session.
      required:
        - session_id_text
        - client_type
        - device_label
        - session_created_at
      properties:
        session_id_text:
          type: string
        client_type:
          type: string
          enum:
            - web
            - mobile
        device_label:
          type: string
          nullable: true
        session_created_at:
          type: string
          format: date-time
          description: Clients sort by it and use it to tell same-label devices apart.
    ApiPlaybackDevices:
      type: object
      description: >-
        The devices checked in now. `revision` only grows; clients ignore a list whose revision is
        not newer than the one they hold.
      required:
        - revision
        - devices
      properties:
        revision:
          type: integer
          minimum: 0
        devices:
          type: array
          items:
            $ref: "#/components/schemas/ApiPlaybackDevice"
    ApiPlaybackSnapshot:
      type: object
      description: >-
        Data of `playback.snapshot`: the devices and the state at once. It replaces the client's
        playback view.
      required:
        - devices
        - state
      properties:
        devices:
          $ref: "#/components/schemas/ApiPlaybackDevices"
        state:
          allOf:
            - $ref: "#/components/schemas/ApiPlaybackState"
          nullable: true
    ApiPlaybackCommandPlay:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - play
    ApiPlaybackCommandPause:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - pause
    ApiPlaybackCommandSeek:
      type: object
      description: >-
        An absolute position. A skip is a seek the sender computes, so two devices skipping at once
        land on the same spot. Not allowed for a live item.
      required:
        - type
        - position_seconds
      properties:
        type:
          type: string
          enum:
            - seek
        position_seconds:
          type: number
          minimum: 0
    ApiPlaybackCommandSetRate:
      type: object
      description: Not allowed for a live item.
      required:
        - type
        - rate
      properties:
        type:
          type: string
          enum:
            - set_rate
        rate:
          type: number
          minimum: 0.5
          maximum: 3
    ApiPlaybackCommandNext:
      type: object
      description: >-
        The playing device runs its own Next button on its own queue. The server never edits a
        queue for it.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - next
    ApiPlaybackCommandPrevious:
      type: object
      description: >-
        The playing device runs its own Previous button on its own queue. The server never edits a
        queue for it.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - previous
    ApiPlaybackCommandPlayItem:
      type: object
      description: >-
        The playing device plays this resource through its normal play path, which writes
        now-playing through the queue routes.
      required:
        - type
        - resource
        - add_by_rss_resource_data
        - start_seconds
      properties:
        type:
          type: string
          enum:
            - play_item
        resource:
          $ref: "#/components/schemas/ApiPlaybackResourceRef"
        add_by_rss_resource_data:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Required when `resource.kind` is `add_by_rss`, null for every other kind. Its shape is
            validated where the playing device uses it.
        start_seconds:
          type: number
          minimum: 0
          nullable: true
          description: Null resumes the saved position, or the live point for a live item.
    ApiPlaybackCommandTakeOver:
      type: object
      description: >-
        Moves playback to the target device. Carries no item; the server attaches the stored
        state to the envelope.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - take_over
    ApiPlaybackCommand:
      description: >-
        A command names the target state, never a toggle, so two devices pressing at once cannot
        cancel each other.
      oneOf:
        - $ref: "#/components/schemas/ApiPlaybackCommandPlay"
        - $ref: "#/components/schemas/ApiPlaybackCommandPause"
        - $ref: "#/components/schemas/ApiPlaybackCommandSeek"
        - $ref: "#/components/schemas/ApiPlaybackCommandSetRate"
        - $ref: "#/components/schemas/ApiPlaybackCommandNext"
        - $ref: "#/components/schemas/ApiPlaybackCommandPrevious"
        - $ref: "#/components/schemas/ApiPlaybackCommandPlayItem"
        - $ref: "#/components/schemas/ApiPlaybackCommandTakeOver"
      discriminator:
        propertyName: type
        mapping:
          play: "#/components/schemas/ApiPlaybackCommandPlay"
          pause: "#/components/schemas/ApiPlaybackCommandPause"
          seek: "#/components/schemas/ApiPlaybackCommandSeek"
          set_rate: "#/components/schemas/ApiPlaybackCommandSetRate"
          next: "#/components/schemas/ApiPlaybackCommandNext"
          previous: "#/components/schemas/ApiPlaybackCommandPrevious"
          play_item: "#/components/schemas/ApiPlaybackCommandPlayItem"
          take_over: "#/components/schemas/ApiPlaybackCommandTakeOver"
    ApiPlaybackCommandEnvelope:
      type: object
      description: >-
        Data of `playback.command`, sent only to the target device's streams. Clients drop it once
        `expires_at_ms` has passed.
      required:
        - command_id
        - sender_session_id_text
        - target_session_id_text
        - issued_at_ms
        - expires_at_ms
        - command
        - state
      properties:
        command_id:
          type: string
          format: uuid
        sender_session_id_text:
          type: string
        target_session_id_text:
          type: string
        issued_at_ms:
          type: integer
          minimum: 0
        expires_at_ms:
          type: integer
          minimum: 0
          description: Five seconds after `issued_at_ms`.
        command:
          $ref: "#/components/schemas/ApiPlaybackCommand"
        state:
          allOf:
            - $ref: "#/components/schemas/ApiPlaybackState"
          nullable: true
          description: The stored state for `take_over`; null for every other command.
    ApiPlaybackStartFailed:
      type: object
      description: >-
        Data of `playback.start_failed`, sent only to the sender's streams: the target could not
        start audio for that command.
      required:
        - command_id
        - sender_session_id_text
        - target_session_id_text
        - reason
      properties:
        command_id:
          type: string
          format: uuid
        sender_session_id_text:
          type: string
        target_session_id_text:
          type: string
        reason:
          $ref: "#/components/schemas/ApiPlaybackStartFailedReason"
    ApiPlaybackStartFailedReason:
      type: string
      description: >-
        `autoplay_blocked`: the target needs a tap before it can play and shows a tap-to-play
        prompt. `load_failed`: the media did not load.
      enum:
        - autoplay_blocked
        - load_failed
    ApiPlaybackErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code:
              type: string
              enum:
                - playback_not_active_device
                - playback_no_active_device
                - playback_device_not_connected
                - playback_target_already_active
                - playback_nothing_to_transfer
                - playback_command_not_allowed_for_live
                - playback_take_over_self
                - playback_unavailable
            active_session_id_text:
              type: string
              nullable: true
              description: >-
                Present on `playback_not_active_device`: the device that is active now, or null
                when none is.
    ApiPostAccountPlaybackPresenceResponse200:
      allOf:
        - $ref: "#/components/schemas/ApiPlaybackSnapshot"
        - type: object
          required:
            - session_id_text
          properties:
            session_id_text:
              type: string
              description: This device's session id.
      description: >-
        Devices and state apply by revision, not as a replacing snapshot: the response can be
        older than an event the stream already delivered.
    ApiPostAccountPlaybackStateRequest:
      type: object
      required:
        - claim
        - resource
        - status
        - is_live
        - position_seconds
        - duration_seconds
        - rate
      properties:
        claim:
          type: boolean
          description: >-
            True makes the caller the active device (it started playing locally or took over).
            The last claim wins.
        resource:
          allOf:
            - $ref: "#/components/schemas/ApiPlaybackResourceSummary"
          nullable: true
          description: Null with `claim` false releases the active device.
        status:
          type: string
          enum:
            - playing
            - paused
            - loading
          description: Must be `paused` when `resource` is null.
        is_live:
          type: boolean
        position_seconds:
          type: number
          minimum: 0
          nullable: true
          description: Must be null for a live item or when `resource` is null.
        duration_seconds:
          type: number
          minimum: 0
          nullable: true
          description: Must be null for a live item.
        rate:
          type: number
          minimum: 0.5
          maximum: 3
          description: Must be 1 for a live item.
      example:
        claim: true
        resource:
          ref:
            kind: item
            item_id_text: abcdefghi1
          medium: 1
          title: Episode One
          channel_title: The Show
          image_url: null
        status: playing
        is_live: false
        position_seconds: 120.5
        duration_seconds: 3600
        rate: 1
