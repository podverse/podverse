  /auth/login:
    post:
      operationId: apiPostAuthLogin
      tags:
        - auth
      summary: POST /auth/login
      description: >
        Public endpoint. Checks the credentials, starts a web session, and sets the `jwt` cookie
        (cookieAuth). When the browser already carries a session cookie, that earlier session is
        ended first, so one browser holds one session. The JSON includes `token` only when
        AUTH_ALLOW_TOKEN_IN_RESPONSE_BODY is true and the request sets includeTokenInResponseBody.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
            examples:
              emailLogin:
                summary: Email/password login request
                value:
                  email: user@example.com
                  password: mySecurePassword123
                  includeTokenInResponseBody: true
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
              examples:
                loginSuccess:
                  summary: Successful login response with JWT
                  value:
                    message: Authenticated successfully
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
              examples:
                invalidCredentials:
                  summary: Invalid email/password
                  value:
                    message: Unauthorized
                    code: unauthorized
                    details:
                      - field: email
                        message: Invalid email or password
                        code: invalid_credentials
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
