    RemoteChannelStub:
      description: >-
        Minimal placeholder for a remote feed the index provider knows but Podverse has not
        parsed. Open the provider search detail for the feed.
      type: object
      required:
        - is_remote_stub
        - index_provider
        - provider_feed_id
        - feed_guid
        - feed_url
        - title
        - author
        - image_url
        - medium_id
      properties:
        is_remote_stub:
          type: boolean
          enum:
            - true
        index_provider:
          type: string
          enum:
            - podcast_index
        provider_feed_id:
          type: string
        feed_guid:
          type: string
          format: uuid
          nullable: true
        feed_url:
          type: string
        title:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        medium_id:
          type: integer
          nullable: true
    RemoteItemStub:
      description: >-
        Minimal placeholder for a remote item whose feed is known by the index provider but not
        parsed by Podverse. Open the provider search detail for the channel in `channel_stub`.
      type: object
      required:
        - is_remote_stub
        - item_guid
        - provider_item_id
        - title
        - image_url
        - pub_date
        - duration_seconds
        - channel_stub
      properties:
        is_remote_stub:
          type: boolean
          enum:
            - true
        item_guid:
          type: string
        provider_item_id:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        pub_date:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        channel_stub:
          allOf:
            - $ref: "#/components/schemas/RemoteChannelStub"
    RemoteItemsResultResponse:
      description: >-
        Parsed channels and items stay in feed order. References with neither a parsed row nor a
        stored stub are left out.
      type: object
      properties:
        channelsAdded:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        channelsUnadded:
          type: array
          items:
            $ref: "#/components/schemas/RemoteChannelStub"
        itemsAdded:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        itemsUnadded:
          type: array
          items:
            $ref: "#/components/schemas/RemoteItemStub"
    PublisherFeedRemoteItemsResponse:
      description: >-
        channelsAdded lists albums verified to this publisher (both feeds reference each other),
        in the publisher feed's order. channelsUnadded lists albums the publisher feed lists that
        Podverse has not parsed, as remote stubs. References with no stub are left out. itemsAdded
        lists tracks on the verified albums, plus tracks credited to this publisher alone, newest
        first. itemsUnadded is always empty. Item references in a publisher feed are not shown;
        nothing can verify them.
      allOf:
        - $ref: "#/components/schemas/RemoteItemsResultResponse"
        - type: object
          properties:
            channel:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/Channel"
    PlaylistCreateRequest:
      type: object
      properties:
        title:
          type: string
      additionalProperties: true
