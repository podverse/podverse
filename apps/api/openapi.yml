  /stats/listen:
    post:
      operationId: apiPostStatsListen
      tags:
        - stats
      summary: POST /stats/listen
      description: >-
        Records one report of a listening session for the Taste Profile and, for paid premium,
        public popularity counts. A valid trial with current Taste Profile consent stores the
        listen for the Taste Profile only. Popularity counts require paid premium with the
        trackStats capability. Rate limited per account (one budget shared with POST /stats/open).
        The first report of a session stores one listen event, up to the listener's daily cap.
        Only the first listens of a day, up to a lower cap, count toward popularity; the rest feed
        only the Taste Profile. Later reports with the same client_listen_id keep the larger seconds_heard and a sticky completed and
        never count the session twice. A new session that arrives within the server's minimum
        interval of the listener's last stored listen is not stored and answers too_soon. For a
        server-set number of days after the account turns Taste Profile off, new listens are
        stored for the Taste Profile only and still answer counted. The server's receive time
        dates the listen for daily totals and Taste Profile score decay. Authenticated endpoint
        (cookieAuth or bearerAuth).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsListenRequest"
      responses:
        "201":
          description: A new listening session was stored (result counted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsListenResponse"
        "200":
          description: >-
            The report was accepted without storing a new session: updated, unchanged,
            daily_cap_reached, or too_soon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsListenResponse"
              example:
                result: daily_cap_reached
        "400":
          description: >-
            Validation failed, or the listen does not meet the counted-listen rule (code
            listen_below_threshold)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: >-
            Terms not accepted, membership expired, a premium account without the trackStats
            capability (feature_not_available_for_account_type), or Taste Profile consent not
            current (taste_profile_consent_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationErrorResponse"
        "404":
          description: The item or clip was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "410":
          description: The clip's episode was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipSourceRemovedResponse"
        "429":
          description: Too many requests for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /stats/open:
    post:
      operationId: apiPostStatsOpen
      tags:
        - stats
      summary: POST /stats/open
      description: >-
        Records a profile or playlist open for public popularity counts. Counts once per opener,
        profile or playlist, and UTC day, never for the opener's own profile or playlist, and at
        most a daily number of counted opens per opener, profiles and playlists together, and
        never feeds the Taste Profile. Requires paid premium with the trackStats capability and
        current Taste Profile consent. A trial is rejected even when trackStats is on. Rate
        limited per account (one budget shared with POST /stats/listen). For a server-set number
        of days after the account turns
        Taste Profile off, opens are not recorded and still answer counted. Authenticated endpoint
        (cookieAuth or bearerAuth).
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsOpenRequest"
      responses:
        "201":
          description: The first open of that profile or playlist by this listener today (result counted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOpenResponse"
        "200":
          description: >-
            Already opened today (unchanged), the opener's own profile or playlist
            (own_content), or the opener's daily cap reached (daily_cap_reached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOpenResponse"
              example:
                result: unchanged
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: >-
            Terms not accepted, membership expired, no paid premium with the trackStats
            capability (feature_not_available_for_account_type), or Taste Profile consent not
            current (taste_profile_consent_required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationErrorResponse"
        "404":
          description: The profile or playlist was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "429":
          description: Too many requests for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
