          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
        settings:
          type: integer
          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
        subscriptions:
          type: integer
          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
        add_by_rss:
          type: integer
          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
        playlists:
          type: integer
          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
        queue:
          type: integer
          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
        history:
          type: integer
          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
        clips:
          type: integer
          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
        notifications:
          type: integer
          minimum: 0
          maximum: 15
          description: "CRUD mask. create 1, read 2, update 4, delete 8."
    AccountApiKey:
      type: object
      required:
        - id_text
        - name
        - token_hint
        - permissions
        - created_at
        - expires_at
        - last_used_at
      properties:
        id_text:
          type: string
        name:
          type: string
          maxLength: 50
        token_hint:
          type: string
          description: Last four characters of the token.
        permissions:
          $ref: "#/components/schemas/AccountApiKeyPermissions"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the key does not expire.
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Last accepted request, kept to within five minutes. Null until first use.
    ApiGetAuthApiKeysResponse200:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          description: The account's keys, newest first, expired keys included.
          items:
            $ref: "#/components/schemas/AccountApiKey"
    ApiPostAuthApiKeysRequest:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: My agent
        permissions:
          $ref: "#/components/schemas/AccountApiKeyPermissions"
        expires_in_days:
          type: integer
          nullable: true
          default: 90
          description: >
            Days until the key expires. 30, 90, or 365. Null means the key does not expire.
            Omitted means 90.
          enum:
            - 30
            - 90
            - 365
    ApiPostAuthApiKeysResponse201:
      type: object
      required:
        - api_key
        - token
      properties:
        api_key:
          $ref: "#/components/schemas/AccountApiKey"
        token:
          type: string
          description: The API key. Returned only in this response.
          pattern: "^pvk_[A-Za-z0-9_-]{43}$"
          example: pvk_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    ApiGetAccountContentLogResponse200:
      type: object
      required:
        - rows
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AccountContentLog"
    ApiGetAccountNotificationsResponse200:
