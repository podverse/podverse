      type: object
      required:
        - item_id_text
        - value
        - preview
        - is_truncated
        - source_length
        - link_url
      properties:
        item_id_text:
          type: string
        value:
          type: string
          nullable: true
          description: Sanitized show notes HTML, null when the item has none.
        preview:
          type: string
          nullable: true
          description: Plain-text preview of the notes.
        is_truncated:
          type: boolean
          description: True when the stored notes were shortened to the feed's description tier.
        source_length:
          type: integer
          nullable: true
          description: Visible length of the feed's notes before shortening, when known.
        link_url:
          type: string
          nullable: true
          description: The item's link, where the full notes live when is_truncated is true.
