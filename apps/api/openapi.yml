        add_by_rss_hash_id:
          type: string
        add_by_rss_resource_data:
          type: object
          additionalProperties: true
          description: >-
            When present, the API computes add_by_rss_hash_id from this payload; see
            QueueResourceAddByRssQueueWriteRequest.
        playback_event_kind:
          type: string
          enum:
            - play
            - pause
            - seek
            - progress_tick
            - complete
            - skip
            - sleep_timer_stop
            - queue_add
            - queue_remove
            - queue_reorder
        last_played_at:
          type: string
          format: date-time
        playback_position:
          type: number
          minimum: 0
        media_file_duration:
          type: number
          minimum: 0
        completed:
          type: boolean
      oneOf:
        - required:
            - item_id_text
        - required:
            - clip_id_text
        - required:
