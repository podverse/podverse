          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: API key revoked
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: An API key cannot call this operation (`api_key_not_allowed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyAuthorizationErrorResponse"
              example:
                message: API keys cannot be used for this endpoint.
                code: api_key_not_allowed
        "404":
          description: No API key with that id on this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
  /billing/checkout-options:
    get:
      operationId: apiGetBillingCheckoutOptions
      tags:
