          type: string
          enum:
            - processed
            - duplicate
            - ignored_sandbox
            - failed
          example: processed
        error_code:
          type: string
          nullable: true
          example: null
    BillingPurchaseResult:
      type: object
      required:
        - confirmed
        - outcomes
        - status
      properties:
        confirmed:
          type: boolean
          description: >-
            Every event was recorded, so the client may finish the store transaction. When false,
