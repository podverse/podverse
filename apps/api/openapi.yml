          type: integer
          format: int64
          example: 42
        bolt11:
          type: string
          example: lnbc30n1pexample
        amount:
          type: string
          example: "3.00"
        currency_code:
          type: string
          example: USD
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - unpaid
            - pending
            - settled
            - expired
    BillingStrikeCheckoutSettlement:
      type: object
      description: Present when state is settled. Same purchase fields PayPal capture returns.
      properties:
        confirmed:
          type: boolean
          example: true
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BillingEventOutcome"
        status:
          $ref: "#/components/schemas/BillingStatus"
    BillingAppleTransactionRequest:
      type: object
      required:
        - transaction_id
      properties:
        transaction_id:
          type: string
          example: "2000000456789012"
        product_id:
          type: string
          example: fm.podverse.premium.monthly
        signed_transaction:
          type: string
          maxLength: 16384
          description: >-
            The StoreKit JWS for the transaction. Read only when the API runs with
            APPLE_IAP_ENVIRONMENT=xcode, which is refused in production; every other mode looks the
            transaction up with Apple.
    BillingGooglePurchaseRequest:
      type: object
      required:
        - purchase_token
        - product_id
        - order_id
      properties:
        purchase_token:
          type: string
          example: opaque-token-up-to-1024-chars
        product_id:
          type: string
          example: podverse_premium
        order_id:
          type: string
          description: Google Play order id. The purchase token stays in purchase_token.
          example: GPA.1234-5678-9012-34567
    BillingRestoreRequest:
      type: object
      required:
        - processor
        - purchases
      properties:
        processor:
          type: string
          enum:
            - apple
            - google_play
          example: apple
        purchases:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required:
              - external_id
            properties:
              external_id:
                type: string
                description: Apple transaction id or Google Play purchase token.
              external_product_id:
                type: string
                nullable: true
              external_transaction_id:
                type: string
                nullable: true
                description: Google Play order id. Apple ignores it.
              signed_transaction:
                type: string
                nullable: true
                maxLength: 16384
                description: >-
                  The StoreKit JWS for an Apple purchase. Read only with
                  APPLE_IAP_ENVIRONMENT=xcode.
    BillingSimulateRequest:
      type: object
      required:
        - event
      properties:
        event:
          type: object
          description: >-
            A normalized billing event without its processor. The account is always the caller;
            the event id, time, and sandbox flag are optional.
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - payment_settled
                - refund_or_revoke
          additionalProperties: true
    BillingSimulationResult:
      type: object
      required:
        - outcome
        - status
      properties:
        outcome:
          $ref: "#/components/schemas/BillingEventOutcome"
