    ApiPostAccountAddByRssParseRequest:
      type: object
      description: >-
        Request payload for POST /account/add-by-rss/parse. Credentials are never stored: the API
        seals them into a short-lived envelope for the parse worker. `user:pass@` userinfo on
        `feed_url` is split off and treated as the credentials when the body omits them.
      required:
        - feed_url
      properties:
        feed_url:
          type: string
          format: uri
        feed_hash:
          type: string
        etag:
          type: string
        last_modified:
          type: string
        basic_auth_username:
          type: string
          minLength: 1
          maxLength: 255
          description: Send together with basic_auth_password, or omit both.
        basic_auth_password:
          type: string
          minLength: 1
          maxLength: 255
          description: Send together with basic_auth_username, or omit both.
    ApiPostAccountAddByRssParseResponse200:
      type: object
      description: Operation-specific response payload for POST /account/add-by-rss/parse (200).
      additionalProperties: true
    ApiPostAccountAddByRssParseAllRequest:
      type: object
      description: >-
        Request payload for POST /account/add-by-rss/parse/all. A followed feed flagged
        `requires_credentials` with no entry in `credentials_by_url` is not queued; its request id
        resolves immediately to `failed` with `failureReason: credentials_required`.
      properties:
        feed_hashes_by_url:
          type: object
          additionalProperties:
            type: string
        etags_by_url:
          type: object
          additionalProperties:
            type: string
        last_modified_by_url:
          type: object
          additionalProperties:
            type: string
        credentials_by_url:
          type: object
          description: Feed URL to device-held Basic Auth credentials.
          additionalProperties:
            type: object
            required:
              - username
              - password
            properties:
              username:
                type: string
                minLength: 1
                maxLength: 255
              password:
                type: string
                minLength: 1
                maxLength: 255
    ApiPostAccountAddByRssParseAllResponse200:
      type: object
      description: Operation-specific response payload for POST /account/add-by-rss/parse/all (200).
      additionalProperties: true
    ApiGetAccountAddByRssParseStatusRequestIdResponse200:
      type: object
      description: >-
        Response payload for GET /account/add-by-rss/parse/status/{request_id} (200). Never
        contains credentials; failed entries carry machine-readable auth metadata.
      additionalProperties: true
      properties:
        status:
          type: string
          enum: [queued, processing, parsed, not_modified, failed]
        failureReason:
          type: string
          enum:
            - credentials_required
            - credentials_rejected
            - credentials_withheld_other_domain
            - credentials_withheld_insecure
            - credentials_envelope_invalid
            - http_error
            - network
            - parse
        httpStatus:
          type: integer
        authChallenge:
          type: string
          enum: [basic, other, none]
        credentialsState:
          type: string
          enum: [sent, not_provided, withheld_other_domain, withheld_insecure, decrypt_failed]
        publisherRequestId:
          type: string
          description: >-
            Set on the entry of a feed parsed because a publisher feed listed it: that publisher
            parse's request id.
        publisherListedFeeds:
          type: array
          description: >-
            On a parsed entry for an artist (publisher) feed: the feeds it lists, in feed order.
            `directory` rows are already in the Podverse directory and were not fetched;
            `add_by_rss` rows were parsed for this member, poll their `requestId`; `unresolved`
            rows were neither. Absent when the feed lists nothing by type or the list could not
            be resolved.
          items:
            type: object
            required:
              - kind
              - feedGuid
              - feedUrl
              - title
              - listedAtChannelLevel
              - itemGuids
            properties:
              kind:
                type: string
                enum: [directory, add_by_rss, unresolved]
              feedGuid:
                type: string
              feedUrl:
                type: string
                nullable: true
              title:
                type: string
                nullable: true
              listedAtChannelLevel:
                type: boolean
              itemGuids:
                type: array
                items:
                  type: string
              channelIdText:
                type: string
                description: directory rows
              channelTitle:
                type: string
                nullable: true
                description: directory rows
              mediumId:
                type: integer
                nullable: true
                description: directory rows
              requestId:
                type: string
                description: add_by_rss rows
              reason:
                type: string
                enum: [no_feed_url, item_references_only]
                description: unresolved rows
