                    - id: free
                      label: Free
                    - id: premium
                      label: Premium
                  features:
                    - id: subscribe
                      name: Subscribe to Podcasts *
                      free: true
                      premium: true
                      comingSoon: false
                  legends:
                    - mark: "*"
                      text: Free tier is available on the mobile app only. Premium includes the website.
