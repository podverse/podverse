  /account/playback/presence:
    post:
      operationId: apiPostAccountPlaybackPresence
      tags:
        - account
      summary: POST /account/playback/presence
      description: >-
        Checks this device in for cross-device playback. A device is a login session; it stays in
        the device list for 40 seconds after its last check-in or state publish, so a device with
        an open account event stream checks in every 15 seconds. Returns this device's session id,
        the connected devices, and the current playback state, so a device has everything it needs
        on start without waiting for the stream. Publishes `playback.devices` when this device
        joined or others expired. Requires a valid membership. API keys cannot call this route.
        All playback routes share one limit of 240 requests per minute per account.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPostAccountPlaybackPresenceResponse200"
              example:
                session_id_text: s1abcdefgh
                devices:
                  revision: 1793944800000
                  devices:
                    - session_id_text: s1abcdefgh
                      client_type: web
                      device_label: Chrome · macOS
                      session_created_at: "2026-10-20T00:00:00.000Z"
                state: null
        "401":
          description: Unauthorized, or the request names no login session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: >-
            Membership has expired (`membership_expired`), terms are not accepted, or an API key
            made the request (`api_key_not_allowed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthorizationErrorResponse"
                  - $ref: "#/components/schemas/TermsAcceptanceRequiredErrorResponse"
                  - $ref: "#/components/schemas/ApiKeyAuthorizationErrorResponse"
              examples:
                membershipExpired:
                  summary: The account membership has expired
                  value:
                    message: Your membership has expired. Renew to use this feature.
                    code: membership_expired
                    i18nKey: membership.membership_expired
                    renewPath: /membership/renew
        "429":
          description: Too many playback requests for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
        "503":
          description: The playback store is unreachable (`playback_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlaybackErrorResponse"
              example:
                message: Playback is unavailable.
                code: playback_unavailable
  /account/playback/state:
    post:
      operationId: apiPostAccountPlaybackState
      tags:
        - account
      summary: POST /account/playback/state
      description: >-
        The playing device publishes its item (with the item's channel medium id), status,
        position, duration, and rate, or claims the active slot with `claim: true`. One device per
        account is active; the last claim wins and is never refused because another device is
        active. A publish is also a check-in. A publish that shows nothing new (same item and
        status, position within 2 seconds of the stored position moved forward to now) returns
        the stored revision and publishes nothing; any other write publishes `playback.state`. A
        publish with `resource: null` and `claim: false` releases the active slot. Requires a valid
        membership. API keys cannot call this route.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiPostAccountPlaybackStateRequest"
      responses:
        "200":
          description: Written, or unchanged; either way the current revision and active device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPostAccountPlaybackStateResponse200"
              example:
                revision: 1793944800000
                active_session_id_text: s1abcdefgh
        "400":
          description: >-
            Bad request, including a resource with no `medium`, a `medium` that is not an integer,
            or an id the API does not know.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized, or the request names no login session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: >-
            Membership has expired (`membership_expired`), terms are not accepted, or an API key
            made the request (`api_key_not_allowed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthorizationErrorResponse"
                  - $ref: "#/components/schemas/TermsAcceptanceRequiredErrorResponse"
                  - $ref: "#/components/schemas/ApiKeyAuthorizationErrorResponse"
        "409":
          description: >-
            `playback_not_active_device`: a publish without a claim from a device that is not
            active, or a claim that lost three revision races in a row. `active_session_id_text`
            names the active device (another device took over), or is null (claim again).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlaybackErrorResponse"
              example:
                message: This device is not the active playback device.
                code: playback_not_active_device
                active_session_id_text: s2abcdefgh
        "429":
          description: Too many playback requests for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
        "503":
          description: The playback store is unreachable (`playback_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlaybackErrorResponse"
  /account/playback/commands:
    post:
      operationId: apiPostAccountPlaybackCommand
      tags:
        - account
      summary: POST /account/playback/commands
      description: >-
        Sends one command to a device through its account event stream as `playback.command`.
        `take_over` goes to `target_session_id_text` and carries the stored state; every other
        command goes to the active device, which may be this session (browser tabs share one).
        Commands expire 5 seconds after they are issued, are never stored for later delivery,
        and are never retried; a target whose stream is not open at that moment never sees one.
        The sender sees the outcome in the next `playback.state`. `next` and `previous` make the
        playing device run its own Next or Previous button on its own queue; the server never
        reads or edits a queue for any command. Requires a valid membership. API keys cannot call
        this route.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiPostAccountPlaybackCommandRequest"
            examples:
              pause:
                summary: Pause the playing device
                value:
                  command:
                    type: pause
              next:
                summary: Skip to the next item on the playing device
                value:
                  command:
                    type: next
              takeOver:
                summary: Move playback to another device
                value:
                  target_session_id_text: s2abcdefgh
                  command:
                    type: take_over
      responses:
        "202":
          description: Relayed to the target device's streams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPostAccountPlaybackCommandResponse202"
              example:
                command_id: 0b7c9a8e-3f43-4d1a-9b8e-3c2f1a5d6e7f
                target_session_id_text: s1abcdefgh
                expires_at_ms: 1793944805000
        "400":
          description: >-
            Bad request: an unknown command type, a value out of range, `target_session_id_text`
            missing on `take_over` or present on any other command, or `playback_take_over_self`
            (taking over on this device is a local play and claim).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/ApiPlaybackErrorResponse"
        "401":
          description: Unauthorized, or the request names no login session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationErrorResponse"
        "403":
          description: >-
            Membership has expired (`membership_expired`), terms are not accepted, or an API key
            made the request (`api_key_not_allowed`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthorizationErrorResponse"
                  - $ref: "#/components/schemas/TermsAcceptanceRequiredErrorResponse"
                  - $ref: "#/components/schemas/ApiKeyAuthorizationErrorResponse"
        "409":
          description: >-
            `playback_no_active_device` (no device is active for a command other than
            `take_over`), `playback_target_already_active` (`take_over` to the active device),
            `playback_nothing_to_transfer` (`take_over` with nothing loaded),
            `playback_device_not_connected` (the target is not checked in), or
            `playback_command_not_allowed_for_live` (`seek` or `set_rate` while a live item plays).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlaybackErrorResponse"
              example:
                message: No device is playing.
                code: playback_no_active_device
        "429":
          description: Too many playback requests for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerErrorResponse"
        "503":
          description: The playback store is unreachable (`playback_unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlaybackErrorResponse"
  /account/playback/commands/{command_id}/start-failed:
