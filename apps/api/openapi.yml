          type: object
          additionalProperties: true
          description: >-
            Add by RSS episode payload. The API canonicalizes `feed_url` (userinfo removed) and
            computes add_by_rss_hash_id from `feed_url` plus `guid` (or `enclosure_url`), so the
            same episode has one id on every device. A payload without `feed_url` hashes from
            `channel_id_text`. Adding an episode the queue already holds moves that row.
        last_played_at:
          type: string
          format: date-time
        playback_event_kind:
          type: string
          enum:
            - play
            - pause
            - seek
            - progress_tick
            - complete
            - skip
            - sleep_timer_stop
            - queue_add
            - queue_remove
            - queue_reorder
