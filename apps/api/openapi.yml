        status:
          type: string
          nullable: true
          example: PAYER_ACTION_REQUIRED
        approve_url:
          type: string
          nullable: true
          example: https://www.sandbox.paypal.com/checkoutnow?token=5O190127TN364715T
    BillingStrikeCheckoutRequest:
      type: object
      required:
        - processor_product_id
      properties:
        processor_product_id:
          type: integer
          format: int64
          example: 1
        platform:
          type: string
          enum:
            - web
            - foss
            - ios
            - android
          default: web
          description: web and foss create an invoice. ios and android are link-out only.
    BillingStrikeCheckout:
      type: object
      required:
        - checkout_id
