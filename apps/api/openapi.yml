  /account/events:
    get:
      operationId: apiGetAccountEvents
      tags:
        - account
      summary: GET /account/events
      description: >-
        The account's one event stream (server-sent events). Requires login and accepted terms; a
        valid membership is not required. Auth, terms, and stream-limit failures return JSON before
        any stream bytes, and clients treat 401 and 403 as final and stop reconnecting. At most 10
        streams per account per API pod; more get 429. A session-ended `401` on this route leaves
        the `jwt` cookie in place, because `EventSource` cannot read the body; the browser's next
        ordinary request gets the session-ended `401` with its notice and the cleared cookie.
        An API key needs notifications read.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - apiKeyAuth: []
      x-api-key-permission:
        resource: notifications
        action: read
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            Id of the last `notification.created` event the client received. When it is a positive
            integer, the server replays up to 50 notifications created after it, in id order, or
            sends one `notification.resync` when there are more. Any other value is ignored (no
            replay, no error).
          schema:
            type: string
          example: "1042"
        - name: last_event_id
          in: query
          required: false
          description: >-
            Same as `Last-Event-ID`, for clients that cannot set the header. Used only when the
            header is absent.
          schema:
            type: integer
            minimum: 1
          example: 1042
      responses:
        "200":
          description: >-
            An open event stream. The first bytes are `retry: 5000`, then `notification.state`, then
            any replay, then live events. Event names are namespaced: `notification.*`,
            `session.*`, and `playback.*` are in use. Clients ignore event names they do not know.
            The cross-device playback events never carry an SSE `id:` and never replay.
            `playback.snapshot` (`#/components/schemas/ApiPlaybackSnapshot`) holds the devices
            and the state; it is sent after `notification.state` on connect and again after the
            API recovers its Redis subscription, and it replaces the client's playback view.
            `playback.state` (`#/components/schemas/ApiPlaybackState`) and `playback.devices`
            (`#/components/schemas/ApiPlaybackDevices`) are latest-value events sent on change;
            clients apply one only when its `revision` is newer than the one they hold.
            `playback.command` (`#/components/schemas/ApiPlaybackCommandEnvelope`) goes only to the
            target device's streams, and `playback.start_failed`
            (`#/components/schemas/ApiPlaybackStartFailed`) only to the sender's streams.
            The notification events are `notification.state`
            (`#/components/schemas/ApiAccountNotificationStreamState`), `notification.created`
            (`#/components/schemas/ApiAccountNotificationStreamCreated`), `notification.read`
            (`#/components/schemas/ApiAccountNotificationStreamRead`), and `notification.resync`
            (`#/components/schemas/ApiAccountNotificationStreamResync`). `session.ended`
            (`#/components/schemas/ApiAccountSessionStreamEnded`) is the last event on a stream
            whose session was ended, sent with no `id:`; the server ends the response right after
            it. With a notice, clients stop reconnecting and sign out with that reason; with a null
            notice (the device signed itself out), they reconnect as usual. Each event's `data:` is
            one JSON line. Only `notification.created` carries `id:` (the notification id), and
            only events with an id replay. The server writes a `: ping` comment every 25 seconds.
            The stream ends at the auth token's expiry or 30 minutes after it opened, whichever is
            first; clients reconnect with `Last-Event-ID`.
          content:
            text/event-stream:
              schema:
