name: Mobile E2E Stub (non-blocking)

# Manual only: maintainer comments /testmobile on a PR (or Actions workflow_dispatch).
# /testmobile also triggers the server CI workflow (see ci.yml). Do not auto-run on pull_request.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  mobile-e2e-hello-world:
    name: Maestro hello-world smoke (stub)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/testmobile') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Get PR details
        if: github.event_name == 'issue_comment'
        id: pr-comment
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('pr_number', String(context.issue.number));

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && steps.pr-comment.outputs.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@11.13.0

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm run mobile:install

      - name: Prepare E2E simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available | grep -F 'iPhone 17 Pro' >/dev/null || {
            echo "::warning::iPhone 17 Pro simulator is unavailable on this runner. Skipping stub run."
            exit 0
          }
          # ensure-devices.sh clones "iPhone 17 Pro E2E" from the manual sim when missing
          bash scripts/mobile/ensure-devices.sh e2e || {
            echo "::warning::Failed to prepare E2E devices; continuing best-effort."
          }

      - name: Install Maestro CLI
        run: |
          set -euo pipefail
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start Metro (background)
        run: |
          set -euo pipefail
          mkdir -p .artifacts/mobile-e2e-reports
          nohup npm run mobile:dev >.artifacts/mobile-e2e-reports/metro-ci.log 2>&1 &
          echo $! >.artifacts/mobile-e2e-reports/metro.pid
          for _ in $(seq 1 30); do
            if lsof -nP -iTCP:8081 -sTCP:LISTEN >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Metro did not listen on :8081; stub may fail."

      - name: Install app on E2E iOS (--no-bundler)
        run: |
          set -euo pipefail
          npm run mobile:e2e:ios || {
            echo "::warning::E2E iOS install failed; continuing best-effort."
          }

      - name: Run non-blocking mobile E2E stub
        run: |
          set -euo pipefail
          npm run mobile:e2e:test -- hello-world || {
            echo "::warning::mobile:e2e:test failed (stub is non-blocking)."
            exit 0
          }

      - name: Upload mobile E2E artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mobile-e2e-report-stub
          path: .artifacts/mobile-e2e-reports/
          if-no-files-found: warn
