# PRs: verify committed 0003 matches the generator. develop push / manual: regenerate+commit 0003 when needed.
name: Linear SQL baseline (0003)

on:
  # Generation (regen) + verify only when something could change 0003 content or the bootstrap that precedes it.
  push:
    branches: [develop]
    paths:
      - "infra/k8s/ops/source/**"
      - "scripts/database/generate-linear-baseline.sh"
      - "scripts/database/run-linear-migrations.sh"
      - "scripts/database/db.generate-baseline.env"
      - "infra/k8s/base/db/source/bootstrap/0001_create_app_db_users.sh"
      - "infra/k8s/base/db/source/bootstrap/0002_create_management_db_users.sh"
  pull_request:
    branches: [develop]
    paths:
      - "infra/k8s/ops/source/**"
      - "scripts/database/generate-linear-baseline.sh"
      - "scripts/database/verify-linear-baseline.sh"
      - "scripts/database/run-linear-migrations.sh"
      - "scripts/database/db.generate-baseline.env"
      - "infra/k8s/base/db/source/bootstrap/**"
      - "infra/k8s/base/db/kustomization.yaml"
      - "infra/k8s/base/db/statefulset.yaml"
  workflow_dispatch: {}

concurrency:
  group: linear-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Baseline in sync
        run: bash scripts/database/verify-linear-baseline.sh

  # Runs only: push/merge to develop (paths above) and optional manual dispatch. Not on PRs.
  regen:
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[bot]')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: develop
          fetch-depth: 0

      - name: Regenerate 0003 if needed
        run: bash scripts/database/generate-linear-baseline.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          set -e
          if git diff --exit-code -- infra/k8s/base/db/source/bootstrap/0003_linear_baseline.sql; then
            echo "0003 already up to date"
            exit 0
          fi
          git add -- infra/k8s/base/db/source/bootstrap/0003_linear_baseline.sql
          git commit -m "chore(db): refresh linear baseline 0003 [bot]" --no-verify
          git pull --rebase origin develop || true
          git push --no-verify origin develop
