name: i18n Auto-Translate

on:
  push:
    branches: [develop]
    paths:
      - "apps/*/i18n/originals/en-US.json"

# Prevent concurrent pushes to develop - queue instead of cancel
concurrency:
  group: push-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Run i18n translations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run i18n:translate

      - name: Sync override structure
        run: npm run i18n:compile

      - name: Validate i18n files
        run: npm run i18n:validate

      - name: Commit and push if changed
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Debug: Check if token is set (without exposing it)
          if [ -z "$PAT_TOKEN" ]; then
            echo "ERROR: PAT_TOKEN is not set!"
            exit 1
          else
            echo "✓ PAT_TOKEN is set (length: ${#PAT_TOKEN} characters)"
          fi

          # Debug: Show current remote URL (before change)
          echo "Current remote URL:"
          git remote get-url origin || echo "No remote URL found"

          # Configure remote URL with token for authenticated push
          # Use x-access-token prefix for fine-grained tokens (works with classic too)
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          # Debug: Verify remote URL was set (mask token in output)
          echo "Updated remote URL:"
          git remote get-url origin | sed 's/x-access-token:[^@]*@/x-access-token:***@/' || echo "Failed to get remote URL"

          # Debug: Show current branch and status
          echo "Current branch: $(git branch --show-current)"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Actor: ${GITHUB_ACTOR}"

          # Only commit originals and overrides (compiled is generated at build time)
          git add apps/*/i18n/originals/ apps/*/i18n/overrides/

          if git diff --staged --quiet; then
            echo "No translation changes"
          else
            echo "✓ Changes detected, committing..."
            git commit --no-verify -m "chore: auto-generate i18n translations [skip ci]"
            
            # Debug: Show commit info
            echo "Commit created:"
            git log -1 --oneline
            
            # Pull latest changes (in case complete-feature workflow pushed)
            # Use rebase to put our commit on top
            echo "Pulling latest changes..."
            git pull --rebase origin develop || {
              echo "WARNING: git pull --rebase failed, continuing anyway"
              git status
            }
            
            # Debug: Show what we're about to push
            echo "About to push to origin develop"
            echo "Commits to push:"
            git log origin/develop..HEAD --oneline || echo "No commits to push (already up to date?)"
            
            # Attempt push with verbose output
            echo "Attempting push..."
            git push origin develop 2>&1 || {
              echo "ERROR: git push failed"
              echo "Exit code: $?"
              echo "Git status:"
              git status
              echo "Remote info:"
              git remote -v
              exit 1
            }
            
            echo "✓ Successfully pushed to develop"
          fi
