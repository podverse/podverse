name: i18n Auto-Translate

on:
  push:
    branches: [develop]
    paths:
      - "apps/*/i18n/originals/en-US.json"

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      - name: Run i18n translations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run i18n:translate

      - name: Sync override structure
        run: npm run i18n:compile

      - name: Validate i18n files
        run: npm run i18n:validate

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit originals and overrides (compiled is generated at build time)
          git add apps/*/i18n/originals/ apps/*/i18n/overrides/
          if git diff --staged --quiet; then
            echo "No translation changes"
          else
            git commit -m "chore: auto-generate i18n translations [skip ci]"
            git push
          fi
