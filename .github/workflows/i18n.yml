name: i18n Auto-Translate

on:
  push:
    branches: [develop]
    paths:
      - "apps/*/i18n/originals/en-US.json"

# Prevent concurrent pushes to develop - queue instead of cancel
concurrency:
  group: push-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  translate:
    if: "!contains(github.event.head_commit.message, '[bot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              break
            fi
            echo "npm ci failed (attempt $attempt/5); retrying in 15s..." >&2
            sleep 15
            if [[ "$attempt" -eq 5 ]]; then
              exit 1
            fi
          done

      - name: Build packages
        run: npm run build:packages

      - name: Run i18n translations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run i18n:translate

      - name: Sync override structure
        run: npm run i18n:compile

      - name: Validate i18n files
        run: npm run i18n:validate

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Configure remote URL with GitHub App token for authenticated push
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          # Only commit originals and overrides (compiled is generated at build time)
          git add apps/*/i18n/originals/ apps/*/i18n/overrides/

          if git diff --staged --quiet; then
            echo "No translation changes"
          else
            git commit --no-verify -m "chore: auto-generate i18n translations [bot]"
            
            # Pull latest changes (in case complete-feature workflow pushed)
            # Use rebase to put our commit on top
            git pull --rebase origin develop || true
            
            git push --no-verify origin develop
          fi
