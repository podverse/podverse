name: CI

on:
  issue_comment:
    types: [created]

jobs:
  validate:
    # Run when a maintainer comments /test on a PR (manual trigger for external contributors).
    # Dependabot PRs: comment /test to run CI, or add a separate ci-dependabot workflow.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/test') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Get PR details
        id: pr-comment
        uses: actions/github-script@v8
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('pr_number', context.issue.number);

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr-comment.outputs.head_sha }}

      - name: Verify database migrations combined
        id: db-verify
        run: bash scripts/database/verify-migrations-combined.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        id: install
        run: npm ci --include=optional

      - name: Verify parcel watcher runtime (platform preflight)
        run: |
          echo "platform=$(node -p process.platform) arch=$(node -p process.arch)"
          if ! node -e "require('@parcel/watcher')" 2>/dev/null; then
            echo "watcher native binary missing, attempting Linux fallback..."
            WATCHER_VERSION=$(node -p "require('./node_modules/@parcel/watcher/package.json').version")
            echo "Installing @parcel/watcher-linux-x64-glibc@${WATCHER_VERSION}"
            npm install --no-save "@parcel/watcher-linux-x64-glibc@${WATCHER_VERSION}"
          fi
          node -e "require('@parcel/watcher'); console.log('watcher runtime check ok');"

      - name: Verify @next/swc native binding (platform preflight)
        run: |
          echo "platform=$(node -p process.platform) arch=$(node -p process.arch)"
          if ! node - <<'NODE'
          try {
            require('@next/swc-linux-x64-gnu');
            console.log('@next/swc-linux-x64-gnu load check ok');
          } catch (error) {
            console.error('@next/swc-linux-x64-gnu load check failed');
            if (Array.isArray(error?.cause)) {
              for (const entry of error.cause) {
                console.error(`cause: ${entry}`);
              }
            } else if (error?.cause) {
              console.error(`cause: ${error.cause}`);
            }
            process.exit(1);
          }
          NODE
          then
            echo '@next/swc-linux-x64-gnu missing, attempting fallback install...'
            NEXT_VERSION=$(node -p "require('./node_modules/next/package.json').version")
            echo "Installing @next/swc-linux-x64-gnu@${NEXT_VERSION}"
            npm install --no-save "@next/swc-linux-x64-gnu@${NEXT_VERSION}"
          fi
          node -e "require('@next/swc-linux-x64-gnu'); console.log('@next/swc runtime check ok');"

      - name: Verify next-intl @swc/core native binding (platform preflight)
        run: |
          echo "platform=$(node -p process.platform) arch=$(node -p process.arch)"
          if ! node - <<'NODE'
          const path = require('node:path');
          try {
            const nextIntlPkgPath = require.resolve('next-intl/package.json');
            const nextIntlDir = path.dirname(nextIntlPkgPath);
            const swcCorePkgPath = require.resolve('@swc/core/package.json', { paths: [nextIntlDir] });
            const swcCoreDir = path.dirname(swcCorePkgPath);
            require(swcCoreDir);
            console.log(`next-intl @swc/core load check ok (${swcCoreDir})`);
          } catch (error) {
            console.error('next-intl @swc/core load check failed');
            if (Array.isArray(error?.cause)) {
              for (const entry of error.cause) {
                console.error(`cause: ${entry}`);
              }
            } else if (error?.cause) {
              console.error(`cause: ${error.cause}`);
            }
            process.exit(1);
          }
          NODE
          then
            echo '@swc/core Linux native binding missing, attempting fallback install...'
            SWC_CORE_VERSION=$(node - <<'NODE'
          const path = require('node:path');
          const nextIntlPkgPath = require.resolve('next-intl/package.json');
          const nextIntlDir = path.dirname(nextIntlPkgPath);
          const swcCorePkgPath = require.resolve('@swc/core/package.json', { paths: [nextIntlDir] });
          process.stdout.write(require(swcCorePkgPath).version);
          NODE
            )
            echo "Installing @swc/core-linux-x64-gnu@${SWC_CORE_VERSION}"
            npm install --no-save "@swc/core-linux-x64-gnu@${SWC_CORE_VERSION}"
          fi
          node - <<'NODE'
          const path = require('node:path');
          const nextIntlPkgPath = require.resolve('next-intl/package.json');
          const nextIntlDir = path.dirname(nextIntlPkgPath);
          const swcCorePkgPath = require.resolve('@swc/core/package.json', { paths: [nextIntlDir] });
          const swcCoreDir = path.dirname(swcCorePkgPath);
          require(swcCoreDir);
          console.log(`next-intl @swc/core runtime check ok (${swcCoreDir})`);
          NODE

      - name: Build packages
        id: build-packages
        run: npm run build:packages

      - name: Lint
        id: lint
        run: npm run lint

      - name: Pre-build native sanity check
        run: |
          node - <<'NODE'
          const path = require('node:path');
          const checks = [
            { name: '@parcel/watcher', load: () => require('@parcel/watcher') },
            { name: '@next/swc-linux-x64-gnu', load: () => require('@next/swc-linux-x64-gnu') },
            {
              name: 'next-intl @swc/core',
              load: () => {
                const nextIntlPkgPath = require.resolve('next-intl/package.json');
                const nextIntlDir = path.dirname(nextIntlPkgPath);
                const swcCorePkgPath = require.resolve('@swc/core/package.json', { paths: [nextIntlDir] });
                const swcCoreDir = path.dirname(swcCorePkgPath);
                return require(swcCoreDir);
              },
            },
          ];
          let hasFailure = false;
          for (const check of checks) {
            try {
              check.load();
              console.log(`native check ok: ${check.name}`);
            } catch (error) {
              hasFailure = true;
              console.error(`native check failed: ${check.name}`);
              if (Array.isArray(error?.cause)) {
                for (const entry of error.cause) {
                  console.error(`cause: ${entry}`);
                }
              } else if (error?.cause) {
                console.error(`cause: ${error.cause}`);
              }
            }
          }
          if (hasFailure) {
            process.exit(1);
          }
          NODE

      - name: Build apps
        id: build-apps
        run: npm run build:apps

      - name: Report success
        if: success()
        uses: actions/github-script@v8
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ steps.pr-comment.outputs.pr_number }}
        with:
          script: |
            const body = [
              '## ✅ CI Passed',
              '',
              'All checks completed successfully.',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| Database migrations synced | ✅ |',
              '| Dependencies installed | ✅ |',
              '| Build packages | ✅ |',
              '| Lint (type-check, ESLint, Prettier) | ✅ |',
              '| Build apps | ✅ |',
              '',
              `[View full run](${process.env.RUN_URL})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: body
            });

      - name: Set success commit status
        if: success()
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ steps.pr-comment.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'validate',
              description: 'All checks passed',
              target_url: process.env.RUN_URL
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v8
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ steps.pr-comment.outputs.pr_number }}
          DB_VERIFY: ${{ steps.db-verify.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD_PACKAGES: ${{ steps.build-packages.outcome }}
          BUILD_APPS: ${{ steps.build-apps.outcome }}
        with:
          script: |
            const status = (outcome) => {
              if (outcome === 'success') return '✅';
              if (outcome === 'failure') return '❌';
              return '⏭️';
            };

            const body = [
              '## ❌ CI Failed',
              '',
              'One or more checks failed. Please review and fix the issues.',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Database migrations synced | ${status(process.env.DB_VERIFY)} |`,
              `| Dependencies installed | ${status(process.env.INSTALL)} |`,
              `| Build packages | ${status(process.env.BUILD_PACKAGES)} |`,
              `| Lint (type-check, ESLint, Prettier) | ${status(process.env.LINT)} |`,
              `| Build apps | ${status(process.env.BUILD_APPS)} |`,
              '',
              'Legend: ✅ Passed | ❌ Failed | ⏭️ Skipped',
              '',
              `[View full run for details](${process.env.RUN_URL})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: body
            });

      - name: Set failure commit status
        if: failure()
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ steps.pr-comment.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'validate',
              description: 'One or more checks failed',
              target_url: process.env.RUN_URL
            });
