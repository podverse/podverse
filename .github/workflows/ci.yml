name: CI

on:
  issue_comment:
    types: [created]

jobs:
  validate:
    # Run when a maintainer comments /test on a PR (manual trigger for external contributors).
    # Lint includes apps/mobile via scripts/ci/lint-with-summary.mjs (no Maestro / unit E2E in CI —
    # operators run those locally, same policy as web). Dependabot: comment /test or add ci-dependabot.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/test') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Add reaction to comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Get PR details
        id: pr-comment
        uses: actions/github-script@v9
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            core.setOutput('pr_number', context.issue.number);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr-comment.outputs.head_sha }}

      - name: Pull DB test images
        run: |
          set -euo pipefail
          for image in postgres:18.3 node:24-slim; do
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                break
              fi
              echo "Pull failed for $image (attempt $attempt/5); retrying in 15s..." >&2
              sleep 15
              if [[ "$attempt" -eq 5 ]]; then
                exit 1
              fi
            done
          done

      - name: Validate linear migration files
        id: db-verify
        run: bash scripts/database/validate-linear-migrations.sh

      - name: Verify linear baseline 0003
        id: db-baseline-0003
        run: bash scripts/database/verify-linear-baseline.sh

      - name: Verify bootstrap init contract in ephemeral Postgres
        id: db-bootstrap-contract
        run: bash scripts/database/ci-verify-bootstrap-contract.sh

      - name: Enforce no runtime CREATE EXTENSION
        id: db-runtime-extension-guard
        run: bash scripts/database/check-no-runtime-create-extension.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@11.13.0

      - name: Install dependencies
        id: install
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if npm ci; then
              break
            fi
            echo "npm ci failed (attempt $attempt/5); retrying in 15s..." >&2
            sleep 15
            if [[ "$attempt" -eq 5 ]]; then
              exit 1
            fi
          done

      - name: Build packages
        id: build-packages
        run: npm run build:packages

      - name: Lint
        id: lint
        run: npm run lint

      - name: OpenAPI check
        id: openapi-check
        run: npm run openapi:check

      - name: Build apps
        id: build-apps
        run: npm run build:apps

      - name: Test (skipped in CI; run locally)
        id: test
        if: always()
        run: |
          echo "::warning::Tests are intentionally skipped in GitHub Actions for this workflow."
          echo "::warning::Before merge, run locally: make test_deps; npm run test:unit; npm run test:e2e:api; make e2e_test_report (or npm test / npm run test:reports). Mobile unit (standalone install): npm --prefix apps/mobile run test. Mobile E2E: npm run mobile:dev + mobile:e2e:ios + mobile:e2e:android + mobile:e2e:test (see apps/mobile/e2e/HOW-TO-RUN.md)."

      - name: Report success
        if: success()
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ steps.pr-comment.outputs.pr_number }}
        with:
          script: |
            const body = [
              '## ✅ CI Passed',
              '',
              'All checks completed successfully.',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| Linear migration files valid | ✅ |',
              '| Linear baseline 0003 (vs generator) | ✅ |',
              '| Bootstrap init contract (0001/0002/0003/0004) | ✅ |',
              '| Runtime CREATE EXTENSION guard | ✅ |',
              '| Dependencies installed | ✅ |',
              '| Build packages | ✅ |',
              '| Lint (type-check, ESLint, Prettier; includes apps/mobile ESLint) | ✅ |',
              '| OpenAPI check | ✅ |',
              '| Build apps | ✅ |',
              '| Test | ⏭️ Skipped in CI (run locally before merge) |',
              '',
              '### Local tests required before merge',
              '',
              'CI does **not** run unit/API/E2E/mobile suites. From the monorepo root:',
              '',
              '**1. Test infra (Postgres + Valkey on test ports)**',
              '```bash',
              'make test_deps',
              '```',
              '',
              '**2. Unit + API integration + web/management Playwright**',
              '```bash',
              'npm run test:unit',
              'npm run test:e2e:api',
              'make e2e_test_report',
              '```',
              'Or one-shot: `npm run test:reports` (unit → API → Playwright HTML reports).',
              'Scoped web smoke: `make e2e_test_web_report_spec SPEC=e2e/<spec>.spec.ts`.',
              'Hub: `.artifacts/e2e-reports/latest/index.html`.',
              '',
              '**3. Mobile unit tests** (pure modules; `apps/mobile` is a standalone install)',
              '```bash',
              'npm --prefix apps/mobile run test',
              '```',
              '',
              '**4. Mobile Maestro E2E** (separate terminals; see `apps/mobile/e2e/HOW-TO-RUN.md`)',
              '```bash',
              '# First-time devices (if needed)',
              'bash scripts/mobile/ensure-devices.sh e2e',
              '',
              '# T1 — leave running',
              'npm run mobile:dev',
              '# T2 / T3 — install on E2E slots (--no-bundler)',
              'npm run mobile:e2e:ios',
              'npm run mobile:e2e:android',
              '# T4 — run + HTML reports',
              'npm run mobile:e2e:test',
              '```',
              'Open `.artifacts/mobile-e2e-reports/latest/ios-phone/index.html` and `.../android-phone/index.html`.',
              '',
              '**Optional local env** (day-to-day app/dev, not required for `test_deps` / API E2E): `make local_env_prepare` → `make local_env_link` → `make local_env_setup`.',
              '',
              `[View full run](${process.env.RUN_URL})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: body
            });

      - name: Set success commit status
        if: success()
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ steps.pr-comment.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'validate',
              description: 'All checks passed',
              target_url: process.env.RUN_URL
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ steps.pr-comment.outputs.pr_number }}
          DB_VERIFY: ${{ steps.db-verify.outcome }}
          DB_BASELINE_0003: ${{ steps.db-baseline-0003.outcome }}
          DB_BOOTSTRAP_CONTRACT: ${{ steps.db-bootstrap-contract.outcome }}
          DB_RUNTIME_EXTENSION_GUARD: ${{ steps.db-runtime-extension-guard.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          OPENAPI_CHECK: ${{ steps.openapi-check.outcome }}
          BUILD_PACKAGES: ${{ steps.build-packages.outcome }}
          BUILD_APPS: ${{ steps.build-apps.outcome }}
        with:
          script: |
            const status = (outcome) => {
              if (outcome === 'success') return '✅';
              if (outcome === 'failure') return '❌';
              return '⏭️';
            };

            const extra =
              process.env.DB_BASELINE_0003 === 'failure'
                ? [
                    '',
                    '**Linear baseline 0003a/0003b / migration seed 0004:** Regenerate from the repo root, then commit:',
                    '```',
                    'make db_regen_linear_baseline',
                    'make db_verify_linear_baseline',
                    '```',
                    'Or: `bash scripts/database/generate-linear-baseline.sh` then re-run verify as above.',
                    ''
                  ].join('\n')
                : '';

            const body = [
              '## ❌ CI Failed',
              '',
              'One or more checks failed. Please review and fix the issues.',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Linear migration files valid | ${status(process.env.DB_VERIFY)} |`,
              `| Linear baseline 0003 (vs generator) | ${status(process.env.DB_BASELINE_0003)} |`,
              `| Bootstrap init contract (0001/0002/0003/0004) | ${status(process.env.DB_BOOTSTRAP_CONTRACT)} |`,
              `| Runtime CREATE EXTENSION guard | ${status(process.env.DB_RUNTIME_EXTENSION_GUARD)} |`,
              `| Dependencies installed | ${status(process.env.INSTALL)} |`,
              `| Build packages | ${status(process.env.BUILD_PACKAGES)} |`,
              `| Lint (type-check, ESLint, Prettier) | ${status(process.env.LINT)} |`,
              `| OpenAPI check | ${status(process.env.OPENAPI_CHECK)} |`,
              `| Build apps | ${status(process.env.BUILD_APPS)} |`,
              '',
              'Legend: ✅ Passed | ❌ Failed | ⏭️ Skipped',
              '',
              extra,
              `[View full run for details](${process.env.RUN_URL})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(process.env.PR_NUMBER),
              body: body
            });

      - name: Set failure commit status
        if: failure()
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ steps.pr-comment.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'validate',
              description: 'One or more checks failed',
              target_url: process.env.RUN_URL
            });
