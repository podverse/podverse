name: CI

on:
  issue_comment:
    types: [created]

jobs:
  validate:
    # Only run on PR comments containing /test from maintainers
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/test') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Verify database migrations combined
        id: db-verify
        run: bash scripts/database/verify-migrations-combined.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Build packages
        id: build-packages
        run: npm run build:packages

      - name: Lint
        id: lint
        run: npm run lint

      - name: Type check
        id: typecheck
        run: npm run type-check

      - name: Setup env files for web apps
        id: setup-env
        run: |
          cp apps/web/env/local.env apps/web/.env
          cp apps/management-web/env/local.env apps/management-web/.env
          echo "✓ Copied local.env files for CI build"

      - name: Build apps
        id: build-apps
        run: npm run build:apps

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const body = [
              '## ✅ CI Passed',
              '',
              'All checks completed successfully.',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| Database migrations synced | ✅ |',
              '| Dependencies installed | ✅ |',
              '| Build packages | ✅ |',
              '| Lint | ✅ |',
              '| Type check | ✅ |',
              '| Build apps | ✅ |',
              '',
              `[View full run](${process.env.RUN_URL})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Set success commit status
        if: success()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'success',
              context: 'validate',
              description: 'All checks passed',
              target_url: process.env.RUN_URL
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DB_VERIFY: ${{ steps.db-verify.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD_PACKAGES: ${{ steps.build-packages.outcome }}
          BUILD_APPS: ${{ steps.build-apps.outcome }}
        with:
          script: |
            const status = (outcome) => {
              if (outcome === 'success') return '✅';
              if (outcome === 'failure') return '❌';
              return '⏭️';
            };

            const body = [
              '## ❌ CI Failed',
              '',
              'One or more checks failed. Please review and fix the issues.',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Database migrations synced | ${status(process.env.DB_VERIFY)} |`,
              `| Dependencies installed | ${status(process.env.INSTALL)} |`,
              `| Build packages | ${status(process.env.BUILD_PACKAGES)} |`,
              `| Lint | ${status(process.env.LINT)} |`,
              `| Type check | ${status(process.env.TYPECHECK)} |`,
              `| Build apps | ${status(process.env.BUILD_APPS)} |`,
              '',
              'Legend: ✅ Passed | ❌ Failed | ⏭️ Skipped',
              '',
              `[View full run for details](${process.env.RUN_URL})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Set failure commit status
        if: failure()
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.HEAD_SHA,
              state: 'failure',
              context: 'validate',
              description: 'One or more checks failed',
              target_url: process.env.RUN_URL
            });
