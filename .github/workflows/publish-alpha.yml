name: Publish Alpha

on:
  push:
    branches:
      - alpha
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional version override (default: auto-increment from GHCR)"
        required: false
        type: string

jobs:
  # Step 1: Validate everything builds and calculate unified version
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit

      - name: Build all packages
        run: npm run build:packages

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build all apps
        run: npm run build:apps

      - name: Calculate unified version
        id: version
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_REGISTRY_TOKEN }}
        run: |
          # If version override is provided, use it
          if [ -n "${{ inputs.version_override }}" ]; then
            echo "Using version override: ${{ inputs.version_override }}"
            echo "VERSION=${{ inputs.version_override }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get base version from package.json (strip any existing suffix)
          BASE_VERSION=$(node -p "require('./package.json').version" | sed 's/-.*//')
          # Use 'api' as reference image for unified version calculation
          IMAGE_PATH="${{ github.repository }}/api"

          echo "Base version: $BASE_VERSION"
          echo "Reference image path: $IMAGE_PATH"

          # Query GHCR for existing tags
          TAGS_JSON=$(curl -s -H "Authorization: Bearer $GHCR_TOKEN" \
            "https://ghcr.io/v2/${IMAGE_PATH}/tags/list" || echo '{"tags":[]}')

          echo "Raw tags JSON: $TAGS_JSON"

          # Extract alpha tags for this base version
          TAGS=$(echo "$TAGS_JSON" | jq -r '.tags[]?' 2>/dev/null | grep "^${BASE_VERSION}-alpha\." || true)
          echo "Filtered alpha tags for ${BASE_VERSION}: $TAGS"

          # Find the latest alpha version number
          if [ -z "$TAGS" ]; then
            echo "No existing alpha tags found for ${BASE_VERSION}. Starting at alpha.0"
            NEXT_VERSION="${BASE_VERSION}-alpha.0"
          else
            # Get the highest alpha number
            LATEST=$(echo "$TAGS" | sort -t. -k4 -n | tail -n1)
            CURRENT_NUM=$(echo "$LATEST" | sed -En 's/.*alpha\.([0-9]+)$/\1/p')

            if [ -z "$CURRENT_NUM" ]; then
              NEXT_VERSION="${BASE_VERSION}-alpha.0"
            else
              NEXT_NUM=$((CURRENT_NUM + 1))
              NEXT_VERSION="${BASE_VERSION}-alpha.${NEXT_NUM}"
            fi
            echo "Latest existing: $LATEST, incrementing to: $NEXT_VERSION"
          fi

          echo "Unified version for all images: $NEXT_VERSION"
          echo "VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT

  # Step 2: Build and publish base images (web-base, management-web-base)
  # These are used as the builder base for web-deploy and management-web-deploy.
  publish-base-images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: web-base
            dockerfile: apps/web/Dockerfile.base
          - app: management-web-base
            dockerfile: apps/management-web/Dockerfile.base
    steps:
      - uses: actions/checkout@v6

      - name: Get unified version
        id: version
        run: |
          echo "VERSION=${{ needs.validate.outputs.version }}" >> $GITHUB_OUTPUT
          echo "Using unified version: ${{ needs.validate.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Step 3: Build and publish Docker images (parallel)
  # Note: Packages are built from source inside Docker, no npm publishing needed
  publish-docker:
    needs: [validate, publish-base-images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Non-web apps
          - app: api
            dockerfile: apps/api/Dockerfile
          - app: workers
            dockerfile: apps/workers/Dockerfile
          - app: management-api
            dockerfile: apps/management-api/Dockerfile
          # Web apps (runtime config via sidecar)
          - app: web-deploy
            dockerfile: apps/web/Dockerfile
            base_image_name: web-base
          - app: management-web-deploy
            dockerfile: apps/management-web/Dockerfile
            base_image_name: management-web-base
          - app: web-runtime-config
            dockerfile: apps/web/sidecar/Dockerfile
          - app: management-web-runtime-config
            dockerfile: apps/management-web/sidecar/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Get unified version
        id: version
        run: |
          echo "VERSION=${{ needs.validate.outputs.version }}" >> $GITHUB_OUTPUT
          echo "Using unified version: ${{ needs.validate.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            ${{ matrix.base_image_name && format('BASE_IMAGE=ghcr.io/{0}/{1}:{2}', github.repository, matrix.base_image_name, steps.version.outputs.VERSION) }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max
