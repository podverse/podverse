name: Publish Alpha

on:
  push:
    branches:
      - alpha

jobs:
  # Step 1: Validate everything builds
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build all packages
        run: npm run build:packages

      - name: Build all apps
        run: npm run build:apps

  # Step 2: Publish npm packages (sequential by dependency order)
  publish-packages:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build:packages

      # Calculate unified version once for all packages
      - name: Calculate version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version" | sed 's/-.*//')
          UNIFIED_VERSION="$BASE_VERSION-alpha"
          echo "Publishing all packages as $UNIFIED_VERSION"
          echo "VERSION=$UNIFIED_VERSION" >> $GITHUB_OUTPUT

      # 1. helpers (no internal deps)
      - name: Publish helpers
        run: |
          cd packages/helpers
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2. external-services (depends on helpers)
      - name: Publish external-services
        run: |
          cd packages/external-services
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 3. orm (depends on helpers)
      - name: Publish orm
        run: |
          cd packages/orm
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 4. notifications (depends on helpers, external-services)
      - name: Publish notifications
        run: |
          cd packages/notifications
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 5. parser (depends on helpers, external-services, orm)
      - name: Publish parser
        run: |
          cd packages/parser
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 6. mq (depends on all above)
      - name: Publish mq
        run: |
          cd packages/mq
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
          npm publish --tag alpha
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Step 3: Build and publish Docker images (parallel)
  publish-docker:
    needs: publish-packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web, workers, management-api, management-web]
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "VERSION=${{ needs.publish-packages.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max
