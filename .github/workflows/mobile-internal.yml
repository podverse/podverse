# develop branch -> internal channel for .next app.
name: Mobile Internal (develop)

on:
  push:
    branches:
      - develop
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-internal.yml"
  workflow_dispatch:

jobs:
  mobile-internal-build:
    name: EAS internal build (.next)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Pin npm version
        run: npm install -g npm@11.13.0

      - name: Install monorepo dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm run mobile:install

      # Pure-TS unit tests (bridge command serialization + playback error taxonomy). apps/mobile is a
      # standalone install (own lockfile), so it is excluded from root `npm run test:unit`; this is the
      # automated touchpoint for the mobile unit suite. Node-only (no Expo import) — see vitest.config.ts.
      - name: Mobile unit tests
        run: npm --prefix apps/mobile run test

      - name: Verify next-gen app id
        run: |
          set -euo pipefail
          grep -F "com.podverse.app.next" apps/mobile/app.config.ts >/dev/null

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run internal EAS build (stub-safe)
        run: |
          set -euo pipefail
          # Configure EXPO_TOKEN in workflow runtime before enabling real builds.
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::warning::EXPO_TOKEN not set; skipping mobile internal build."
            exit 0
          fi
          if [ ! -f "apps/mobile/eas.json" ]; then
            echo "::warning::apps/mobile/eas.json not present yet; skipping until profiles land."
            exit 0
          fi
          eas build --non-interactive --profile internal --platform all --no-wait --cwd apps/mobile
