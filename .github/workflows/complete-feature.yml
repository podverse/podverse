name: Complete Feature

# Automatically moves LLM history from active/ to completed/ when a PR is merged
on:
  pull_request:
    types: [closed]
    branches: [develop]

# Prevent concurrent pushes to target branch - queue instead of cancel
concurrency:
  group: push-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  complete-history:
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Extract feature name from branch
        id: feature
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          # Extract feature name (remove prefix like feature/, fix/, etc.)
          FEATURE_NAME=$(echo "$BRANCH" | sed 's|^[^/]*/||')
          echo "name=$FEATURE_NAME" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Check for LLM history
        id: check
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          HISTORY_DIR=".llm/history/active/$FEATURE_NAME"

          if [[ -d "$HISTORY_DIR" ]]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Found history directory: $HISTORY_DIR"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No LLM history found for feature: $FEATURE_NAME"
            echo "This is normal if LLM assistance wasn't used."
          fi

      - name: Complete feature history
        if: steps.check.outputs.found == 'true'
        run: |
          FEATURE_NAME="${{ steps.feature.outputs.name }}"
          HISTORY_DIR=".llm/history/active/$FEATURE_NAME"
          DATE=$(date +%Y-%m)

          mkdir -p ".llm/history/completed/$DATE"

          # Update completion date in all markdown files
          for file in "$HISTORY_DIR"/*.md; do
            if [[ -f "$file" ]]; then
              sed -i "s/Completed: In Progress/Completed: $(date +%Y-%m-%d)/" "$file"
            fi
          done

          # Move directory to completed
          mv "$HISTORY_DIR" ".llm/history/completed/$DATE/"
          echo "✓ Moved to .llm/history/completed/$DATE/$FEATURE_NAME/"

      - name: Commit and push
        if: steps.check.outputs.found == 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Debug: Check if token is set (without exposing it)
          if [ -z "$PAT_TOKEN" ]; then
            echo "ERROR: PAT_TOKEN is not set!"
            exit 1
          else
            echo "✓ PAT_TOKEN is set (length: ${#PAT_TOKEN} characters)"
          fi

          # Debug: Show current remote URL (before change)
          echo "Current remote URL:"
          git remote get-url origin || echo "No remote URL found"

          # Configure remote URL with token for authenticated push
          # Use x-access-token prefix for fine-grained tokens (works with classic too)
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          # Debug: Verify remote URL was set (mask token in output)
          echo "Updated remote URL:"
          git remote get-url origin | sed 's/x-access-token:[^@]*@/x-access-token:***@/' || echo "Failed to get remote URL"

          # Debug: Show current branch and status
          echo "Current branch: $(git branch --show-current)"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Actor: ${GITHUB_ACTOR}"
          echo "Target branch: ${{ github.event.pull_request.base.ref }}"

          git add .llm/history/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "✓ Changes detected, committing..."
            git commit --no-verify -m "chore: complete LLM history for ${{ steps.feature.outputs.name }} [skip ci]"
            
            # Debug: Show commit info
            echo "Commit created:"
            git log -1 --oneline
            
            # Pull latest changes (in case i18n workflow pushed)
            echo "Pulling latest changes..."
            git pull --rebase origin ${{ github.event.pull_request.base.ref }} || {
              echo "WARNING: git pull --rebase failed, continuing anyway"
              git status
            }
            
            # Debug: Show what we're about to push
            echo "About to push to origin ${{ github.event.pull_request.base.ref }}"
            echo "Commits to push:"
            git log origin/${{ github.event.pull_request.base.ref }}..HEAD --oneline || echo "No commits to push (already up to date?)"
            
            # Attempt push with verbose output
            echo "Attempting push..."
            git push origin ${{ github.event.pull_request.base.ref }} 2>&1 || {
              echo "ERROR: git push failed"
              echo "Exit code: $?"
              echo "Git status:"
              git status
              echo "Remote info:"
              git remote -v
              exit 1
            }
            
            echo "✓ Committed and pushed history completion"
          fi
