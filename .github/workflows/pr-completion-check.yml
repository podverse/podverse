name: PR Completion Check

on:
  pull_request:
    branches: [develop, alpha, beta, main]
    types: [opened, synchronize, ready_for_review]

jobs:
  check-history-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract feature name from branch
        id: feature
        run: |
          BRANCH="${{ github.head_ref }}"
          FEATURE_NAME=$(echo "$BRANCH" | sed 's|^[^/]*/||')
          echo "name=$FEATURE_NAME" >> $GITHUB_OUTPUT
          echo "history_file=.llm/history/active/$FEATURE_NAME.md" >> $GITHUB_OUTPUT
      
      - name: Check Outcome completion
        run: |
          HISTORY_FILE="${{ steps.feature.outputs.history_file }}"
          if [[ -f "$HISTORY_FILE" ]]; then
            if grep -q "\[To be filled" "$HISTORY_FILE"; then
              echo "::error::LLM history Outcome section is incomplete"
              echo "Please fill in the Outcome section in $HISTORY_FILE before merging."
              exit 1
            fi
            echo "✓ History Outcome is complete"
          else
            echo "::warning::No history file found at $HISTORY_FILE"
          fi
