name: PR Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Label PR based on changed files
        uses: actions/github-script@v7
        with:
          script: |
            // Get all changed files (with pagination)
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            const paths = files.map(f => f.filename);
            console.log(`Found ${paths.length} changed files`);

            // Check specifically for .github files
            const githubFiles = paths.filter(p => p.startsWith('.github/'));
            console.log(`.github/ files found: ${githubFiles.length}`, githubFiles);

            console.log('Sample paths (first 20):', paths.slice(0, 20));

            const labels = new Set();

            // Label definitions with colors
            const labelConfig = {
              'packages': { color: '1d76db', description: 'Changes to packages/' },
              'apps': { color: '0e8a16', description: 'Changes to apps/' },
              'docs': { color: 'fef2c0', description: 'Changes to docs/' },
              'infra': { color: 'd93f0b', description: 'Changes to infra/ or pipelines/' },
              'ci': { color: 'fbca04', description: 'Changes to .github/' },
              'scripts': { color: '5319e7', description: 'Changes to scripts/' },
              'tools': { color: 'e99695', description: 'Changes to tools/' }
            };

            for (const file of paths) {
              if (file.startsWith('packages/')) labels.add('packages');
              if (file.startsWith('apps/')) labels.add('apps');
              if (file.startsWith('docs/')) labels.add('docs');
              if (file.startsWith('infra/') || file.startsWith('pipelines/')) labels.add('infra');
              if (file.startsWith('.github/')) labels.add('ci');
              if (file.startsWith('scripts/')) labels.add('scripts');
              if (file.startsWith('tools/')) labels.add('tools');
            }

            console.log('Labels to add:', Array.from(labels));

            if (labels.size > 0) {
              // Get existing labels in the repo
              const { data: existingLabels } = await github.rest.issues.listLabelsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const existingLabelNames = new Set(existingLabels.map(l => l.name));
              console.log('Existing labels:', Array.from(existingLabelNames));

              // Create any missing labels
              for (const labelName of labels) {
                if (!existingLabelNames.has(labelName)) {
                  console.log(`Creating label: ${labelName}`);
                  try {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name: labelName,
                      color: labelConfig[labelName].color,
                      description: labelConfig[labelName].description
                    });
                  } catch (e) {
                    console.log(`Failed to create label ${labelName}:`, e.message);
                  }
                }
              }

              // Add labels to PR
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: Array.from(labels)
              });
              console.log('Successfully added labels:', Array.from(labels));
            } else {
              console.log('No labels to add - no matching paths found');
            }
