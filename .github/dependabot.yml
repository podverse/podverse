# Dependabot configuration for automated dependency updates
# Targets develop branch - PRs will be created against develop
#
# Node.js: Dependabot has no "LTS only" filter. We adopt new Node LTS on a defined
# schedule (.nvmrc, CI, Dockerfiles) and do not use Dependabot PRs for the official
# `node` Docker image (ignore all `node` image updates below). @types/node is filtered
# to reduce noise from non-LTS odd majors and not-yet-adopted current lines (e.g. 26.x).
#
# Note: This is an alternative to Renovate - use ONE or the other, not both
# Renovate offers better monorepo support if needed

version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    # Only production deps get PRs; dev dep vulnerabilities remain visible as alerts (Security tab).
    allow:
      - dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "@types/node"
        versions:
          - "19.x"
          - "21.x"
          - "23.x"
          - "25.x"
          - "26.x"
          - "27.x"
          - "28.x"
          - "29.x"
          - "30.x"
          - "31.x"
          - "32.x"
    groups:
      # Group minor/patch prod deps together
      production-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      # TypeScript ecosystem - often needs manual attention
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@types/*"
          - "eslint*"

  # Docker images — ignore all updates for the official `node` base image (bump with LTS adoption).
  - package-ecosystem: "docker"
    directory: "/apps/api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "node"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "node"

  - package-ecosystem: "docker"
    directory: "/apps/workers"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "node"

  - package-ecosystem: "docker"
    directory: "/apps/management-api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "node"

  - package-ecosystem: "docker"
    directory: "/apps/management-web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-name: "node"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
