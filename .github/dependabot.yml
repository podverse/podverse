# Dependabot configuration for automated dependency updates
# Targets develop branch - PRs will be created against develop
#
# Node.js: we only care about LTS (even-numbered: 18, 20, 22, 24, 26...).
# Odd-numbered majors are non-LTS and are ignored for node / @types/node.
#
# Note: This is an alternative to Renovate - use ONE or the other, not both
# Renovate offers better monorepo support if needed

version: 2

updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    # Only production deps get PRs; dev dep vulnerabilities remain visible as alerts (Security tab).
    allow:
      - dependency-type: "production"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # Only LTS (even) Node: ignore odd-numbered @types/node versions
    ignore:
      - dependency-name: "@types/node"
        versions: ["19.x", "21.x", "23.x", "25.x", "27.x", "29.x", "31.x"]
    groups:
      # Group minor/patch prod deps together
      production-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      # TypeScript ecosystem - often needs manual attention
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "@types/*"
          - "eslint*"

  # Docker images
  # Docker `versions` use Bundler/Rubygems ranges (GitHub docs), not npm semver like "25.x".
  - package-ecosystem: "docker"
    directory: "/apps/api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    # Only LTS (even) Node: ignore non-LTS odd-numbered versions
    ignore:
      - dependency-name: "node"
        versions: ["19", "21", "23", "25", "27", "29", "31"]

  - package-ecosystem: "docker"
    directory: "/apps/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    # Only LTS (even) Node: ignore non-LTS odd-numbered versions
    ignore:
      - dependency-name: "node"
        versions: ["19", "21", "23", "25", "27", "29", "31"]

  - package-ecosystem: "docker"
    directory: "/apps/workers"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    # Only LTS (even) Node: ignore non-LTS odd-numbered versions
    ignore:
      - dependency-name: "node"
        versions: ["19", "21", "23", "25", "27", "29", "31"]

  - package-ecosystem: "docker"
    directory: "/apps/management-api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    # Only LTS (even) Node: ignore non-LTS odd-numbered versions
    ignore:
      - dependency-name: "node"
        versions: ["19", "21", "23", "25", "27", "29", "31"]

  - package-ecosystem: "docker"
    directory: "/apps/management-web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    # Only LTS (even) Node: ignore non-LTS odd-numbered versions
    ignore:
      - dependency-name: "node"
        versions: ["19", "21", "23", "25", "27", "29", "31"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
