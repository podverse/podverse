# Version: 5
# Child Application: Database
# This application manages the PostgreSQL StatefulSet and persistent storage.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-db
  namespace: argocd
spec:
  project: podverse
  # Live StatefulSets include apiVersion/kind on embedded PVC templates; Git often omits them.
  # Without this, Argo CD stays OutOfSync after sync (API re-injects defaulted fields).
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: podverse-db
      jqPathExpressions:
        - .spec.volumeClaimTemplates[0].apiVersion
        - .spec.volumeClaimTemplates[0].kind
  source:
    # Points to your git repository
    repoURL: https://github.com/podverse/podverse.git
    targetRevision: 5.4.18-staging.4
    # Path to the database manifests (StatefulSet, Service, etc.)
    path: infra/k8s/alpha/db

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Large ConfigMap (linear baseline SQL); client-side apply exceeds metadata.annotations 256KiB cap.
      - ServerSideApply=true
