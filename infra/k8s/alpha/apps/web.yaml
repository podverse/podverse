# Version: 3
# Child Application: Web
# This application manages the frontend web interface for Podverse.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-web
  namespace: argocd
spec:
  project: podverse
  source:
    # Points to your git repository
    repoURL: https://github.com/podverse/podverse.git
    targetRevision: 5.4.18-staging.4
    # Path to the Web manifests (Deployment, Service, ConfigMap)
    path: infra/k8s/alpha/web

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
