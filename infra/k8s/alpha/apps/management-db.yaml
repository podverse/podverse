# Version: 1
# Child Application: Management Database
# This application manages the PostgreSQL StatefulSet and persistent storage for management.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-management-db
  namespace: argocd
spec:
  project: podverse
  source:
    repoURL: https://github.com/podverse/podverse.git
    targetRevision: alpha
    path: k8s/alpha/management-db
  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
