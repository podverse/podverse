# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
# Version: 5
# Application for Ops (maintenance jobs)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-ops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: podverse
  source:
    repoURL: https://github.com/podverse/podverse.git
    targetRevision: X.Y.Z-staging.N

    path: infra/k8s/alpha/ops
  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # App linear-migration ConfigMaps exceed the 256KiB last-applied-configuration annotation.
      - ServerSideApply=true
