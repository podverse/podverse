# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
# Version: 4
# Application for Ops (maintenance jobs and optional keyvaldb-gui)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-ops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: podverse
  source:
    repoURL: https://github.com/podverse/podverse.git
    targetRevision: X.X.X-staging.N

    path: infra/k8s/alpha/ops
  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha
  # keyvaldb-gui defaults to 0 replicas; operators scale to 1 on demand. Do not self-heal away manual scale.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: podverse-keyvaldb-gui
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
