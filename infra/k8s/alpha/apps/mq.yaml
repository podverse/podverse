# Version: 3
# Child Application: Message Queue (RabbitMQ)
# This application manages the MQ broker and the automated queue provisioning.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-mq
  namespace: argocd
spec:
  project: podverse
  source:
    # Points to your git repository
    repoURL: https://github.com/podverse/podverse.git
    targetRevision: X.Y.Z-staging.N
    # Path to the message queue manifests (StatefulSet, Service, Provisioning Job)
    path: infra/k8s/alpha/mq

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
