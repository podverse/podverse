# Version: 1
# Child Application: Management Web
# This application manages the admin management frontend.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podverse-alpha-management-web
  namespace: argocd
spec:
  project: podverse
  source:
    # Points to your git repository
    repoURL: https://github.com/podverse/podverse.git
    targetRevision: staging

    # Path to the Management Web manifests (Deployment, Service, ConfigMap)
    path: infra/k8s/alpha/management-web

  destination:
    server: https://kubernetes.default.svc
    namespace: podverse-alpha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
