# Version: 1
# Filename: kustomization.yaml
# Description: Bundles the cron jobs and exposes the worker image tag via kustomize.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/podverse/podverse//infra/k8d/base/cron?ref=staging
namespace: podverse-alpha

images:
  - name: ghcr.io/podverse/podverse/workers
    newTag: "5.4.12-staging.0"

labels:
  - pairs:
      app: podverse-cron
      environment: alpha
    # This ensures the labels are also applied to the selectors,
    # so the Service correctly finds the Pods.
    includeSelectors: true
