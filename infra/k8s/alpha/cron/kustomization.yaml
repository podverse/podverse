# Version: 1
# Filename: kustomization.yaml
# Description: Bundles the cron jobs and exposes the worker image tag via kustomize.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/podverse/podverse/infra/k8s/base/cron?ref=feature/alpha
namespace: podverse-alpha

images:
  - name: ghcr.io/podverse/podverse-workers/podverse-workers
    newTag: "5.1.28-alpha.0"

labels:
  - pairs:
      app: podverse-cron
      environment: alpha
    # This ensures the labels are also applied to the selectors,
    # so the Service correctly finds the Pods.
    includeSelectors: true
