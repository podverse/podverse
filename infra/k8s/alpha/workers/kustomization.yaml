# Version: 4
# Filename: kustomization.yaml
# Description: Bundles the worker deployments and configmap while centralizing the worker image tag.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/podverse/podverse//infra/k8s/base/workers?ref=X.Y.Z-staging.N

namespace: podverse-alpha

images:
  - name: ghcr.io/podverse/podverse/workers
    newTag: "X.Y.Z-staging.N"
  # Extension sidecar (uncomment with prometheus-sidecar component below):
  # - name: ghcr.io/podverse/podverse/extension-prometheus
  #   newTag: "X.Y.Z-staging.N"

# Optional Prometheus extension sidecar (also set PROMETHEUS_ENABLED=true in podverse-extensions-config):
# components:
#   - ../../base/common/extensions/components/prometheus-sidecar

configMapGenerator:
  - name: podverse-workers-config
    behavior: merge
    envs:
      - source/workers.env

labels:
  - pairs:
      app: podverse-workers
      environment: alpha
    # This ensures the labels are also applied to the selectors,
    # so the Service correctly finds the Pods.
    includeSelectors: true
patches:
  - path: image-shrink-consumer-replicas-patch.yaml
#  - path: log-level-debug.yaml
