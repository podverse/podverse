# Version: 5
# Filename: kustomization.yaml
# Description: Bundles the Web frontend resources and centralizes the web image tag.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/podverse/podverse//infra/k8s/base/web?ref=X.Y.Z-staging.N

namespace: podverse-alpha

labels:
  - pairs:
      app: podverse-web
      environment: alpha
    # This ensures the labels are also applied to the selectors,
    # so the Service correctly finds the Pods.
    includeSelectors: true

# Matches base: podverse-web-config from web.env, podverse-web-runtime-config from web-sidecar.env
configMapGenerator:
  - name: podverse-web-config
    behavior: merge
    envs:
      - source/web.env
  - name: podverse-web-runtime-config
    behavior: merge
    envs:
      - source/web-sidecar.env

images:
  - name: ghcr.io/podverse/podverse/web-deploy
    newTag: "X.Y.Z-staging.N"
  - name: ghcr.io/podverse/podverse/web-runtime-config
    newTag: "X.Y.Z-staging.N"
  # Extension sidecar (uncomment with prometheus-sidecar component below):
  # - name: ghcr.io/podverse/podverse/extension-prometheus
  #   newTag: "X.Y.Z-staging.N"

# Optional Prometheus extension sidecar (also set PROMETHEUS_ENABLED=true in podverse-extensions-config):
# components:
#   - ../../base/common/extensions/components/prometheus-sidecar

patches:
  - path: deployment-link-patch.yaml
  - path: node-configmap-patch.yaml
