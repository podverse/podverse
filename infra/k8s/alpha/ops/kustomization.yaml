# Version: 4
# Description: Bundles ops CronJobs, keyvaldb-gui (optional), and shared label/image control.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/podverse/podverse//infra/k8s/base/ops?ref=X.X.X-staging.N

namespace: podverse-alpha

labels:
  - pairs:
      app: podverse-ops
      environment: alpha
    # This ensures the labels are also applied to the selectors,
    # so the Service correctly finds the Pods.
    includeSelectors: true

images:
  - name: ghcr.io/podverse/podverse/workers
    newTag: "X.X.X-staging.N"
  - name: postgres
    newTag: "18.3"
  - name: redislabs/redisinsight
    newTag: "latest"

# Base keyvaldb GUI `Service` is LoadBalancer; for alpha, use ClusterIP to avoid Argo/LoadBalancer progress hangs.
patches:
  - target:
      kind: Service
      name: podverse-keyvaldb-gui
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: podverse-keyvaldb-gui
      spec:
        type: ClusterIP
