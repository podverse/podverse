# Version: 6
# Filename: kustomization.yaml
# Description: Bundles remote base API, alpha namespace/labels, merged api.env, link patch, and image tag.
# Base (infra/k8s/base/api/deployment.yaml): wait-postgres and wait-keyvaldb TCP initContainers,
# wait-app-migrations, readinessProbe GET /api/v2/health/ready.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/podverse/podverse//infra/k8s/base/api?ref=X.Y.Z-staging.N

# 2. Namespace (optional, ensures all resources are in this namespace)
namespace: podverse-alpha

# 3. Common Labels (Updated to modern 'labels' syntax)
# This tags all resources (Deployment, Service, ConfigMap) with these labels.
labels:
  - pairs:
      app: podverse-api
      environment: alpha
    # This ensures the labels are also applied to the selectors,
    # so the Service correctly finds the Pods.
    includeSelectors: true

# 3. ConfigMap overrides for alpha (non-sensitive defaults in `source/api.env`)
configMapGenerator:
  - name: podverse-api-config
    behavior: merge
    envs:
      - source/api.env

patches:
  - path: deployment-link-patch.yaml

# 4. Image Variables
# We define the specific version here.
images:
  - name: ghcr.io/podverse/podverse/api
    newTag: "X.Y.Z-staging.N"
