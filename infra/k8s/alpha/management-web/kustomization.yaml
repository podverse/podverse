# Version: 5
# Filename: kustomization.yaml
# Description: Bundles the Management Web resources and centralizes the image tag.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/podverse/podverse//infra/k8s/base/management-web?ref=5.4.18-staging.4

namespace: podverse-alpha

labels:
  - pairs:
      app: podverse-management-web
      environment: alpha
    includeSelectors: true

# Matches base: podverse-management-web-config from management-web.env, podverse-management-web-runtime-config from management-web-sidecar.env
configMapGenerator:
  - name: podverse-management-web-config
    behavior: merge
    envs:
      - source/management-web.env
  - name: podverse-management-web-runtime-config
    behavior: merge
    envs:
      - source/management-web-sidecar.env

images:
  - name: ghcr.io/podverse/podverse/management-web-deploy
    newTag: "5.4.18-staging.4"
  - name: ghcr.io/podverse/podverse/management-web-runtime-config
    newTag: "5.4.18-staging.4"

patches:
  - path: deployment-link-patch.yaml
