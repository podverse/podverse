# Version: 3
# Filename: kustomization.yaml
# Description: Bundles resources and acts as the "Variable" manager for images.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/podverse/podverse//infra/k8s/base/keyvaldb?ref=staging
  # Note: We will uncomment the secret line below once you run the generation script
  # - secrets/podverse-keyvaldb-secret.enc.yaml

# 2. Namespace to apply to all resources (optional, but good practice)
namespace: podverse-alpha

labels:
  - pairs:
      app: podverse-keyvaldb
      environment: alpha
    # This ensures the labels are also applied to the selectors,
    # so the Service correctly finds the Pods.
    includeSelectors: true

# 3. Image Variables
# Change the 'newTag' here to update versions across all files.
images:
  - name: valkey/valkey # The placeholder used in 02-deployments.yaml
    newTag: "9.0.1" # The actual version to deploy
  - name: redislabs/redisinsight
    newTag: "latest"

# Base keyvaldDB GUI `Service` is LoadBalancer; for alpha, use ClusterIP to avoid Argo/LoadBalancer progress hangs.
patches:
  - target:
      kind: Service
      name: podverse-keyvaldb-gui
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: podverse-keyvaldb-gui
      spec:
        type: ClusterIP
