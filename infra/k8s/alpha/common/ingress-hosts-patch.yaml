# Version: 3
# Public hostnames use example.com (IANA); replace with your real apex domain in forks/overlays.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podverse-ingress
  namespace: podverse-alpha
  annotations:
    # Tell ArgoCD that this Ingress is "Healthy" even without an IP address immediately
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/compare-options: IgnoreExtraneous

    # Explicitly configure cert-manager and Traefik (overriding any upstream Nginx defaults).
    # Use letsencrypt-staging by default to reduce ACME rate-limit risk while iterating; set
    # cert-manager.io/cluster-issuer to letsencrypt-prod in your GitOps repo when you want production certs.
    cert-manager.io/cluster-issuer: letsencrypt-staging
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - secretName: podverse-alpha-tls
      hosts:
        - api.alpha.example.com
        - alpha.example.com
        - management-api.alpha.example.com
        - management.alpha.example.com
  rules:
    - host: api.alpha.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podverse-api
                port:
                  number: 3000
    - host: alpha.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podverse-web
                port:
                  number: 3002
    - host: management-api.alpha.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podverse-management-api
                port:
                  number: 3100
    - host: management.alpha.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podverse-management-web
                port:
                  number: 3102
