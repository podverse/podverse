# Version: 10
# Example alpha overlay — integrations and extensions disabled by default via base/common.
# Base Deployments envFrom podverse-integrations-config and podverse-extensions-config from base/common.
#
# To enable integrations/extensions in your GitOps repo:
# 1. In common overlay: configMapGenerator behavior merge + source/integrations/ and source/extensions/ overrides.
# 2. On workloads: uncomment prometheus-sidecar component + extension-prometheus image pin;
#    set PROMETHEUS_ENABLED=true (and integration tokens) in merged ConfigMap env.
# 3. See infra/k8s/alpha/examples/optional-extension-metrics/README.md for Prometheus/Grafana.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - https://github.com/podverse/podverse//infra/k8s/base/common?ref=X.Y.Z-staging.N
  - https://github.com/podverse/podverse//infra/k8s/base/product-membership?ref=X.Y.Z-staging.N

patches:
  - path: ingress-hosts-patch.yaml
    target:
      kind: Ingress
      name: podverse-ingress

labels:
  - pairs:
      app: podverse
      environment: alpha
    includeSelectors: true
