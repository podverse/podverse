# Version: 2
# This kustomization file bundles common infrastructure components.
# It includes the namespace, ingress rules, and TLS security policies.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./namespace.yaml
  - github.com/podverse/podverse/infra/k8s/base/common?ref=feature/alpha

patches:
  - path: ingress-hosts-patch.yaml

# Updated from commonLabels to labels
labels:
  - pairs:
      app: podverse
      environment: alpha
    includeSelectors: true
