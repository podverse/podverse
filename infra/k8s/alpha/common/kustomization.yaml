# Version: 6
# Shared podverse-product-membership-config: compose here so one Argo child app owns it; api and
# management-api deployments only reference it via envFrom.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - https://github.com/podverse/podverse//infra/k8s/base/common?ref=X.Y.Z-staging.N
  - https://github.com/podverse/podverse//infra/k8s/base/product-membership?ref=X.Y.Z-staging.N

patches:
  - path: ingress-hosts-patch.yaml
    # Add this target block to force a match regardless of the base namespace
    target:
      kind: Ingress
      name: podverse-ingress

# Updated from commonLabels to labels
labels:
  - pairs:
      app: podverse
      environment: alpha
    includeSelectors: true
