# Version: 1
# Filename: log4j2-configmap.yaml
# Description: Provides a stdout-only log4j2 configuration for the Artemis broker.
#   The default Artemis Docker image writes logs to both stdout and a rolling file
#   under $ARTEMIS_INSTANCE/log/. In Kubernetes the file appender is harmful: logs
#   accumulate on the node overlay filesystem, are invisible to the log aggregation
#   stack (Loki/Promtail etc.), and can exhaust disk — triggering Artemis's
#   max-disk-usage threshold and blocking all message producers.
#
#   This ConfigMap replaces the file appender entirely. Logs go to stdout and are
#   captured by the container runtime for consumption by kubectl/Loki/etc.
#
#   Injected into the JVM via JAVA_ARGS_APPEND in statefulset.yaml so the file
#   generated by "artemis create" at container startup is bypassed cleanly.

apiVersion: v1
kind: ConfigMap
metadata:
  name: podverse-mq-log4j2
data:
  log4j2.properties: |
    # Log4J 2 configuration — stdout only for Kubernetes.
    # File appenders removed; log retention is handled by the container runtime.

    monitorInterval = 5

    rootLogger.level = INFO
    rootLogger.appenderRef.console.ref = console

    logger.activemq.name = org.apache.activemq
    logger.activemq.level = INFO

    logger.artemis_server.name = org.apache.activemq.artemis.core.server
    logger.artemis_server.level = INFO

    logger.artemis_journal.name = org.apache.activemq.artemis.journal
    logger.artemis_journal.level = INFO

    logger.artemis_utils.name = org.apache.activemq.artemis.utils
    logger.artemis_utils.level = INFO

    # CriticalAnalyzer: set to TRACE only for short-term troubleshooting.
    logger.critical_analyzer.name = org.apache.activemq.artemis.utils.critical
    logger.critical_analyzer.level = INFO

    # Audit loggers: disabled by default; change level to INFO to enable.
    logger.audit_base.name = org.apache.activemq.audit.base
    logger.audit_base.level = OFF
    logger.audit_base.appenderRef.console.ref = console
    logger.audit_base.additivity = false

    logger.audit_resource.name = org.apache.activemq.audit.resource
    logger.audit_resource.level = OFF
    logger.audit_resource.appenderRef.console.ref = console
    logger.audit_resource.additivity = false

    logger.audit_message.name = org.apache.activemq.audit.message
    logger.audit_message.level = OFF
    logger.audit_message.appenderRef.console.ref = console
    logger.audit_message.additivity = false

    # Jetty / web console — suppress noise
    logger.jetty.name = org.eclipse.jetty
    logger.jetty.level = WARN

    logger.authentication_filter.name = io.hawt.web.auth.AuthenticationFilter
    logger.authentication_filter.level = ERROR

    # ZooKeeper / Curator (quorum; unused in standalone mode)
    logger.curator.name = org.apache.curator
    logger.curator.level = WARN

    logger.zookeeper.name = org.apache.zookeeper
    logger.zookeeper.level = ERROR

    # Console appender (stdout)
    appender.console.type = Console
    appender.console.name = console
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d %-5level [%logger] %msg%n
