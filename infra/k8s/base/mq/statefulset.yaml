# Version: 4
# The StatefulSet for ActiveMQ Artemis.
# We explicitly set the environment variables for the admin user/password.
# We verify readiness by checking if the console port is responding.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podverse-mq
spec:
  serviceName: "podverse-mq"
  replicas: 1
  selector:
    matchLabels:
      app: podverse-mq
  template:
    metadata:
      labels:
        app: podverse-mq
    spec:
      containers:
        - name: artemis
          # PLACEHOLDER: Kustomize will override this based on the kustomization.yaml file.
          image: apache/activemq-artemis
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 8161
              name: console
            - containerPort: 61616
              name: core

          envFrom:
            - secretRef:
                name: podverse-mq-opaque

          # Direct the JVM to use our ConfigMap-provided log4j2 config (stdout only).
          # This bypasses the file-backed config generated by "artemis create" at startup,
          # preventing log files from accumulating on the node filesystem.
          env:
            - name: JAVA_ARGS_APPEND
              value: "-Dlog4j2.configurationFile=file:/etc/artemis-logging/log4j2.properties"

          # Readiness: management console port is up. Liveness: same (brokers are long-running).
          readinessProbe:
            tcpSocket:
              port: 8161
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8161
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: mq-data
              mountPath: /var/lib/activemq-artemis
            - name: log4j2-config
              mountPath: /etc/artemis-logging/log4j2.properties
              subPath: log4j2.properties
              readOnly: true

          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false

      volumes:
        - name: mq-data
          emptyDir: {}
        - name: log4j2-config
          configMap:
            name: podverse-mq-log4j2
