# Version: 3
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - statefulset.yaml
  - provisioner.job.yaml
  - log4j2-configmap.yaml

configMapGenerator:
  - name: podverse-mq-scripts
    files:
      - provision-queues.sh=source/provision-queues.sh

generatorOptions:
  disableNameSuffixHash: true
