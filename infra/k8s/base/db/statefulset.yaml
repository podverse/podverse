apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podverse-db
spec:
  serviceName: "podverse-db"
  replicas: 1
  selector:
    matchLabels:
      app: podverse-db
  template:
    spec:
      containers:
        - name: postgres
          image: postgres:18.3
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: podverse-db-opaque
            - secretRef:
                name: podverse-management-db-opaque
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: podverse-db-opaque
                  key: DB_APP_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: podverse-db-opaque
                  key: DB_APP_OWNER_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: podverse-db-opaque
                  key: DB_APP_OWNER_PASSWORD
          args:
            - "-c"
            - "max_connections=100"
            - "-c"
            - "superuser_reserved_connections=5"
            - "-c"
            - "shared_buffers=256MB"
            - "-c"
            - "effective_cache_size=2GB"
            - "-c"
            - "maintenance_work_mem=256MB"
            - "-c"
            - "checkpoint_completion_target=0.7"
            - "-c"
            - "wal_buffers=8MB"
            - "-c"
            - "default_statistics_target=100"
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            - "-c"
            - "work_mem=5242kB"
            - "-c"
            - "min_wal_size=256MB"
            - "-c"
            - "max_wal_size=1GB"
            - "-c"
            - "max_worker_processes=2"
            - "-c"
            - "max_parallel_workers_per_gather=2"
            - "-c"
            - "max_parallel_workers=2"

          # Readiness: the server accepts connections for the configured DB. Liveness uses the
          # same check with looser timing so a long crash-recovery does not restart the pod early.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql

            # Init order: 0001 app users, 0002 management users/DB, 0003 shell loads per-DB
            # baselines as each DB owner, 0004 seed linear_migration_history (checksums) so ops migration jobs skip.
            # 1. App DB users
            - name: app-db-init-scripts
              mountPath: /docker-entrypoint-initdb.d/0001_create_app_db_users.sh
              subPath: 0001_create_app_db_users.sh

            # 2. Management DB and users
            - name: management-init-scripts
              mountPath: /docker-entrypoint-initdb.d/0002_create_management_db_users.sh
              subPath: 0002_create_management_db_users.sh

            # 3. Apply app then management schema gzips as migrator roles; extensions are created by owner roles
            # in 0003_apply_linear_baselines.sh.
            - name: db-init-scripts
              mountPath: /docker-entrypoint-initdb.d/0003_apply_linear_baselines.sh
              subPath: 0003_apply_linear_baselines.sh
            - name: db-init-scripts
              mountPath: /linear-baseline/app.sql.gz
              subPath: 0003a_app_linear_baseline.sql.gz
            - name: db-init-scripts
              mountPath: /linear-baseline/management.sql.gz
              subPath: 0003b_management_linear_baseline.sql.gz

            # 4. Populate linear_migration_history rows so forward-only ops jobs skip DDL already in 0003
            - name: db-init-scripts
              mountPath: /docker-entrypoint-initdb.d/0004_seed_linear_migration_history.sql
              subPath: 0004_seed_linear_migration_history.sql

            - name: run-dir
              mountPath: /var/run/postgresql

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true

      volumes:
        - name: app-db-init-scripts
          configMap:
            name: podverse-app-db-init-scripts
        - name: management-init-scripts
          configMap:
            name: podverse-management-init-scripts
        - name: db-init-scripts
          configMap:
            name: podverse-db-init-scripts
        - name: run-dir
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
