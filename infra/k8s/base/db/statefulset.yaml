apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podverse-db
spec:
  serviceName: "podverse-db"
  replicas: 1
  selector:
    matchLabels:
      app: podverse-db
  template:
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: podverse-db-opaque
            - secretRef:
                name: podverse-management-db-opaque
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: podverse-db-opaque
                  key: DB_APP_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: podverse-db-opaque
                  key: DB_APP_ADMIN_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: podverse-db-opaque
                  key: DB_APP_ADMIN_PASSWORD
          args:
            - "-c"
            - "max_connections=100"
            - "-c"
            - "superuser_reserved_connections=5"
            - "-c"
            - "shared_buffers=256MB"
            - "-c"
            - "effective_cache_size=2GB"
            - "-c"
            - "maintenance_work_mem=256MB"
            - "-c"
            - "checkpoint_completion_target=0.7"
            - "-c"
            - "wal_buffers=8MB"
            - "-c"
            - "default_statistics_target=100"
            - "-c"
            - "random_page_cost=1.1"
            - "-c"
            - "effective_io_concurrency=200"
            - "-c"
            - "work_mem=5242kB"
            - "-c"
            - "min_wal_size=256MB"
            - "-c"
            - "max_wal_size=1GB"
            - "-c"
            - "max_worker_processes=2"
            - "-c"
            - "max_parallel_workers_per_gather=2"
            - "-c"
            - "max_parallel_workers=2"

          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql

            # Init order: 0001 app users, 0002 management users/DB, 0003 generated
            # schema snapshot (from ops/source linear chain). Remaining: ops jobs if needed.
            # 1. App DB users
            - name: app-db-init-scripts
              mountPath: /docker-entrypoint-initdb.d/0001_create_app_db_users.sh
              subPath: 0001_create_app_db_users.sh

            # 2. Management DB and users
            - name: management-init-scripts
              mountPath: /docker-entrypoint-initdb.d/0002_create_management_db_users.sh
              subPath: 0002_create_management_db_users.sh

            # 3. Full schema + linear migration history (generated; do not hand-edit the source file)
            - name: db-init-scripts
              mountPath: /docker-entrypoint-initdb.d/0003_linear_baseline.sql
              subPath: 0003_linear_baseline.sql

            - name: run-dir
              mountPath: /var/run/postgresql

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true

      volumes:
        - name: app-db-init-scripts
          configMap:
            name: podverse-app-db-init-scripts
        - name: management-init-scripts
          configMap:
            name: podverse-management-init-scripts
        - name: db-init-scripts
          configMap:
            name: podverse-db-init-scripts
        - name: run-dir
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
