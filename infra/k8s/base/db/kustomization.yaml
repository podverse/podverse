# Version: 4
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: podverse-db-init-scripts
    files:
      - 0000_create_app_db_users.sh=source/0000_create_app_db_users.sh
      - 0001_init_database.sql=source/0001_init_database.sql
  - name: podverse-management-db-init-scripts
    files:
      - 0002_create_management_db_users.sh=source/0002_create_management_db_users.sh
      - 0003_init_management_database.sql=source/0003_init_management_database.sql

generatorOptions:
  disableNameSuffixHash: true
