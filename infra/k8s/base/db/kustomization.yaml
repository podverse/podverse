# Version: 4
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: podverse-db-init-scripts
    files:
      - 0001_create_app_db_users.sh=source/bootstrap/0001_create_app_db_users.sh
  - name: podverse-management-db-init-scripts
    files:
      - 0002_create_management_db_users.sh=source/bootstrap/0002_create_management_db_users.sh

generatorOptions:
  disableNameSuffixHash: true
