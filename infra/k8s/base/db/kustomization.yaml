# Version: 2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: podverse-db-init-scripts
    files:
      - 00_init_database.sql=source/00_init_database.sql
      - 01-create-users.sh=source/01_create_app_users.sh
  - name: podverse-management-db-init-scripts
    files:
      - 00_init_management_database.sql=source/00_init_management_database.sql
      - 01-create-users.sh=source/01_create_management_users.sh

generatorOptions:
  disableNameSuffixHash: true
