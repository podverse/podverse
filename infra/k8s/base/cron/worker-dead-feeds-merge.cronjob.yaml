apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-dead-feeds-merge
  labels:
    app: podverse-workers
    task: dead-feeds
spec:
  suspend: true
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            backup.velero.io/backup-volumes-excludes: "logs-volume,tmp-volume"
        spec:
          containers:
            - name: worker
              image: ghcr.io/podverse/podverse/workers
              command:
                - "node"
                - "apps/workers/dist/index.js"
                - "podcastIndexDeadFeedsFlagAndMerge"
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: podverse-workers-config
                - secretRef:
                    name: podverse-db-opaque
                - secretRef:
                    name: podverse-mq-opaque
                - secretRef:
                    name: podverse-api.podcastindex.org-opaque
                - secretRef:
                    name: podverse-workers-add-by-rss-opaque
              volumeMounts:
                - name: logs-volume
                  mountPath: /logs
                - name: logs-volume
                  mountPath: /opt/logs
                - name: tmp-volume
                  mountPath: /opt/node_modules/podverse-external-services/dist/services/podcast-index/tmp
          volumes:
            - name: logs-volume
              emptyDir: {}
            - name: tmp-volume
              emptyDir: {}
          restartPolicy: OnFailure
