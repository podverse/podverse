apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-dead-feeds-merge
  labels:
    app: podverse-workers
    task: dead-feeds
    podverse-schedule: scheduled
spec:
  suspend: false
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Single attempt per cron tick: the cron schedule is the retry
      # mechanism. In-place container restarts (restartPolicy: OnFailure
      # + default backoffLimit: 6) turn a transient upstream 5xx into
      # CrashLoopBackOff alerts.
      backoffLimit: 0
      activeDeadlineSeconds: 3000
      # Exit 78 is missing startup config: fail the Job without retry.
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: worker
              operator: In
              values:
                - 78
      template:
        metadata:
          annotations:
            backup.velero.io/backup-volumes-excludes: "logs-volume,tmp-volume"
        spec:
          containers:
            - name: worker
              image: ghcr.io/podverse/podverse/workers
              command:
                - "node"
                - "apps/workers/dist/index.js"
                - "podcastIndexDeadFeedsFlagAndMerge"
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: podverse-workers-config
                - secretRef:
                    name: podverse-db-opaque
                - secretRef:
                    name: podverse-mq-opaque
                - secretRef:
                    name: podverse-api.podcastindex.org-opaque
                - secretRef:
                    name: podverse-workers-add-by-rss-opaque
                - secretRef:
                    name: podverse-workers-webpush-opaque
                    optional: true
              volumeMounts:
                - name: logs-volume
                  mountPath: /logs
                - name: logs-volume
                  mountPath: /opt/logs
                - name: tmp-volume
                  mountPath: /tmp
                - name: firebase-key
                  mountPath: /var/secrets/firebase
                  readOnly: true
          volumes:
            - name: logs-volume
              emptyDir: {}
            - name: tmp-volume
              emptyDir: {}
            - name: firebase-key
              secret:
                secretName: podverse-workers-firebase-opaque
                optional: true
          restartPolicy: Never
