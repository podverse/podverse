apiVersion: batch/v1
kind: CronJob
metadata:
  name: worker-image-shrink-backfill
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      # Single attempt per cron tick: the cron schedule is the retry
      # mechanism. In-place container restarts (restartPolicy: OnFailure
      # + default backoffLimit: 6) turn a transient upstream 5xx into
      # CrashLoopBackOff alerts. See <link-to-be-filed>.
      backoffLimit: 0
      template:
        metadata:
          annotations:
            backup.velero.io/backup-volumes-excludes: "logs-volume"
        spec:
          containers:
            - name: worker
              image: ghcr.io/podverse/podverse/workers
              command:
                - "node"
                - "apps/workers/dist/index.js"
                - "imageShrinkBackfill"
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: podverse-workers-config
                - secretRef:
                    name: podverse-db-opaque
                - secretRef:
                    name: podverse-mq-opaque
                - secretRef:
                    name: podverse-workers-add-by-rss-opaque
                - secretRef:
                    name: podverse-workers-webpush-opaque
                    optional: true
                - secretRef:
                    name: podverse-workers-storage-bucket-opaque
              volumeMounts:
                - name: logs-volume
                  mountPath: /logs
                - name: logs-volume
                  mountPath: /opt/logs
                - name: firebase-key
                  mountPath: /var/secrets/firebase
                  readOnly: true
          volumes:
            - name: logs-volume
              emptyDir: {}
            - name: firebase-key
              secret:
                secretName: podverse-workers-firebase-opaque
                optional: true
          restartPolicy: Never
