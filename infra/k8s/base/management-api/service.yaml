# Version: 1
# This Service exposes the Management API internally on port 1999.

apiVersion: v1
kind: Service
metadata:
  name: podverse-management-api
spec:
  type: ClusterIP
  selector:
    app: podverse-management-api
  ports:
    - name: http
      port: 1999
      targetPort: 1999
      protocol: TCP
