# Version: 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-management-api

  annotations:
    # ArgoCD Application endpoint annotation for clickable link
    argocd.argoproj.io/refresh: "hard"
    argocd.argoproj.io/managed-by: "argocd"
    argocd.argoproj.io/compare-options: "IgnoreExtraneous"
    # This is the endpoint that will show up as a clickable link in ArgoCD UI
    link.argocd.argoproj.io/external-link: https://management-api.example.com/ # Override in environment overlay
spec:
  progressDeadlineSeconds: 600
  # replicas: 1
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app: podverse-management-api
  template:
    metadata:
      labels:
        app: podverse-management-api
        environment: base
    spec:
      containers:
        - name: management-api
          image: ghcr.io/podverse/podverse/management-api
          imagePullPolicy: Always
          command: ["node", "apps/management-api/dist/index.js"]
          env:
            - name: NODE_ENV
              value: "production"
          envFrom:
            - configMapRef:
                name: podverse-management-api-config
            - secretRef:
                name: podverse-management-api-opaque
            - secretRef:
                name: podverse-management-db-opaque
            - secretRef:
                name: podverse-db-opaque
          # Container security hardening
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            # Explicitly set UID/GID to satisfy runAsNonRoot when image user is named (node)
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 1999
              name: http
              protocol: TCP
          volumeMounts:
            - name: logs-volume
              mountPath: /opt/logs
          readinessProbe:
            httpGet:
              path: /
              port: 1999
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 1999
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: logs-volume
          emptyDir: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
