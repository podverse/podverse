# Version: 4
# Pattern: Suspended CronJob (Manual Trigger Only)
# DANGER: Drops public schema on both app and management logical databases. Only runs when explicitly triggered.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-db-drop-everything
spec:
  schedule: "* * * * *"
  suspend: true # <--- PREVENTS AUTOMATIC EXECUTION
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60
      template:
        spec:
          containers:
            - name: psql
              image: postgres:18.3
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  export PGHOST="${DB_HOST:-podverse-db}"
                  export PGPORT="${DB_PORT:-5432}"
                  export PGPASSWORD="${DB_APP_OWNER_PASSWORD}"
                  psql -v ON_ERROR_STOP=1 -U "${DB_APP_OWNER_USER}" -d "${DB_APP_NAME}" \
                    -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
                  export PGPASSWORD="${DB_MANAGEMENT_OWNER_PASSWORD}"
                  psql -v ON_ERROR_STOP=1 -U "${DB_MANAGEMENT_OWNER_USER}" -d "${DB_MANAGEMENT_NAME}" \
                    -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

              envFrom:
                - secretRef:
                    name: podverse-db-opaque
                - secretRef:
                    name: podverse-management-db-opaque

              env:
                - name: DB_HOST
                  value: "podverse-db"
                - name: DB_PORT
                  value: "5432"

          restartPolicy: Never
