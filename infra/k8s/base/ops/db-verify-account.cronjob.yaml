# Pattern: Suspended CronJob (Manual Trigger Only)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-db-verify-account
  labels:
    podverse-schedule: manual
spec:
  schedule: "* * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Single attempt: Job default backoffLimit is 6 (creates new pods on failure).
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 60
      template:
        spec:
          containers:
            - name: psql
              image: postgres:18.3
              command:
                - "sh"
                - "-c"
                - >-
                  psql -h "$PODVERSE_DB_SERVICE_HOST" -p "$PODVERSE_DB_SERVICE_PORT" -U "$DB_APP_READ_WRITE_USER" -d "$DB_APP_NAME" -c
                  "UPDATE account SET verified = true where id = 1;"

              # Secret env for the psql session.
              envFrom:
                - secretRef:
                    name: podverse-db-opaque

              # psql reads PGPASSWORD; the secret stores DB_APP_READ_WRITE_PASSWORD.
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: podverse-db-opaque
                      key: DB_APP_READ_WRITE_PASSWORD

          restartPolicy: Never
