# Version: 3
# Pattern: Suspended CronJob (Manual Trigger Only)
# UPDATE: Added PGPASSWORD env var to fix 'no password supplied' error.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-db-verify-account
spec:
  schedule: "* * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Single attempt: Job default backoffLimit is 6 (creates new pods on failure).
      backoffLimit: 0
      ttlSecondsAfterFinished: 60
      template:
        spec:
          containers:
            - name: psql
              image: postgres:18.3
              command:
                - "sh"
                - "-c"
                - >-
                  psql -h "$PODVERSE_DB_SERVICE_HOST" -p "$PODVERSE_DB_SERVICE_PORT" -U "$DB_APP_READ_WRITE_USER" -d "$DB_APP_NAME" -c
                  "UPDATE account SET verified = true where id = 1;"

              # Load all vars (optional, but good for debugging)
              envFrom:
                - secretRef:
                    name: podverse-db-opaque

              # CRITICAL FIX: Map the secret key to PGPASSWORD for psql
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: podverse-db-opaque
                      key: DB_APP_READ_WRITE_PASSWORD

          restartPolicy: Never
