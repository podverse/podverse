# Version: 3
# Pattern: Suspended CronJob (Manual Trigger Only)
# UPDATE: Added PGPASSWORD env var to fix 'no password supplied' error.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-db-verify-all-account
spec:
  schedule: "* * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60
      template:
        spec:
          containers:
            - name: psql
              image: postgres
              command:
                - "sh"
                - "-c"
                - >-
                  psql -h "$PODVERSE_DB_SERVICE_HOST" -p "$PODVERSE_DB_SERVICE_PORT" -U "$DB_READ_WRITE_USERNAME" -d "$DB_DATABASE" -c
                  "UPDATE account SET verified = true;"

              # Load all vars (optional, but good for debugging)
              envFrom:
                - secretRef:
                    name: podverse-db-opaque

              # CRITICAL FIX: Map the secret key to PGPASSWORD for psql
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: podverse-db-opaque
                      key: DB_READ_WRITE_PASSWORD

          restartPolicy: Never
