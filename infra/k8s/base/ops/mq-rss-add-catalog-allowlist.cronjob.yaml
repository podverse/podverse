# Enqueues unstored allowlisted Podcast Index feeds to rss-normal every 15 minutes.
# A caught-up run compares stored ids and returns without directory lookups.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mq-rss-add-catalog-allowlist
  labels:
    podverse-schedule: scheduled
spec:
  schedule: "*/15 * * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Single attempt: Job default backoffLimit is 6 (creates new pods on failure).
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 600
      # Exit 78 is missing startup config: fail the Job without retry.
      podFailurePolicy:
        rules:
          - action: FailJob
            onExitCodes:
              containerName: worker
              operator: In
              values:
                - 78
      template:
        metadata:
          labels:
            app: podverse-ops
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: ghcr.io/podverse/podverse/workers
              command:
                - "node"
                - "apps/workers/dist/index.js"
                - "mqRSSAddCatalogAllowlist"
                - "-q"
                - "rss-normal"
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: podverse-workers-config
                - configMapRef:
                    name: podverse-catalog-config
                - secretRef:
                    name: podverse-db-opaque
                - secretRef:
                    name: podverse-mq-opaque
                - secretRef:
                    name: podverse-api.podcastindex.org-opaque
                - secretRef:
                    name: podverse-workers-add-by-rss-opaque
                - secretRef:
                    name: podverse-workers-webpush-opaque
                    optional: true
              volumeMounts:
                - name: logs-volume
                  mountPath: /logs
                - name: logs-volume
                  mountPath: /opt/logs
                - name: firebase-key
                  mountPath: /var/secrets/firebase
                  readOnly: true
          volumes:
            - name: logs-volume
              emptyDir: {}
            - name: firebase-key
              secret:
                secretName: podverse-workers-firebase-opaque
                optional: true
