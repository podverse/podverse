# Version: 2
# Pattern: Suspended CronJob (Manual Trigger Only)
# Re-runs full StatefulSet bootstrap logic from `0001_create_app_db_users.sh` +
# `0002_create_management_db_users.sh` over TCP (script: rebootstrap-full-bootstrap.sh).
# Run after ops-db-drop-everything or DROP SCHEMA public CASCADE so migrator roles and grants match init.
# Does not apply 0003 linear baselines — migrate jobs remain the forward path.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-db-rebootstrap-roles
spec:
  schedule: "* * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app: podverse-ops
          annotations:
            podverse.fm/ops-job: "db-rebootstrap-roles"
        spec:
          restartPolicy: Never
          containers:
            - name: rebootstrap-roles
              image: postgres:18.3
              imagePullPolicy: Always
              command:
                - bash
                - /opt/scripts/database/rebootstrap-full-bootstrap.sh
              envFrom:
                - secretRef:
                    name: podverse-db-opaque
                - secretRef:
                    name: podverse-management-db-opaque
              env:
                - name: DB_HOST
                  value: "podverse-db"
                - name: DB_PORT
                  value: "5432"
              volumeMounts:
                - name: migration-scripts
                  mountPath: /opt/scripts/database
                  readOnly: true
          volumes:
            - name: migration-scripts
              configMap:
                name: podverse-ops-migration-scripts
                defaultMode: 0555
