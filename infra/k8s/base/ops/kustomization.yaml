apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - db-drop-everything.cronjob.yaml
  - db-migrate-app.cronjob.yaml
  - db-migrate-management.cronjob.yaml
  - db-verify-account.cronjob.yaml
  - db-verify-all-account.cronjob.yaml
  - db-verify-bootstrap-contract.cronjob.yaml
  - keyvaldb-gui.deployment.yaml
  - keyvaldb-gui.service.yaml
  - management-superuser-create.cronjob.yaml
  - management-superuser-update.cronjob.yaml
  - mq-rss-add-trending-podcast-index-50.cronjob.yaml
  - mq-rss-add-trending-podcast-index-1000.cronjob.yaml

# Keep hash suffixes enabled so config content changes produce new names.
# This prevents stale script/migration data from being reused by job pods.
configMapGenerator:
  - name: podverse-ops-migration-scripts
    literals:
      - MIGRATION_BUNDLE_SHA=linear-migrations-v1
    files:
      - source/database/runner/run-linear-migrations.sh
      - source/database/runner/run-linear-migrations-k8s.sh
      - source/database/runner/verify-bootstrap-contract.sh
  - name: podverse-ops-app-linear-migrations
    files:
      - source/database/linear-migrations/app/0000_init_helpers.sql
      - source/database/linear-migrations/app/0001_init_podcasting_20_database.sql
      - source/database/linear-migrations/app/0002_account.sql
      - source/database/linear-migrations/app/0003_clip.sql
      - source/database/linear-migrations/app/0004_playlist.sql
      - source/database/linear-migrations/app/0005_queue.sql
      - source/database/linear-migrations/app/0006_account_following_tables.sql
      - source/database/linear-migrations/app/0007_notifications.sql
      - source/database/linear-migrations/app/0008_purchases_paypal_apple_google.sql
      - source/database/linear-migrations/app/0009_membership_claim_token.sql
      - source/database/linear-migrations/app/0010_stats.sql
      - source/database/linear-migrations/app/0011_on_demand_parser_event.sql
      - source/database/linear-migrations/app/0012_account_settings.sql
      - source/database/linear-migrations/app/0013_add_by_rss_basic_auth.sql
      - source/database/linear-migrations/app/0014_image_shrink_source.sql
      - source/database/linear-migrations/app/0015_metaboost.sql
      - source/database/linear-migrations/app/0016_account_metaboost.sql
      - source/database/linear-migrations/app/0017_feed_flag_status_reason.sql
      - source/database/linear-migrations/app/0018_spam_permit.sql
      - source/database/linear-migrations/app/0019_feed_spam_item_limit_override.sql
      - source/database/linear-migrations/app/0020_image_shrink_last_deep_checked_at.sql
      - source/database/linear-migrations/app/0021_account_trust_and_entitlement_overrides.sql
      - source/database/linear-migrations/app/0022_account_membership_tier_trial_premium.sql
  - name: podverse-ops-management-linear-migrations
    files:
      - source/database/linear-migrations/management/0000_init_helpers.sql
      - source/database/linear-migrations/management/0001_init_admin_accounts.sql
      - source/database/linear-migrations/management/0002_admin_account_permissions.sql
      - source/database/linear-migrations/management/0003_database_audit_log.sql
  - name: podverse-ops-management-superuser-scripts
    files:
      - source/database/management-superuser/package.json
      - source/database/management-superuser/create-superuser.mjs
      - source/database/management-superuser/update-superuser.mjs

images:
  - name: redislabs/redisinsight
    newTag: "latest"
