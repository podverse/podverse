# Version: 1
# Non-sensitive configuration for the Workers.
# Mapped from config/podverse-workers.env.example

apiVersion: v1
kind: ConfigMap
metadata:
  name: podverse-workers-config
  labels:
    app: podverse-workers
    environment: alpha
data:
  #####
  ##### General
  #####
  NODE_ENV: "development"
  USER_AGENT: "Podverse Bot Alpha/Workers/5" # in prod change to "Podverse Bot/Workers/5", in alpha change to "Podverse Bot Alpha/Workers/5", etc.

  #####
  ##### Logs
  #####
  LOG_LEVEL: "info"
  LOG_DIR: ""
  LOG_TIMER: "true"

  #####
  ##### Postgres
  #####
  DB_HOST: "podverse-db"
  DB_PORT: "5432"
  # DB_DATABASE: "postgres"               # in secrets
  # DB_READ_USERNAME: "read"              # in secrets
  # DB_READ_WRITE_USERNAME: "read_write"  # in secrets
  DB_SSL_CONNECTION: "false"

  #####
  ##### Podcast Index
  #####
  PODCAST_INDEX_BASE_URL: "https://api.podcastindex.org/api/1.0"
  #PODCAST_INDEX_AUTH_KEY: ""   # in secrets
  #PODCAST_INDEX_SECRET_KEY: "" # in secrets
  # Optional: Delay in milliseconds between Podcast Index API requests in the parser's remote item handling
  # Default is 200ms if not specified. Set to 0 to disable.
  PODCAST_INDEX_API_RATE_LIMIT_DELAY: "200"

  #####
  ##### Message Queue
  #####
  MESSAGE_QUEUE_PROTOCOL: "amqp"
  MESSAGE_QUEUE_HOST: "podverse-mq"
  MESSAGE_QUEUE_PORT: "5672"
  #MESSAGE_QUEUE_USERNAME: "admin"  # in secrets
  #MESSAGE_QUEUE_PASSWORD: ""       # in secrets

  #####
  ##### KeyValDB (Redis/Valkey)
  #####
  KEYVALDB_HOST: "podverse-keyvaldb"
  KEYVALDB_PORT: "6379"
  # KEYVALDB_PASSWORD: ""  # in secrets (podverse-keyvaldb-opaque)
  KEYVALDB_CACHE_TTL_SECONDS: "900"

  #####
  ##### Google / Firebase
  #####

  GOOGLE_FIREBASE_NOTIFICATIONS_ENABLED: "" # true or undefined
  GOOGLE_FIREBASE_ADMIN_JSON_KEY_PATH: "" # Set as absolute path

  #####
  ##### Website related
  #####
  ### NOTE: these are for the *public facing* IP addresses,
  ### not the internal Docker service network or private IP addresses.
  ### These are used by some services, e.g. Firebase Cloud Messaging, Unified Push.
  WEB_PROTOCOL: "https"
  WEB_DOMAIN: "web.example.com" # Override in environment kustomization.yaml
  WEB_ICON_IMAGE_PATH: "/favicon/web-app-manifest-192x192.png"

  #####
  ##### Default Account Settings
  #####
  # These are used as default values when creating new accounts.
  DEFAULT_ACCOUNT_SETTINGS_LOCALE: "en-US"

  #####
  ##### Parser
  #####

  # IMPORTANT
  # When true, the parser will add remote items to the message queue for processing.
  # The parser will recursively follow all remote items, and their remote items, until it runs out.
  # If a feed is already in the database, it will not add a message for that remote item feed to the queue.
  PARSER_ADD_REMOTE_ITEMS_TO_MQ: "false"

  #####
  ##### Add-by-RSS
  #####
  # Basic Auth credentials for add-by-RSS feeds are stored per-feed in the database
  # (account_following_add_by_rss_channel). Required: 64 hex characters (32 bytes)
  # for AES-256-GCM encryption at rest. Generate with: openssl rand -hex 32
  # ADD_BY_RSS_CREDENTIALS_ENCRYPTION_KEY: ""  # in secrets (podverse-workers-add-by-rss-opaque)

  #####
  ##### DigitalOcean
  #####
  # ACCESS_KEY and SECRET_KEY are in secrets (podverse-workers-digital-ocean-opaque)

  #####
  ##### Image Shrink (storage)
  #####
  IMAGE_CDN_REGION: "nyc3"
  IMAGE_CDN_BUCKET: "podverse-assets-alpha"
  IMAGE_CDN_BASE_URL: "https://podverse-assets-alpha.nyc3.digitaloceanspaces.com"

  #####
  ##### Image Shrink
  #####
  IMAGE_SHRINK_WIDTH_PX: "300"
  IMAGE_SHRINK_BATCH_SIZE: "250"
  IMAGE_SHRINK_CONCURRENCY: "5"
  IMAGE_SHRINK_RPS: "2"
  IMAGE_SHRINK_RECHECK_TTL_SECONDS: "86400"
  IMAGE_SHRINK_SOURCE_PRUNE_DAYS: "30"

  #####
  ##### Image Shrink Orphan Cleanup (optional)
  #####
  IMAGE_SHRINK_ORPHAN_CLEANUP_DRY_RUN: "true"
  IMAGE_SHRINK_ORPHAN_CLEANUP_MAX_DELETE: ""
  IMAGE_SHRINK_ORPHAN_CLEANUP_MIN_AGE_DAYS: "7"
  IMAGE_SHRINK_ORPHAN_CLEANUP_PAGE_SIZE: "500"

  #####
  ##### Web Push (Native)
  #####
  # Native browser push notifications using W3C Push API (no third-party dependency)
  # Generate keys with: npx web-push generate-vapid-keys

  WEBPUSH_ENABLED: "" # true or undefined
  WEBPUSH_VAPID_PUBLIC_KEY: ""
  WEBPUSH_VAPID_PRIVATE_KEY: ""
  WEBPUSH_VAPID_SUBJECT: ""
