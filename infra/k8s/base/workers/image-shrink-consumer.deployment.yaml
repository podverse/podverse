# Version: 1

apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-image-shrink-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-image-shrink-consumer
  template:
    metadata:
      labels:
        app: worker-image-shrink-consumer
    spec:
      containers:
        - name: worker
          image: ghcr.io/podverse/podverse/workers
          command:
            ["node", "apps/workers/dist/index.js", "imageShrinkRunConsumer"]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pidof node || exit 1
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pidof node || exit 1
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: podverse-workers-config
            - secretRef:
                name: podverse-db-opaque
            - secretRef:
                name: podverse-mq-opaque
            #- secretRef:
            #    name: podverse-workers-digital-ocean-opaque
          volumeMounts:
            - name: logs-volume
              mountPath: /logs
            - name: logs-volume
              mountPath: /opt/logs
      volumes:
        - name: logs-volume
          emptyDir: {}
