# Version: 2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - consumer-dlq.deployment.yaml
  - image-shrink-consumer.deployment.yaml
  - listener-live.deployment.yaml
  - parser-add-by-rss-ondemand.deployment.yaml
  - parser-add-by-rss-ondemand-background.deployment.yaml
  - parser-live.deployment.yaml
  - parser-normal.deployment.yaml
  - parser-ondemand.deployment.yaml

configMapGenerator:
  - name: podverse-workers-config
    envs:
      - source/workers.env

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app: podverse-workers
      environment: base
    includeSelectors: true
