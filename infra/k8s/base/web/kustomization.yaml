# Version: 2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - deployment.yaml

configMapGenerator:
  - name: podverse-web-config
    envs:
      - source/web.env
  - name: podverse-web-runtime-config
    envs:
      - source/web-sidecar.env

generatorOptions:
  disableNameSuffixHash: true
