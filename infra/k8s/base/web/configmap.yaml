# Version: 1
# Minimal configuration for the Web frontend container.
# Only RUNTIME_CONFIG_URL and NODE_ENV are needed at runtime; the full set lives in runtime-configmap for the sidecar.

apiVersion: v1
kind: ConfigMap
metadata:
  name: podverse-web-config
data:
  #####
  ##### podverse-web (minimal for main container)
  #####

  NODE_ENV: "production"
  RUNTIME_CONFIG_URL: "http://localhost:3001"
