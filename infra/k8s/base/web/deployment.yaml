# Version: 12
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-web
  annotations:
    argocd.argoproj.io/refresh: "hard"
    argocd.argoproj.io/managed-by: "argocd"
    argocd.argoproj.io/compare-options: "IgnoreExtraneous"
    link.argocd.argoproj.io/external-link: https://web.example.com/
spec:
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app: podverse-web
  template:
    metadata:
      labels:
        app: podverse-web
        environment: base
      annotations:
        backup.velero.io/backup-volumes-excludes: "nextjs-cache"
    spec:
      initContainers:
        - name: wait-api-version-contract
          image: curlimages/curl:8.13.0
          envFrom:
            - configMapRef:
                name: podverse-web-runtime-config
          command:
            - sh
            - -c
            - |
              until curl -fsS "$READINESS_API_BASE_URL$READINESS_API_META_PATH" | grep -F "\"version\":\"$READINESS_API_EXPECTED_VERSION\"" | grep -F "\"release\":\"$READINESS_API_EXPECTED_RELEASE\"" >/dev/null; do
                echo waiting for API contract $READINESS_API_BASE_URL$READINESS_API_META_PATH version=$READINESS_API_EXPECTED_VERSION release=$READINESS_API_EXPECTED_RELEASE
                sleep 2
              done
              echo API version/release contract ready
      containers:
        - name: web
          image: ghcr.io/podverse/podverse/web-deploy
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3002"
          envFrom:
            - configMapRef:
                name: podverse-web-config
            - configMapRef:
                name: podverse-extensions-config
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          ports:
            - containerPort: 3002
              name: http
              protocol: TCP
          volumeMounts:
            - name: nextjs-cache
              mountPath: /opt/app/.next/cache
          livenessProbe:
            httpGet:
              path: /
              port: 3002
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /runtime-config
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: 3002
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
        - name: runtime-config
          image: ghcr.io/podverse/podverse/web-runtime-config
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3001"
          envFrom:
            - configMapRef:
                name: podverse-web-runtime-config
            - configMapRef:
                name: podverse-integrations-config
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - containerPort: 3001
              name: runtime-config
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /runtime-config
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /runtime-config
              port: 3001
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: nextjs-cache
          emptyDir: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
