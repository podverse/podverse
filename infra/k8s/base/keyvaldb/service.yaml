# Version: 3
# Description: Valkey service. RedisInsight (podverse-keyvaldb-gui) is in base/ops.

apiVersion: v1
kind: Service
metadata:
  name: podverse-keyvaldb
  labels:
    app: valkey
spec:
  # Internal traffic only for the database
  type: ClusterIP
  selector:
    app: valkey
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
