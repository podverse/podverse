# Version: 5
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - deployment.yaml

configMapGenerator:
  - name: podverse-keyvaldb-scripts
    files:
      - valkey-entrypoint.sh=source/valkey-entrypoint.sh
      - valkey-healthcheck.sh=source/valkey-healthcheck.sh

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      environment: base
    includeSelectors: true

images:
  - name: valkey/valkey
    newTag: "9.0.1"
  - name: redislabs/redisinsight
    newTag: "latest"
