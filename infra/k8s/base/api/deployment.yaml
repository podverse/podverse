apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-api
  annotations:
    argocd.argoproj.io/refresh: "hard"
    argocd.argoproj.io/managed-by: "argocd"
    argocd.argoproj.io/compare-options: "IgnoreExtraneous"
    link.argocd.argoproj.io/external-link: https://api.example.com/
spec:
  selector:
    matchLabels:
      app: podverse-api
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: "logs-volume"
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z podverse-db 5432; do echo waiting for podverse-db; sleep 2; done; echo podverse-db ready
        - name: wait-keyvaldb
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z podverse-keyvaldb 6379; do echo waiting for podverse-keyvaldb; sleep 2; done; echo podverse-keyvaldb ready
        - name: wait-app-migrations
          image: postgres:18.3
          envFrom:
            - configMapRef:
                name: podverse-api-config
            - secretRef:
                name: podverse-db-opaque
          env:
            - name: DB_HOST
              value: podverse-db
            - name: DB_PORT
              value: "5432"
          command:
            - sh
            - -c
            - |
              until PGPASSWORD="$DB_APP_READ_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_APP_READ_USER" -d "$DB_APP_NAME" -tAc "SELECT to_regclass('public.linear_migration_history') IS NOT NULL" | tr -d '[:space:]' | grep -qx "t"; do
                echo waiting for linear_migration_history table
                sleep 2
              done
              until PGPASSWORD="$DB_APP_READ_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_APP_READ_USER" -d "$DB_APP_NAME" -tAc "SELECT EXISTS (SELECT 1 FROM linear_migration_history WHERE migration_filename = '$API_EXPECTED_MIGRATION_FILENAME')" | tr -d '[:space:]' | grep -qx "t"; do
                echo waiting for app migration $API_EXPECTED_MIGRATION_FILENAME
                sleep 2
              done
              echo app migrations ready
      containers:
        - name: api
          image: ghcr.io/podverse/podverse/api
          command: ["node", "apps/api/dist/index.js"]
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: podverse-api-config
            - secretRef:
                name: podverse-api-opaque
            - secretRef:
                name: podverse-mailer-opaque
                optional: true
            - secretRef:
                name: podverse-metaboost-opaque
            - secretRef:
                name: podverse-db-opaque
            - secretRef:
                name: podverse-keyvaldb-opaque
            - secretRef:
                name: podverse-mq-opaque
            - secretRef:
                name: podverse-api.podcastindex.org-opaque
            - secretRef:
                name: podverse-workers-add-by-rss-opaque
            - secretRef:
                name: podverse-workers-webpush-opaque
                optional: true
          volumeMounts:
            - name: logs-volume
              mountPath: /logs
            - name: logs-volume
              mountPath: /opt/logs
            - name: firebase-key
              mountPath: /var/secrets/firebase
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v2/health/ready
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v2/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: logs-volume
          emptyDir: {}
        - name: firebase-key
          secret:
            secretName: podverse-workers-firebase-opaque
            optional: true
