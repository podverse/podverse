apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-api
  annotations:
    argocd.argoproj.io/refresh: "hard"
    argocd.argoproj.io/managed-by: "argocd"
    argocd.argoproj.io/compare-options: "IgnoreExtraneous"
    link.argocd.argoproj.io/external-link: https://api.example.com/
spec:
  selector:
    matchLabels:
      app: podverse-api
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: "logs-volume"
    spec:
      containers:
        - name: api
          image: ghcr.io/podverse/podverse/api
          command: ["node", "apps/api/dist/index.js"]
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: podverse-api-config
            - secretRef:
                name: podverse-api-opaque
            - secretRef:
                name: podverse-db-opaque
            - secretRef:
                name: podverse-keyvaldb-opaque
            - secretRef:
                name: podverse-mq-opaque
            - secretRef:
                name: podverse-api.podcastindex.org-opaque
            - secretRef:
                name: podverse-workers-add-by-rss-opaque
            - secretRef:
                name: podverse-workers-webpush-opaque
          volumeMounts:
            - name: logs-volume
              mountPath: /logs
            - name: logs-volume
              mountPath: /opt/logs
            - name: firebase-key
              mountPath: /var/secrets/firebase
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: logs-volume
          emptyDir: {}
        - name: firebase-key
          secret:
            secretName: podverse-workers-firebase-opaque
            optional: true
