apiVersion: v1
kind: ConfigMap
metadata:
  name: podverse-api-config
data:
  #####
  ##### podverse-api
  #####

  # NOTE:
  # Use lowercase true to enable properties.
  # Leave value blank or comment out to disable properties.

  #####
  ##### App / General
  #####

  NODE_ENV: "production"
  LOG_LEVEL: "info"
  # No default. Leave empty for console-only (e.g. local/dev or container without file logging).
  # When using Docker with a log volume, set to the container path (e.g. /opt/logs).
  LOG_DIR: ""

  # Must be one of: prod, beta, alpha, local
  SERVER_ENV: "base"

  #####
  ##### API Configuration
  #####

  API_PORT: "1234"
  API_PREFIX: "/api"
  API_VERSION: "/v2"

  # Comma-separated list of allowed CORS origins
  API_ALLOWED_CORS_ORIGINS: "http://podverse-web:3000" # Override in environment kustomization.yaml

  #####
  ##### Auth & Security
  #####

  # Must be a valid UUID - generate with: uuidgen
  ##AUTH_JWT_SECRET: ""                    # in secrets

  # Format: BrandName Bot Environment/AppName/Version
  USER_AGENT: "Podverse Bot base/API/5" # in prod change to "Podverse Bot/API/5", in base change to "Podverse Bot base/API/5", etc.

  # Use the public facing domain, not the internal docker network ip address.
  COOKIE_DOMAIN: ".podvers.fm" # Override in environment kustomization.yaml

  #####
  ##### Web Configuration
  #####

  # Web App TODO: Update these to your actual web app domain and protocol
  BRAND_NAME: "Podverse"
  WEB_PROTOCOL: "http"
  WEB_DOMAIN: "podverse-web:3000"
  WEB_ICON_IMAGE_PATH: "/favicon/web-app-manifest-192x192.png"

  #####
  ##### Database (Postgres)
  #####

  DB_HOST: "podverse-db"
  DB_PORT: "5432"
  # DB_READ_USERNAME: ""                  # in secrets
  # DB_PASSWORD: ""                       # in secrets
  # DB_READ_WRITE_USERNAME: ""            # in secrets
  # DB_READ_WRITE_PASSWORD: ""            # in secrets
  # DB_DATABASE: ""                       # in secrets
  # Set to true for SSL connection
  DB_SSL_CONNECTION: ""

  #####
  ##### Key-value (Valkey)
  #####

  KEYVALDB_HOST: "podverse-keyvaldb"
  KEYVALDB_PORT: "6379"
  ##KEYVALDB_PASSWORD: ""                 # in secrets
  KEYVALDB_CACHE_TTL_SECONDS: "86400" # 1 day

  #####
  ##### Message Queue (RabbitMQ)
  #####

  MESSAGE_QUEUE_PROTOCOL: "amqp"
  MESSAGE_QUEUE_HOST: "podverse-mq"
  ##MESSAGE_QUEUE_USERNAME: "user"
  ##MESSAGE_QUEUE_PASSWORD: "your_mq_password"
  MESSAGE_QUEUE_PORT: "5672"

  #####
  ##### Podcast Index
  #####

  PODCAST_INDEX_BASE_URL: "https://api.podcastindex.org/api/1.0"
  #PODCAST_INDEX_AUTH_KEY: ""             # in secrets
  #PODCAST_INDEX_SECRET_KEY: ""           # in secrets
  # Optional: Delay in milliseconds between Podcast Index API requests in the parser's remote item handling
  # Default is 200ms if not specified. Set to 0 to disable.
  PODCAST_INDEX_API_RATE_LIMIT_DELAY: "200"

  #####
  ##### Auth/Membership
  #####

  # Must be either "sign-up" or "contact-only"
  # "sign-up" - enables user registration (requires mailer config below)
  # "contact-only" - disables user registration
  ACCOUNT_SIGNUP_MODE: "contact-only"

  # Optional premium membership costs (set to 0 for free signups)
  PREMIUM_MEMBERSHIP_COST_MONTHLY: ""
  PREMIUM_MEMBERSHIP_COST_ANNUALLY: ""
  FREE_TRIAL_EXPIRATION: ""

  #####
  ##### Mailer (Required when ACCOUNT_SIGNUP_MODE=sign-up)
  #####

  # Set to true to disable mailer
  MAILER_DISABLED: "true"
  MAILER_HOST: "smtp.example.com"
  MAILER_PORT: "587"
  MAILER_USERNAME: "your_smtp_username"
  MAILER_PASSWORD: "your_smtp_password"
  MAILER_FROM: "noreply@example.com"

  #####
  ##### Email Template (Required when ACCOUNT_SIGNUP_MODE=sign-up)
  #####

  EMAIL_BRAND_COLOR: "#2968B1"
  EMAIL_HEADER_IMAGE_URL: "https://example.com/images/logo.png"
  LEGAL_NAME: "Your Company Name"
  LEGAL_ADDRESS: "Your City, State, Country"

  #####
  ##### Token Expiration (Required when ACCOUNT_SIGNUP_MODE=sign-up)
  #####

  # Values in seconds
  VERIFY_EMAIL_TOKEN_EXPIRATION: "31540000"
  EMAIL_CHANGE_VERIFICATION_TOKEN_EXPIRATION: "31540000"
  RESET_PASSWORD_TOKEN_EXPIRATION: "86400"

  #####
  ##### Page Paths (Required when ACCOUNT_SIGNUP_MODE=sign-up)
  #####

  VERIFY_EMAIL_PAGE_PATH: "/verify-email?token="
  EMAIL_CHANGE_VERIFICATION_PAGE_PATH: "/verify-email-change?token="
  RESET_PASSWORD_PAGE_PATH: "/reset-password?token="

  #####
  ##### Social Media (Optional, used in email templates)
  #####

  SOCIAL_FACEBOOK_PAGE_URL: ""
  SOCIAL_FACEBOOK_IMAGE_URL: ""
  SOCIAL_GITHUB_PAGE_URL: ""
  SOCIAL_GITHUB_IMAGE_URL: ""
  SOCIAL_TWITTER_PAGE_URL: ""
  SOCIAL_TWITTER_IMAGE_URL: ""

  #####
  ##### Add-by-RSS
  #####
  # Basic Auth credentials for add-by-RSS feeds are stored per-feed in the database
  # (account_following_add_by_rss_channel). Required: 64 hex characters (32 bytes)
  # for AES-256-GCM encryption at rest. Generate with: openssl rand -hex 32
  ADD_BY_RSS_CREDENTIALS_ENCRYPTION_KEY: ""

  #####
  ##### Default Account Settings
  #####
  # These are used as default values when creating new accounts.
  DEFAULT_ACCOUNT_SETTINGS_LOCALE: "en-US"

  #####
  ##### PayPal (Optional, for payment processing)
  #####

  PAYPAL_CLIENT_ID: ""
  PAYPAL_CLIENT_SECRET: ""
