# Version: 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podverse-management-web

  annotations:
    # ArgoCD Application endpoint annotation for clickable link
    argocd.argoproj.io/refresh: "hard"
    argocd.argoproj.io/managed-by: "argocd"
    argocd.argoproj.io/compare-options: "IgnoreExtraneous"
    # This is the endpoint that will show up as a clickable link in ArgoCD UI
    link.argocd.argoproj.io/external-link: https://management-web.example.com/ # Override in environment overlay
spec:
  progressDeadlineSeconds: 600
  # replicas: 2
  revisionHistoryLimit: 10
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app: podverse-management-web
  template:
    metadata:
      labels:
        app: podverse-management-web
        environment: base
    spec:
      containers:
        - name: management-web
          image: ghcr.io/podverse/podverse/management-web-deploy
          imagePullPolicy: Always
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3102"
          envFrom:
            - configMapRef:
                name: podverse-management-web-config
          # Container security hardening
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            # Explicitly set UID/GID to satisfy runAsNonRoot when image user is named (node)
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          ports:
            - containerPort: 3102
              name: http
              protocol: TCP
          volumeMounts:
            - name: nextjs-cache
              mountPath: /opt/app/.next/cache
          livenessProbe:
            httpGet:
              path: /
              port: 3102
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3102
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
        - name: runtime-config
          image: ghcr.io/podverse/podverse/management-web-runtime-config
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3101"
          envFrom:
            - configMapRef:
                name: podverse-management-web-config
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - containerPort: 3101
              name: runtime-config
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /runtime-config
              port: 3101
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /runtime-config
              port: 3101
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: nextjs-cache
          emptyDir: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
