# Version: 4
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - deployment.yaml

configMapGenerator:
  - name: podverse-management-web-config
    envs:
      - source/management-web.env
  - name: podverse-management-web-runtime-config
    envs:
      - source/management-web-sidecar.env

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: Service
      name: podverse-management-web
      fieldPath: spec.ports.0.port
    targets:
      - select:
          kind: Service
          name: podverse-management-web
        fieldPaths:
          - spec.ports.0.targetPort
      - select:
          kind: Deployment
          name: podverse-management-web
        fieldPaths:
          - spec.template.spec.containers.0.ports.0.containerPort
          - spec.template.spec.containers.0.readinessProbe.httpGet.port
          - spec.template.spec.containers.0.livenessProbe.httpGet.port
          - spec.template.spec.containers.0.env.1.value # <--- Dynamically updates PORT var
