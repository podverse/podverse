# Version: 1
# This Service exposes the Management Web frontend internally on port 3102.

apiVersion: v1
kind: Service
metadata:
  name: podverse-management-web
spec:
  type: ClusterIP
  selector:
    app: podverse-management-web
  ports:
    - name: http
      port: 3102
      targetPort: 3102
      protocol: TCP
