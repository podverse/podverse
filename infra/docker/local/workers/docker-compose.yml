networks:
  podverse_local_network:
    external: true

services:
  podverse_local_workers:
    build:
      context: ../..
      dockerfile: infra/docker/local/workers/Dockerfile
    image: podverse-workers:latest
    container_name: podverse_local_workers
    env_file:
      - ../../../config/local/workers.env
    networks:
      - podverse_local_network
    logging:
      driver: "json-file"
      options:
        max-file: "1"
        max-size: "50m"
    volumes:
      - ../../../config/google/firebase/firebase-admin.json:/opt/config/google/firebase/firebase-admin.json:ro
      - ../../../../logs/workers:/opt/logs
      - ../../../../infra/data/dev/podcast-index-feeds:/opt/infra/data/dev/podcast-index-feeds
    stop_grace_period: 5m
