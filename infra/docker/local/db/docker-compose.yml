networks:
  podverse_local_network:
    external: true

volumes:
  podverse_local_db_data:

services:
  podverse_local_db:
    image: postgres:18.3
    container_name: podverse_local_db
    env_file:
      - ../../../config/local/db.env
    environment:
      POSTGRES_DB: ${DB_APP_NAME}
      POSTGRES_USER: ${DB_APP_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_APP_OWNER_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - podverse_local_network
    # Bootstrap scripts: same mount targets as K8s statefulset + Metaboost local (official image only runs /docker-entrypoint-initdb.d/* on first init).
    volumes:
      - podverse_local_db_data:/var/lib/postgresql/data
      - ../../../k8s/base/db/source/bootstrap/0001_create_app_db_users.sh:/docker-entrypoint-initdb.d/0001_create_app_db_users.sh:ro
      - ../../../k8s/base/db/source/bootstrap/0002_create_management_db_users.sh:/docker-entrypoint-initdb.d/0002_create_management_db_users.sh:ro
      - ../../../development/seeds/local-dev-account.sql:/opt/database/seed-scripts/local-dev-account.sql
    command: >
      postgres -c max_connections=200
               -c superuser_reserved_connections=20
               -c shared_buffers=512MB
               -c effective_cache_size=6GB
               -c maintenance_work_mem=512MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
               -c work_mem=5242kB
               -c min_wal_size=1GB
               -c max_wal_size=2GB
               -c max_worker_processes=4
               -c max_parallel_workers_per_gather=2
               -c max_parallel_workers=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "${DB_APP_OWNER_USER:-postgres}"']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 15s
    shm_size: 1gb
    logging:
      driver: "json-file"
      options:
        max-file: "1"
        max-size: "50m"
