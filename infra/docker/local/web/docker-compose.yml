networks:
  podverse_local_network:
    external: true

services:
  podverse_local_web:
    build:
      context: ../..
      dockerfile: infra/docker/local/web/Dockerfile
    image: podverse-web:latest
    container_name: podverse_local_web
    depends_on:
      - podverse_local_web_runtime_config
    env_file:
      - ../../../config/local/web.env
    environment:
      PORT: "3002"
    networks:
      - podverse_local_network
    ports:
      - 127.0.0.1:3002:3002
    logging:
      driver: "json-file"
      options:
        max-file: "1"
        max-size: "50m"
  # Sidecar is internal-only: no ports exposed. Only web container reaches it via RUNTIME_CONFIG_URL.
  podverse_local_web_runtime_config:
    image: podverse-web-runtime-config:latest
    container_name: podverse_local_web_runtime_config
    env_file:
      - ../../../config/local/web-sidecar.env
    environment:
      PORT: "3001"
    networks:
      - podverse_local_network
    logging:
      driver: "json-file"
      options:
        max-file: "1"
        max-size: "50m"
