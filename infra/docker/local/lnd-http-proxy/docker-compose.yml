# Local LND HTTP proxy — exposes a plain HTTP endpoint that forwards to LND's HTTPS REST API.
# Injects the admin macaroon automatically so callers need no TLS or auth setup.
# LND credentials are mounted from Nigiri's data directory.
# Set NIGIRI_LND_CREDENTIALS_PATH (Makefile does this: macOS uses Library/Application Support/Nigiri, else ~/.nigiri/regtest).
# Nigiri exposes LND REST on 18080.

services:
  podverse_local_lnd_http_proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podverse_local_lnd_http_proxy
    ports:
      - "8181:8181"
    environment:
      - PORT=8181
      - LND_REST_HOST=host.docker.internal
      - LND_REST_PORT=18080
      - LND_MACAROON_PATH=/lnd-creds/admin.macaroon
      - LND_TLS_CERT_PATH=/lnd-creds/tls.cert
    volumes:
      - ${NIGIRI_LND_CREDENTIALS_PATH:-${HOME}/.nigiri/regtest}/volumes/lnd/data/chain/bitcoin/regtest/admin.macaroon:/lnd-creds/admin.macaroon:ro
      - ${NIGIRI_LND_CREDENTIALS_PATH:-${HOME}/.nigiri/regtest}/volumes/lnd/tls.cert:/lnd-creds/tls.cert:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
