networks:
  podverse_alpha_network:
    external: true

volumes:
  podverse_alpha_keyvaldb_data:

services:
  podverse_alpha_keyvaldb:
    image: valkey/valkey:9.0.1
    container_name: podverse_alpha_keyvaldb
    env_file:
      - ../../../config/alpha/keyvaldb.env
    networks:
      - podverse_alpha_network
    ports:
      - "6379:6379"
    volumes:
      - podverse_alpha_keyvaldb_data:/var/lib/valkey
      - ../../../scripts/keyvaldb:/opt/keyvaldb
    command: ["/opt/keyvaldb/valkey-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "/opt/keyvaldb/valkey-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "syslog"
      options:
        tag: "{{.ImageName}}/{{.Name}}/{{.ID}}"
