# Version: 2
networks:
  podverse_alpha_network:
    external: true

volumes:
  podverse_alpha_db_data:

services:
  podverse_alpha_db:
    image: postgres:18.3
    container_name: podverse_alpha_db
    env_file:
      - ../../../config/alpha/db.env
    environment:
      POSTGRES_DB: ${DB_APP_NAME}
      POSTGRES_USER: ${DB_APP_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_APP_OWNER_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - podverse_alpha_network
    # Bootstrap: same as local + K8s (docker-entrypoint-initdb.d for first init).
    volumes:
      - /mnt/podverse_alpha_db_data:/var/lib/postgresql/data
      - ../../../k8s/base/db/source/bootstrap/0001_create_app_db_users.sh:/docker-entrypoint-initdb.d/0001_create_app_db_users.sh:ro
      - ../../../k8s/base/db/source/bootstrap/0002_create_management_db_users.sh:/docker-entrypoint-initdb.d/0002_create_management_db_users.sh:ro
    command: >
      postgres -c max_connections=100
               -c superuser_reserved_connections=5
               -c shared_buffers=256MB
               -c effective_cache_size=2GB
               -c maintenance_work_mem=256MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=8MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
               -c work_mem=5242kB
               -c min_wal_size=256MB
               -c max_wal_size=1GB
               -c max_worker_processes=2
               -c max_parallel_workers_per_gather=2
               -c max_parallel_workers=2
    restart: unless-stopped
    shm_size: 1gb
    logging:
      driver: "syslog"
      options:
        tag: "{{.ImageName}}/{{.Name}}/{{.ID}}"
